}
function ceIsMechBytes(b){ return [0x21,0x01,0x25,0x23,0x22,0x02].includes(b[0]); }
function ceDescribeState(b){
  const t = b[0], z = ceZonesOfBytes(b);
  const name = CE_TYPE_NAMES[t] !== undefined ? CE_TYPE_NAMES[t] : ('type 0x' + t.toString(16));
  if (t === 0x05 || t === 0x00) return name;
  if (!z.length) return `${name} — no zones set`;
  const lo = z[0], hi = z[z.length - 1];
  if (t === 0x25 || t === 0x23) return `${name} — wall ${lo}→${hi}, ${b[3] === 0 ? 'force 0/7 (weakest — may not be felt)' : `force ${b[3] & 7}/7 (${cePct(b[3])}%)`}`;
  if (t === 0x22 || t === 0x02) return `${name} — draw ${lo}→${hi}, force ${b[3] & 7}/7, snap ${(b[3] >> 3) & 7}/7`;
  if (t === 0x26 || t === 0x06) return `${name} — zones ${lo}–${hi}, ${ceForceLabel(b, lo)}, freq ${b[9]}`;
  return `${name} — zones ${lo}–${hi}, ${ceForceLabel(b, lo)}`;
}
// Mirror of the firmware's run_sequencer (state_mgr.cpp). A set of 2..5 stages
// with AT LEAST ONE mechanical stage (wall/resistance/bow) and DISTINCT start
// zones is sequenced by trigger position. A vibration is a full stage here too:
// it is sorted by its start zone and gets a real position window — this is the
// position gating a lone 0x26 lacks on its own. An all-vibration set, or one with
// duplicate start zones, is NOT sequenced (it falls to the time/rate path), so
// this returns null and the caller treats each state on its own.
function ceActiveWindows(list){
  const n = list.length;
  if (n < 2 || n > 5) return null;
  const isStage = b => ceIsMechBytes(b) || isVibrationType(b[0]);
  if (!list.every(isStage)) return null;          // some other type -> not sequenced
  if (!list.some(ceIsMechBytes)) return null;     // all vibration -> time-based path
  // firmware wall_zones(): an empty zone bitmap defaults to zones 2..8
  const span = b => { const z = ceZonesOfBytes(b); return z.length ? [z[0], z[z.length-1]] : [2, 8]; };
  const ord = list.map((b,i) => { const [lo,hi] = span(b); return { i, lo, hi }; })
                  .sort((a,c) => a.lo - c.lo);
  for (let k = 1; k < ord.length; k++) if (ord[k].lo === ord[k-1].lo) return null; // distinct starts
  const win = {};
  for (let k = 0; k < ord.length; k++){
    const from = k === 0 ? 0 : win[ord[k-1].i].to;
    const to = (k === ord.length - 1) ? 255
             : Math.min(ceZpos(ord[k].hi), ceZpos(ord[k+1].lo) - 12);
    win[ord[k].i] = { from, to, order: k + 1 };
  }
  return win;
}
// Read the firmware's wake diagnostics (cmd 0x16). The wake failure is
// intermittent, so this reports what the device actually observed across the
// sleeps since it was last powered up, rather than leaving us to guess.
// --- Gyro angle check -------------------------------------------------------
// Natural sensitivity converts wrist rotation to mouse counts using the gyro's
// full-scale rating. If that rating were wrong, "1.0x" would be off by a fixed
// ratio and there would be no way to tell from inside a game. So: measure a
// known rotation and compare. Reading field 0x83 also RESETS the counter, which
// is what makes Start work.
// --- Counts-per-360 measurement --------------------------------------------
// The dongle emits an exact number of mouse counts; you report how far the view
// turned. counts_360 = sent * 360 / observed. This is the one number in the
// chain that belongs to the GAME rather than the controller, so it cannot be
// derived - but it can be measured, which beats the guess-and-correct loop.
let CAL_COUNTS = 6500;
// LINEARITY CHECK. If the game receives every count, half the counts must turn
// the view exactly half as far. If it does not, counts are being lost or
// scaled on the way in - by a frame-sampled mouse read, by in-game smoothing,
// or by Windows pointer acceleration - and any counts-per-360 measured through
// that is wrong no matter how carefully the angle is judged. Measuring twice at
// different amounts is the only way to tell that from a genuinely low
// sensitivity, since both simply look like "the view turned less".
async function calSendAmount(n){
  const box = document.getElementById('calbox');
  try {
    if (+config.gyro_output < 1){
      box.innerHTML = '<span style="color:#e0a030">Set Gyro output to Mouse first \u2014 otherwise there is no mouse for the counts to move.</span>';
      return;
    }
    CAL_COUNTS = n;
    // Sending the FULL amount starts a new measurement run, so the previous
    // run's readings are discarded. Without this they persisted: a second
    // attempt found both amounts already recorded, skipped asking for the
    // check, and compared the new reading against a stale one from before.
    if (n === 6500) window._calLast = {};
    box.innerHTML = `Switch to the game NOW \u2014 sending ${n} counts in 3s\u2026`;
    await sleep(3000);
    await hidLocked(() => writeField(0x86, 'u16', n));
    box.innerHTML = `Sent <b>${n}</b> counts to the right (the sweep takes a few seconds). Type how far the view turned, then press 3.`;
  } catch(e){ box.innerHTML = 'Could not send: ' + e.message; }
}
async function calSend(){ return calSendAmount(6500); }
async function calSendHalf(){ return calSendAmount(3250); }
function calCompute(){
  const box = document.getElementById('calbox');
  const obs = parseFloat(document.getElementById('calobs').value);
  if (!isFinite(obs) || obs <= 0){ box.innerHTML = 'Enter the degrees the view actually turned.'; return; }
  const c360 = Math.round(CAL_COUNTS * 360 / obs);
  window._calLast = window._calLast || {};
  window._calLast[CAL_COUNTS] = obs;
  const recorded = Object.keys(window._calLast).sort((x, y) => y - x)
    .map(k => `${k} \u2192 ${window._calLast[k]}\u00b0`).join(', ');
  if (c360 < 500 || c360 > 50000){
    box.innerHTML = `<span style="color:#e0a030">That works out to ${c360}, outside the sensible range. Check the game had focus and that mouse acceleration is off, then try again.</span>`;
    return;
  }
  // If both amounts have been measured, check they agree.
  let lin = '';
  const a = window._calLast[6500], b = window._calLast[3250];
  if (a && b){
    const ratio = a / b;                       // should be 2.0
    lin = (ratio > 1.8 && ratio < 2.2)
      ? `<br><span style="color:#4ade80">Linearity OK: half the counts turned half as far (${ratio.toFixed(2)}x), so the game is receiving every count and this number is trustworthy.</span>`
      : `<br><span style="color:#e0a030">Half the counts turned ${ratio.toFixed(2)}x less, not 2x. Counts are being lost or scaled on the way in \u2014 turn OFF in-game mouse smoothing/acceleration and Windows "Enhance pointer precision", then measure again. Until this reads about 2x, any counts-per-360 from here will be too high.</span>`;
  } else {
    lin = `<br><span style="color:var(--sub)">Now press <b>Send 3250</b> and measure again: half the counts should turn half as far. If they do not, counts are being lost and this number is too high \u2014 that check matters more than judging the angle precisely.</span>`;
  }
  box.innerHTML = `<span style="color:var(--sub)">Recorded this run: ${recorded} ` +
    `<a href="#" onclick="calReset();return false;">clear</a></span><br>` +
    `This game needs <b>${c360}</b> counts per 360\u00b0.` +
    ` <button class="btn" style="padding:2px 10px;font-size:12px" onclick="calApply(${c360})">Apply it</button>` +
    lin;
}
function calReset(){
  window._calLast = {};
  const box = document.getElementById('calbox');
  if (box) box.innerHTML = 'Cleared. Press <b>Send 6500</b> to start a fresh measurement.';
}
async function calApply(v){
  const box = document.getElementById('calbox');
  try {
    config.flick_counts_360 = v;
    (window._dirty = window._dirty || {})['flick_counts_360'] = 1;
    await hidLocked(() => writeField(0x74, 'u16', v));
    window._calLast = {};   // applied: the run is finished
    box.innerHTML = `Set to <b>${v}</b>. Save to keep it, or it reverts on the next profile load.`;
    render();
  } catch(e){ box.innerHTML = 'Could not apply: ' + e.message; }
}

async function gyroAngleStart(){
  const box = document.getElementById('gyroangle');
  // A FULL TURN, not a quarter. Judging 90 degrees by eye is the least accurate
  // part of this measurement - a few degrees of human error is several percent
  // of the answer. A 360 ends where it started, so you can line the controller
  // up with the same edge of a desk or door frame and know you are within a
  // degree or two, and the error is spread over four times the angle.
  try {
    await hidLocked(() => readField(0x83, 'u16'));   // read = reset
  } catch(e){ if (box) box.innerHTML = 'Could not start: ' + e.message; return; }
  for (let s = 8; s > 0; s--){
    if (box) box.innerHTML = `<b>Turn now</b> \u2014 one full turn (360\u00b0) to the right, ending pointing exactly where you started. Keep the pad level, then hold still. <b>${s}s</b>`;
    await sleep(1000);
  }
  if (box) box.innerHTML = 'Reading\u2026';
  try {
    const raw = await hidLocked(() => readField(0x83, 'u16'));
    let hz = 0;
    try { hz = await hidLocked(() => readField(0x85, 'u16')); } catch(e) {}
    const deg = raw / 10;
    if (deg < 60){
      box.innerHTML = `Measured ${deg.toFixed(1)}\u00b0 \u2014 too little to judge. Press Measure and make a complete turn during the countdown.`;
      return;
    }
    const err  = (deg - 360) / 360 * 100;
    const trim = Math.round(360 / deg * 100);
    let verdict;
    if (Math.abs(err) <= 5){
      verdict = `<span style="color:#4ade80">Within 5% of a full turn \u2014 the scale is right. Leave the trim at 100.</span>`;
    } else {
      verdict = `<span style="color:#e0a030">The gyro reads ${deg > 360 ? 'high' : 'low'} by ${Math.abs(err).toFixed(0)}%. Set <b>Gyro scale trim</b> to <b>${trim}</b> in the Gyro tab, then 1.0\u00d7 is true 1:1 and every multiplier is honest.</span>`;
    }
    box.innerHTML = `Measured <b>${deg.toFixed(1)}\u00b0</b> for one full turn.<br>${verdict}` +
      `<br><span style="color:var(--sub)">Gyro samples arrived at ${hz || '?'} Hz during the turn. ` +
      `Line the controller up with a desk edge or door frame and return to it exactly. Repeat two or three times and average \u2014 readings within a few percent of each other mean the measurement is sound. The total counts rotation in BOTH directions, so turn one way only and hold still until the countdown ends.</span>`;
  } catch(e){ box.innerHTML = 'Could not read: ' + e.message; }
}

// 0x9e is a COMMAND, not a stored field: it starts a stage's blink on the
// device. The dongle blinks its SAVED colours, so an unsaved edit will not show.

// One row per stage: level, blinks, colour, on/off, test. Every control writes
// straight into config[...] - the same values the generic renderer would have
// written - so saving, profiles and slot backups need no special case.
const BATT_LEVELS = [[0,'\u2014'],[1,'10%'],[2,'20%'],[3,'30%'],[4,'40%'],[5,'50%'],
                     [6,'60%'],[7,'70%'],[8,'80%'],[9,'90%'],[10,'100%']];
function battHex(i){
  const h = v => ((+config['batt_stage_' + v + '_' + i] || 0) & 0xff).toString(16).padStart(2,'0');
  return '#' + h('r') + h('g') + h('b');
}
// The picker hands back #rrggbb; split it into the three bytes the firmware
// stores. Written as one change so a colour edit is a single undoable step.
// Mirrors exactly what a generic field row does on change: set the value and
// mark it dirty, so the existing save path picks it up with no special case.
function battSet(key, v){
  config[key] = +v || 0;
  (window._dirty = window._dirty || {})[key] = 1;
}
function battColour(i, hex){
  const m = /^#([0-9a-f]{2})([0-9a-f]{2})([0-9a-f]{2})$/i.exec(hex || '');
  if (!m) return;
  battSet('batt_stage_r_' + i, parseInt(m[1],16));
  battSet('batt_stage_g_' + i, parseInt(m[2],16));
  battSet('batt_stage_b_' + i, parseInt(m[3],16));
  render();
}
// The explanatory text and the rows, drawn inside the Battery Notification
// card itself.
function battStagesPanelHTML(){
  return '<div style="font-size:12px;color:var(--sub);margin-top:6px">' +
         'Each stage fires once when the battery falls past its level, pulses that colour, and stops. ' +
         'Levels are 10% steps because that is how the controller reports its charge. It is a gentle pulse that ' +
         'fades up and back down, about 1.6 seconds each, not a hard flash.</div>' +
         '<div style="margin-top:8px">' + battStagesHTML() + '</div>' +
         // Below the rows, where it is read just before reaching for Test, and
         // bold because missing it means testing the PREVIOUS settings and
         // concluding the feature does not work.
         '<div id="batttest" style="font-size:12px;margin-top:8px">' +
         '<b>Test uses the settings already saved to the dongle, so save first.</b></div>';
}
function battStagesHTML(){
  let h = '';
  for (let i = 0; i < 3; i++){
    // Keys are built here and interpolated WHOLE into the markup, so each
    // handler carries a literal config['batt_stage_...'] exactly as a generic
    // field row would. That is not cosmetic: the render harness proves every
    // setting is reachable by scanning for those literals, and a key assembled
    // inside the handler would be invisible to it - the setting would look
    // unreachable while working perfectly, or worse, be genuinely unreachable
    // and still pass.
    const kOn = 'batt_stage_on_' + i, kLv = 'batt_stage_level_' + i, kBl = 'batt_stage_blinks_' + i;
    const kR = 'batt_stage_r_' + i, kG = 'batt_stage_g_' + i, kB = 'batt_stage_b_' + i;
    const on = (+config[kOn] || 0) === 1;
    const dis = on ? '' : ' disabled';
    const dirty = k => "(window._dirty=window._dirty||{})['" + k + "']=1";
    h += '<div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:6px 0;border-top:1px solid var(--line,#333)">';
    h += '<label style="min-width:78px"><input type="checkbox"' + (on ? ' checked' : '') +
         ' onchange="config[\'' + kOn + '\']=this.checked?1:0;' + dirty(kOn) + ';render()"> Stage ' + (i+1) + '</label>';
    h += '<span style="font-size:12px;color:var(--sub)">at</span>';
    h += '<select' + dis + ' onchange="config[\'' + kLv + '\']=+this.value;' + dirty(kLv) + '">';
    for (const [v,lab] of BATT_LEVELS)
      h += '<option value="' + v + '"' + ((+config[kLv] || 0) === v ? ' selected' : '') + '>' + lab + '</option>';
    h += '</select>';
    h += '<span style="font-size:12px;color:var(--sub)">pulses</span>';
    h += '<input type="number" min="1" max="20" style="width:64px" value="' + (+config[kBl] || 5) + '"' + dis +
         ' onchange="config[\'' + kBl + '\']=cfgClampNum(this,1,20,false);' + dirty(kBl) + '">';
    h += '<span style="font-size:12px;color:var(--sub)">colour</span>';
    h += '<input type="color" style="width:46px;height:26px;padding:0;border:1px solid var(--line,#333);background:none" value="' +
         battHex(i) + '"' + dis + ' onchange="battColour(' + i + ', this.value)">';
    // The picker writes three bytes at once, so the literals the harness needs
    // live here. Same device as the macro_disable hidden input above.
    h += '<input type="hidden" oninput="config[\'' + kR + '\']=+this.value" value="' + (+config[kR]||0) + '">';
    h += '<input type="hidden" oninput="config[\'' + kG + '\']=+this.value" value="' + (+config[kG]||0) + '">';
    h += '<input type="hidden" oninput="config[\'' + kB + '\']=+this.value" value="' + (+config[kB]||0) + '">';
    h += '<button class="btn btn-outline" style="padding:2px 10px"' + (device ? '' : ' disabled') +
         ' onclick="battTest(' + i + ')">Test</button>';
    h += '</div>';
  }
  return h;
}
// 0x9e is a COMMAND, not a stored field: it starts a stage's blink on the
// device. The dongle blinks its SAVED colours, so an unsaved edit will not show.

// One row per stage: level, blinks, colour, on/off, test. Every control writes
// straight into config[...] - the same values the generic renderer would have
// written - so saving, profiles and slot backups need no special case.
async function battTest(stage){
  const el = document.getElementById('batttest');
  if (!device){ if (el) el.textContent = 'No device.'; return; }
  try {
    await hidLocked(() => sendCmd(0x01, [0x9e, stage & 0xff]));
    if (el) el.textContent = 'Running stage ' + (stage+1) + ' on the controller.';
  } catch(e){ if (el) el.textContent = 'Test failed: ' + e; }
}
async function readWakeDiag(){
  const box = document.getElementById('wakediag');
  if (box) box.innerHTML = 'Reading…';
  try {
    const r = await hidLocked(async () => {
      await sendCmd(0x16, []);
      return await readCmdReplyOn(SLOT_REPORT, 0x16, undefined, 12);
    });
    if (!r || r[2] !== 0x00) throw new Error('device did not answer');
    const u16 = i => r[i] | (r[i+1] << 8);
    const d = { cb: u16(3), recSusp: u16(5), recRes: u16(7), disc: u16(9),
                wakes: u16(11), dcd: u16(13), rwEn: r[15], discOk: r[16],
                tudOk: r[17], wakeSusp: r[18], nowSusp: r[19], reissue: u16(20),
                c: { req: r[22], acc: r[23], dcd: r[24], reiss: r[25], resumed: r[26],
                     key: r[27], hidWait: r[28], hidTo: r[29], end: r[30] } };
    const warn = [];
    if (d.recSusp) warn.push(`${d.recSusp} suspend${d.recSusp===1?' was':'s were'} genuinely missed by the USB callback and only caught by polling — the backstop did its job, but it means the USB stack is dropping suspend notifications.`);
    if (d.cb && !d.rwEn) warn.push('The host did NOT permit remote wakeup on the last suspend. Enable "Allow this device to wake the computer" for the dongle in Device Manager.');
    if (d.disc && !d.discOk) warn.push('The last disconnect found no live Bluetooth link — the controller was already gone.');
    if (d.wakes && !d.tudOk && !d.dcd) warn.push('Wake attempts were made but the USB bus was not suspended at the time.');
    if (d.reissue) warn.push(`${d.reissue} resume pulse${d.reissue===1?' was':'s were'} re-sent because the host did not come back after the first — the host is missing or ignoring the wake signal, not the dongle failing to send it.`);
    let h = `<table style="font-size:12px"><tr><td style="padding-right:10px">Suspends seen (callback)</td><td><b>${d.cb}</b></td></tr>`
      + `<tr><td>…genuinely missed, caught by polling</td><td><b>${d.recSusp}</b></td></tr>`
      + `<tr><td>Resumes recovered by polling</td><td>${d.recRes}</td></tr>`
      + `<tr><td>Controller disconnects</td><td>${d.disc} (last ${d.discOk ? 'had a live link' : 'found none'})</td></tr>`
      + `<tr><td>Wake requests</td><td>${d.wakes} (last: TinyUSB ${d.tudOk ? 'accepted' : 'refused'}${d.dcd ? `, forced ${d.dcd}x` : ''})</td></tr>`
      + `<tr><td>Resume pulses re-sent</td><td>${d.reissue}</td></tr>`
      + `<tr><td>Host permitted remote wakeup</td><td><b>${d.rwEn ? 'yes' : 'NO'}</b></td></tr>`
      + `<tr><td>Suspended right now</td><td>${d.nowSusp ? 'yes' : 'no'}</td></tr></table>`;
    if (warn.length) h += `<div style="margin-top:6px;font-size:11px;color:#e0a030">⚠ ${warn.join('<br>⚠ ')}</div>`;
    // The decisive part: what happened during the MOST RECENT sleep, rather than
    // totals that mix in every button press since the dongle was powered up.
    const c = d.c;
    if (c.req || c.resumed){
      const step = !c.req      ? 'no wake was ever requested — the controller never reconnected, or the bridge did not think the PC was asleep'
                 : !c.acc && !c.dcd ? 'the wake request was refused and no fallback ran'
                 : !c.resumed  ? 'the wake signal was sent but the PC never came back'
                 : c.hidTo     ? 'the PC came back but its keyboard channel never opened, so the wake keypress could not be sent'
                 : !c.key      ? 'the PC came back but the wake keypress was not sent'
                 : 'the wake keypress was delivered — this sleep looks successful';
      h += `<div style="margin-top:8px;padding-top:6px;border-top:1px solid var(--line,#333)">`
        + `<b style="font-size:12px">Most recent sleep</b>`
        + `<table style="font-size:12px"><tr><td style="padding-right:10px">Wake requests during it</td><td>${c.req} (${c.acc} accepted${c.dcd?`, ${c.dcd} forced`:''})</td></tr>`
        + `<tr><td>Resume pulses re-sent</td><td>${c.reiss}</td></tr>`
        + `<tr><td>PC came back</td><td><b>${c.resumed ? 'yes' : 'NO'}</b></td></tr>`
        + `<tr><td>Wake keypress sent</td><td><b>${c.key ? 'yes' : 'no'}</b>${c.hidTo ? ' — keyboard channel never opened' : (c.hidWait ? ' (waited for the keyboard channel)' : '')}</td></tr></table>`
        + `<div style="margin-top:4px;font-size:11px;color:#e0a030">Where it got to: ${step}.</div></div>`;
    }
    h += `<div style="margin-top:6px;font-size:11px;color:var(--sub)">Totals reset when the dongle loses power, and include button presses made while awake. The <b>Most recent sleep</b> block is the one to read after a failed wake.</div>`;
    if (box) box.innerHTML = h;
  } catch(e){
    if (box) box.innerHTML = `<span style="color:#e0a030">Read failed: ${e && e.message ? e.message : e}</span>`;
  }
}

async function ceReadTrigger(trig){
  const name = trig === 0 ? 'R2' : 'L2';
  const pfx  = trig === 0 ? 'ce_r2' : 'ce_l2';
  const box  = document.getElementById('ce_readout');
  const vz   = document.getElementById('ce_readviz');
  if (box) box.innerHTML = `Reading ${name}…`;
  if (vz) vz.innerHTML = '';
  try {
    const n = Math.min(5, +config[pfx + '_state_count'] || 0);
    const on = +config[pfx + '_enable'] || 0;
    if (!n){
      if (box) box.innerHTML = `<b>${name}</b>: no custom effect assigned.`;
      return;
    }
    const states = [];
    await hidLocked(async () => {
      for (let i = 0; i < n; i++){
        await sendCmd(0x12, [trig, i]);
        const r = await readCmdReplyOn(SLOT_REPORT, 0x12, undefined, 12);
        if (!r || r[2] !== 0x00) throw new Error('device did not return state ' + i);
        states.push({ bytes: Array.from(r.slice(5, 16)), dt: r[16] | (r[17] << 8) });
      }
    });
    const bytes = states.map(s => s.bytes);
    const anyMech = bytes.some(ceIsMechBytes);
    const mode = bytes.length === 1 ? 'single state'
               : anyMech ? 'mechanical sequence — ordered by trigger position, durations ignored'
                         : 'time-based — driven by the recorded durations';
    const win = ceActiveWindows(bytes);
    const COND = ['While held','On press','On release'];
    const YIELD = ['custom effect always owns it','sliders while gated, custom otherwise','custom while gated, sliders otherwise'];
    let h = `<div style="margin-bottom:6px"><b>${name}</b> — ${bytes.length} state${bytes.length===1?'':'s'}, `
          + `${on ? 'enabled' : '<span style="color:#e0a030">assigned but DISABLED</span>'}`
          + ` · ${COND[+config[pfx+'_condition']||0]} · re-arm zone ${+config[pfx+'_thresh']||0}`
          + ` · ${YIELD[+config[pfx+'_yield']||0]}</div>`
          + `<div style="margin-bottom:6px;color:var(--sub)">Playback: ${mode}</div>`;
    states.forEach((st,i) => {
      const w = win && win[i];
      const where = w ? ` <span style="color:var(--sub)">(stage ${w.order}, active pos ${w.from}–${w.to})</span>`
                      : (!anyMech && bytes.length > 1 ? ` <span style="color:var(--sub)">(${st.dt} ms)</span>` : '');
      h += `<div style="margin:3px 0">${i+1}. ${ceDescribeState(st.bytes)}${where}<br>`
        +  `<code style="font-size:11px;color:var(--sub)">${st.bytes.map(x=>x.toString(16).padStart(2,'0')).join(' ')}</code></div>`;
    });
    if (win){
      const cut = states.map((st,i) => ({st,i,w:win[i]}))
        .filter(x => x.w && ceIsMechBytes(x.st.bytes) &&
                     x.w.to < ceZpos(ceZonesOfBytes(x.st.bytes).slice(-1)[0]));
      if (cut.length) h += `<div style="margin-top:6px;font-size:11px;color:#e0a030">⚠ `
        + cut.map(x => `state ${x.i+1} is handed over at pos ${x.w.to}, before its own span ends at `
                     + `${ceZpos(ceZonesOfBytes(x.st.bytes).slice(-1)[0])}`).join('; ')
        + ` — its ending (a wall breaking, a bow snapping) will not be reached.</div>`;
    }
    if (box) box.innerHTML = h;
    if (vz) vz.innerHTML = ceEffectPanel(states, `Effect map — ${name}, as it is on the device`);
  } catch(e){
    if (box) box.innerHTML = `<span style="color:#e0a030">Read failed: ${e && e.message ? e.message : e}</span>`;
    if (vz) vz.innerHTML = '';
  }
}

// ---- Effect map: draw the effect across the trigger pull --------------------
// The thing text and hex cannot show: WHERE on the pull each stage sits, how wide
// its window is, and whether a wall's break / a bow's snap is actually reached
// before the sequencer hands to the next stage. This renders that as an SVG using
// the SAME maths the reader uses (ceActiveWindows + ceZpos), so the picture and
// the words always agree. Pure string-in / string-out (no DOM) so the harness can
// exercise it directly. It is also the answer to "you can't screenshot a trigger
// effect" — this can be screenshotted and shared.
const CE_VIZ_COL = { res:'#4a90d9', wall:'#e0a030', brk:'#e05a4a', bow:'#38b2a0',
                     vib:'#a070d0', grid:'#3a3f45', axis:'#8b9197', line:'#4a5158' };
function ceVizKind(b){                       // colour family for a stage
  const t = b[0];
  if (t === 0x25 || t === 0x23) return 'wall';
  if (t === 0x22 || t === 0x02) return 'bow';
  if (isVibrationType(t))        return 'vib';
  return 'res';                              // 0x21 / 0x01
}
function ceEsc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

// Core: array of {bytes,dt} (or bare 11-byte arrays) -> <svg> string.
function ceEffectSVG(states){
  const rows = (states||[]).map(s => Array.isArray(s) ? { bytes:s, dt:0 }
                                                      : { bytes:s.bytes, dt:s.dt|0 })
                           .filter(r => r.bytes && r.bytes[0] !== 0x05 && r.bytes[0] !== 0x00);
  if (!rows.length) return '';
  const bytes = rows.map(r => r.bytes);
  const anyMech = bytes.some(ceIsMechBytes);

  // All-vibration, more than one state -> time-based playback: x is time, not
  // trigger position, so a position diagram would be a lie. Draw a time strip.
  if (!anyMech && rows.length > 1) return ceEffectTimeSVG(rows);

  // ---- positional diagram ---------------------------------------------------
  const W = 580, T = 14, PH = 120, L = 40, R = 12, PW = W - L - R;
  const yBase = T + PH;
  const H = yBase + 34;
  const px = p => L + Math.max(0, Math.min(255, p)) / 255 * PW;
  const py = l => yBase - (Math.max(0, Math.min(7, l)) / 7) * PH;
  const f2 = n => n.toFixed(1);

  const win = ceActiveWindows(bytes);          // null unless >=2 mechanical stages
  let s = '';
  s += `<rect x="${L}" y="${T}" width="${PW}" height="${PH}" fill="#1c1f24" stroke="${CE_VIZ_COL.grid}"/>`;
  [0,3,7].forEach(lv => { const y = py(lv);
    s += `<line x1="${L}" y1="${f2(y)}" x2="${L+PW}" y2="${f2(y)}" stroke="${CE_VIZ_COL.grid}" stroke-dasharray="2 3"/>`;
    s += `<text x="${L-4}" y="${f2(y+3)}" text-anchor="end" font-size="9" fill="${CE_VIZ_COL.axis}">${lv}</text>`; });
  s += `<text x="12" y="${f2(T+PH/2)}" font-size="9" fill="${CE_VIZ_COL.axis}" transform="rotate(-90 12 ${f2(T+PH/2)})">force</text>`;
  [0,25,50,75,100].forEach(pct => { const x = px(pct/100*255);
    s += `<line x1="${f2(x)}" y1="${T}" x2="${f2(x)}" y2="${yBase}" stroke="${CE_VIZ_COL.grid}" stroke-dasharray="1 4"/>`;
    s += `<text x="${f2(x)}" y="${yBase+12}" text-anchor="middle" font-size="9" fill="${CE_VIZ_COL.axis}">${pct}%</text>`; });
  s += `<text x="${f2(L+PW/2)}" y="${yBase+24}" text-anchor="middle" font-size="9" fill="${CE_VIZ_COL.axis}">trigger pull →</text>`;

  // Stages. When the set is sequenced (win != null) every stage — vibration
  // included — is placed at its position window, matching the firmware. A lone
  // vibration, or an all-vibration set, is NOT sequenced: a lone vibration plays
  // wherever the trigger is armed, so it is drawn full-width.
  const span = b => { const z = ceZonesOfBytes(b); return z.length ? [z[0], z[z.length-1]] : [2, 8]; };

  // hand-off lines between consecutive sequenced stages (any kind, incl. vibration)
  if (win){
    const ordered = bytes.map((b,i) => ({ i, lo: span(b)[0] })).sort((a,c) => a.lo - c.lo);
    for (let k = 0; k < ordered.length - 1; k++){
      const x = px(win[ordered[k].i].to);
      s += `<line x1="${f2(x)}" y1="${T}" x2="${f2(x)}" y2="${yBase}" stroke="${CE_VIZ_COL.line}" stroke-dasharray="4 3"/>`;
      s += `<text x="${f2(x+2)}" y="${f2(T+9)}" font-size="8" fill="${CE_VIZ_COL.axis}">hand-off</text>`;
    }
  }

  bytes.forEach((b, i) => {
    const kind = ceVizKind(b);
    const [lo, hi] = span(b);
    const w = win && win[i];
    const hardTo = w ? w.to : 255;              // where the sequencer clips this stage
    const order = w ? w.order : 1;
    const brkPos = ceZpos(hi);                  // break / snap position (last zone)

    if (kind === 'vib'){
      // positioned in a mixed set -> band over its window; a lone vibration ->
      // full width (it plays wherever the trigger is armed — position is ignored).
      const vf = w ? px(w.from) : L, vt = w ? px(w.to) : L + PW;
      const top = T + 6, bandH = PH - 12;
      s += `<rect x="${f2(vf)}" y="${top}" width="${f2(Math.max(0, vt-vf))}" height="${bandH}" fill="${CE_VIZ_COL.vib}" fill-opacity="0.15" stroke="${CE_VIZ_COL.vib}" stroke-opacity="0.75" stroke-dasharray="4 3"/>`;
      s += `<line x1="${f2(vf+2)}" y1="${f2(top+bandH/2)}" x2="${f2(vt-2)}" y2="${f2(top+bandH/2)}" stroke="${CE_VIZ_COL.vib}" stroke-opacity="0.45" stroke-dasharray="2 3"/>`;
      s += `<text x="${f2(vf+4)}" y="${f2(top+12)}" font-size="8.5" fill="${CE_VIZ_COL.vib}">buzz · freq ${b[9]}${w ? '' : ' · plays while armed'}</text>`;
      s += `<text x="${f2((vf+vt)/2)}" y="${f2(yBase-4)}" text-anchor="middle" font-size="9" font-weight="bold" fill="${CE_VIZ_COL.vib}">${order}</text>`;
      return;
    }
    if (kind === 'res'){
      const cutX = w ? px(hardTo) : Infinity;
      // baseline extent strip: a resistance at force 0 draws no bar (honest — it
      // may not be felt), but its position on the pull is still worth showing.
      const bx0 = px(ceZpos(lo)), bx1 = px(Math.min(hardTo, hi >= 9 ? 255 : ceZpos(hi + 1)));
      s += `<rect x="${f2(bx0)}" y="${f2(yBase-2)}" width="${f2(Math.max(0, bx1-bx0))}" height="2" fill="${CE_VIZ_COL.res}" fill-opacity="0.85"/>`;
      for (let z = lo; z <= hi; z++){
        const fz = ceZoneForce(b, z);
        const zx0 = px(ceZpos(z)), zx1 = px(z >= 9 ? 255 : ceZpos(z + 1));
        const faded = zx0 >= cutX - 0.5;        // in the handed-over tail
        s += `<rect x="${f2(zx0)}" y="${f2(py(fz))}" width="${f2(Math.max(0, zx1-zx0))}" height="${f2(yBase-py(fz))}" fill="${CE_VIZ_COL.res}" fill-opacity="${faded?0.16:0.5}" stroke="${CE_VIZ_COL.res}" stroke-opacity="${faded?0.35:0.85}"/>`;
      }
    } else if (kind === 'wall'){
      const fz = b[3] & 7, reached = hardTo >= brkPos;
      const x0 = px(ceZpos(lo)), xCut = px(Math.min(hardTo, brkPos)), xEnd = px(brkPos), yF = py(fz);
      s += `<rect x="${f2(x0)}" y="${f2(yF)}" width="${f2(Math.max(0, xCut-x0))}" height="${f2(yBase-yF)}" fill="${CE_VIZ_COL.wall}" fill-opacity="0.5" stroke="${CE_VIZ_COL.wall}"/>`;
      if (!reached) s += `<rect x="${f2(xCut)}" y="${f2(yF)}" width="${f2(Math.max(0, xEnd-xCut))}" height="${f2(yBase-yF)}" fill="${CE_VIZ_COL.wall}" fill-opacity="0.12" stroke="${CE_VIZ_COL.wall}" stroke-opacity="0.4" stroke-dasharray="3 3"/>`;
      s += `<line x1="${f2(xEnd)}" y1="${f2(T+4)}" x2="${f2(xEnd)}" y2="${f2(yBase)}" stroke="${CE_VIZ_COL.brk}" stroke-width="1.5" stroke-opacity="${reached?1:0.5}" stroke-dasharray="${reached?'0':'2 2'}"/>`;
      s += `<text x="${f2(xEnd)}" y="${f2(T-1)}" text-anchor="middle" font-size="8.5" fill="${CE_VIZ_COL.brk}" fill-opacity="${reached?1:0.6}">${reached?'break':'break ✕'}</text>`;
    } else { // bow
      const fz = b[3] & 7, snap = (b[3] >> 3) & 7, reached = hardTo >= brkPos;
      const x0 = px(ceZpos(lo)), xEnd = px(brkPos), yF = py(fz), xCut = px(Math.min(hardTo, brkPos));
      const yAt = x => yBase - (yBase - yF) * ((x - x0) / Math.max(1, xEnd - x0));
      s += `<polyline points="${f2(x0)},${f2(yBase)} ${f2(xCut)},${f2(yAt(xCut))}" fill="none" stroke="${CE_VIZ_COL.bow}" stroke-width="2"/>`;
      if (!reached) s += `<polyline points="${f2(xCut)},${f2(yAt(xCut))} ${f2(xEnd)},${f2(yF)}" fill="none" stroke="${CE_VIZ_COL.bow}" stroke-width="2" stroke-opacity="0.3" stroke-dasharray="3 3"/>`;
      s += `<text x="${f2(xEnd)}" y="${f2(yF-3)}" text-anchor="middle" font-size="8.5" fill="${CE_VIZ_COL.bow}" fill-opacity="${reached?1:0.6}">${reached?`snap ${snap}/7`:'snap ✕'}</text>`;
    }
    const cx = (px(ceZpos(lo)) + px(Math.min(hardTo, kind==='res' ? (hi>=9?255:ceZpos(hi+1)) : brkPos))) / 2;
    s += `<text x="${f2(cx)}" y="${f2(yBase-4)}" text-anchor="middle" font-size="9" font-weight="bold" fill="${CE_VIZ_COL[kind]}">${order}</text>`;
  });

  return `<svg viewBox="0 0 ${W} ${H}" width="100%" style="max-width:${W}px;height:auto;font-family:inherit" role="img" aria-label="effect map">${s}</svg>`;
}

// Time strip for all-vibration timelines (x = elapsed time).
function ceEffectTimeSVG(rows){
  const W = 580, L = 8, R = 12, PW = W - L - R, barY = 26, barH = 30, H = 74;
  const total = rows.reduce((a, r) => a + (r.dt || 0), 0), uniform = total <= 0;
  let x = L, s = '';
  s += `<text x="${L}" y="18" font-size="10" fill="${CE_VIZ_COL.axis}">Time-based playback${uniform ? ' — durations are 0, plays as a fixed blend (equal slices shown)' : ` — ${total} ms total`}</text>`;
  rows.forEach(r => {
    const frac = uniform ? 1 / rows.length : (r.dt || 0) / total, w = frac * PW;
    const col = CE_VIZ_COL[ceVizKind(r.bytes)] || CE_VIZ_COL.vib;
    s += `<rect x="${x.toFixed(1)}" y="${barY}" width="${Math.max(0, w).toFixed(1)}" height="${barH}" fill="${col}" fill-opacity="0.4" stroke="${col}"/>`;
    const lbl = ceVizKind(r.bytes) === 'vib' ? `freq ${r.bytes[9]}` : effectTypeName(r.bytes[0]);
    if (w > 34) s += `<text x="${(x+4).toFixed(1)}" y="${barY+18}" font-size="8.5" fill="${col}">${ceEsc(lbl)}${uniform ? '' : ` · ${r.dt}ms`}</text>`;
    x += w;
  });
  s += `<text x="${(L+PW/2).toFixed(1)}" y="${barY+barH+16}" text-anchor="middle" font-size="9" fill="${CE_VIZ_COL.axis}">time →</text>`;
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" style="max-width:${W}px;height:auto;font-family:inherit" role="img" aria-label="effect timeline">${s}</svg>`;
}

// Titled panel wrapper (legend + the caption that explains the faded/✕ marks).
function ceEffectPanel(states, title){
  const svg = ceEffectSVG(states);
  if (!svg) return '';
  const legend = [['Resistance', CE_VIZ_COL.res], ['Weapon break', CE_VIZ_COL.wall],
                  ['break point', CE_VIZ_COL.brk], ['Bow / snap', CE_VIZ_COL.bow],
                  ['Vibration', CE_VIZ_COL.vib]]
    .map(([n,c]) => `<span style="display:inline-flex;align-items:center;gap:3px;margin-right:9px"><span style="width:9px;height:9px;background:${c};display:inline-block;border-radius:2px"></span>${n}</span>`).join('');
  return `<div style="border:1px solid var(--line,#333);border-radius:6px;padding:8px;background:#15171b">
    <div style="font-size:11px;color:var(--sub);margin-bottom:4px">${ceEsc(title)}</div>
    ${svg}
    <div style="font-size:10px;color:var(--sub);margin-top:5px">${legend}</div>
    <div style="font-size:10px;color:var(--sub);margin-top:3px">Faded fill / ✕ = the sequencer hands over before a wall's break or bow's snap is reached. Dashed verticals mark hand-offs. A violet band is a vibration stage (where the buzz plays); a lone vibration plays wherever the trigger is armed.</div>
  </div>`;
}

// Export the effect currently assigned to a trigger, read back from the device.
// Profile exports carry only the 85 scalar settings, so an assigned effect could
// be enabled in a profile yet impossible to get back out as a file - this is the
// way to recover one after the fact.
async function exportEffectFile(trig){
  const name = trig === 0 ? 'R2' : 'L2';
  const pfx  = trig === 0 ? 'ce_r2' : 'ce_l2';
  const n = Math.min(5, +config[pfx + '_state_count'] || 0);
  if (!n){ alert(`No custom effect is assigned to ${name}.`); return; }
  try {
    const states = [];
    await hidLocked(async () => {
      for (let i = 0; i < n; i++){
        await sendCmd(0x12, [trig, i]);
        const r = await readCmdReplyOn(SLOT_REPORT, 0x12, undefined, 12);
        if (!r || r[2] !== 0x00) throw new Error('device did not return state ' + i);
        states.push({ bytes: Array.from(r.slice(5, 16)), dt: r[16] | (r[17] << 8) });
      }
    });
    const dump = { format: 'ds5dongle-custom-effect', version: 2, source: name,
      state_count: states.length,
      states: states.map(st => ({ type: '0x' + st.bytes[0].toString(16).padStart(2,'0'),
        name: effectTypeName(st.bytes[0]), bytes: st.bytes, duration_ms: st.dt })) };
    const blob = new Blob([JSON.stringify(dump, null, 2)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `ds5-effect-${name.toLowerCase()}-${new Date().toISOString().slice(0,19).replace(/[:T]/g,'-')}.json`;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  } catch(e){ alert('Export failed: ' + (e && e.message ? e.message : e)); }
}

function cebSaveFile(){
  const list = window._cebStages;
  if (!list.length){ alert('Add at least one stage first.'); return; }
  const sorted = list.slice().sort((a, b) => cebStartZone(a.bytes) - cebStartZone(b.bytes));
  const dump = { format: 'ds5dongle-custom-effect', version: 2, source: 'built',
    state_count: sorted.length,
    states: sorted.map(st => ({ type: '0x' + st.bytes[0].toString(16).padStart(2, '0'),
      name: effectTypeName(st.bytes[0]), bytes: st.bytes, duration_ms: 0 })) };
  const blob = new Blob([JSON.stringify(dump, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `ds5-built-effect-${new Date().toISOString().slice(0,19).replace(/[:T]/g,'-')}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}

// Load a custom-effect file and write it to a trigger.
async function loadCustomFile(event, trig){
  const file = event.target.files[0]; if (!file) return;
  try {
    const data = JSON.parse(await file.text());
    if (data.format !== 'ds5dongle-custom-effect') throw new Error('not a custom-effect file');
    if (!data.states || !data.states.length) throw new Error('no states in file');
    // Same guard as the monitor and timeline assign paths: a saved file is just a
    // capture someone ticked, so it can carry the same state twice (the game
    // returning to it) or two stages starting at the same trigger position.
    let states = data.states;
    {
      const v = ceValidateStates(states, st => st.bytes);
      if (v.clash !== null){ alert(CE_ZONE_CLASH_MSG(v.clash)); return; }
      if (v.dropped.length){
        states = v.kept;
        alert(`${v.dropped.length} state${v.dropped.length===1?'':'s'} in this file ${v.dropped.length===1?'was an exact repeat':'were exact repeats'} of another — the game returning to a state it had already used, not a separate effect. Loading ${states.length} instead.`);
      }
    }
    const n = Math.min(5, states.length);
    await hidLocked(async () => {
      for (let s = 0; s < n; s++){
        const st = states[s];
        const t = st.bytes[0];
        const mech = (t===0x21||t===0x01||t===0x25||t===0x23||t===0x22||t===0x02); // bow is a force effect too
        // mechanical states never timeline-play - durations are game-state timing
        const dt = mech ? 0 : Math.min(65535, (st.duration_ms|0) || 0);
        await sendCmd(0x11, [trig, s, ...st.bytes, dt & 0xFF, (dt >> 8) & 0xFF]);
        await readCmdReplyOn(SLOT_REPORT, 0x11, undefined, 12);
      }
      const base = trig === 0 ? 0x57 : 0x5c;
      await sendCmd(0x01, [base + 0, 1]);   // field write = cmd 0x01 + id
      await sendCmd(0x01, [base + 4, n]);
    });
    const pfx = trig === 0 ? 'ce_r2' : 'ce_l2';
    config[pfx + '_enable'] = 1;
    config[pfx + '_state_count'] = n;
    (window._dirty = window._dirty || {})[pfx + '_enable'] = 1;
    window._dirty[pfx + '_state_count'] = 1;
    render();
    alert(`Loaded ${n}-state custom effect onto ${trig===0?'R2':'L2'} (state count auto-set). Configure and Save to a slot.`);
  } catch(e){ alert('Load failed: ' + (e && e.message ? e.message : e)); }
  event.target.value = '';
}

// Back up ALL slots to one JSON file: names + every field value per valid slot.
// Read one custom-effect state out of a SLOT (fw cmd 0x15). The raw effect bytes
// are arrays inside the slot body, so the field-by-field export can't reach them -
// without this a slot backup silently lost every custom effect.
async function slotReadEffect(slot, trig, idx){
  await sendCmd(0x15, [slot, trig, idx]);
  const r = await readCmdReplyOn(SLOT_REPORT, 0x15, undefined, 12);
  if (!r || r[2] !== 0x00) return null;
  const bytes = Array.from(r.slice(8, 19));
  if (!bytes.some(b => b !== 0)) return null;        // empty state
  return { bytes, duration_ms: r[6] | (r[7] << 8) };
}

async function backupAllSlots(){
  const status = document.getElementById('backupStatus');
  const setS = t => { if (status) status.textContent = t; };
  // Slots carry macro_disable as an ordinary field, so WHICH macros each slot
  // enables is already covered. The definitions live outside Config_body and are
  // shared by every slot, so they are a separate question - without them this
  // file restores masks pointing at whatever table the target dongle happens to
  // hold.
  const withMacros = await askYesNo('Include macro definitions in this backup?',
    'Recommended. Which macros each slot enables is always saved; the definitions ' +
    'themselves are shared by every profile and are only saved if you say yes.\n\n' +
    'Either way the backup itself goes ahead.',
    'Include', 'Slots only');
  const dump = { format: 'ds5dongle-slots', version: 3, savedAt: new Date().toISOString(), slots: [] };
  try {
    if (withMacros){
      setS('Reading macros\u2026');
      if (!window._macroRows) window._macroRows = await hidLocked(() => macroReadAll());
      const list = macroTableToJson(window._macroRows);
      if (list.length) dump.macros = list;
    }
    await hidLocked(async () => {
      for (let i = 0; i < UI_SLOT_COUNT; i++){
        setS(`Reading slot ${i+1}/${UI_SLOT_COUNT}…`);
        const info = await slotInfo(i);
        if (!info || !info.valid){ dump.slots.push({ index: i, valid: false }); continue; }
        const fields = {};
        for (const f of FIELDS){
          const v = await slotReadField(i, f);
          if (v !== null) fields[f[1]] = v;
        }
        // raw custom-effect states (not reachable as fields)
        const effects = {};
        for (const [trig, key] of [[0,'r2'],[1,'l2']]){
          const list = [];
          for (let n = 0; n < 5; n++){
            const e = await slotReadEffect(i, trig, n);
            if (e) list.push(e); else break;
          }
          if (list.length) effects[key] = list;
        }
        dump.slots.push({ index: i, valid: true, name: info.name, cfgVersion: info.cfgVersion,
                          fields, ...(Object.keys(effects).length ? { effects } : {}) });
      }
    });
    const validN = dump.slots.filter(s => s.valid).length;
    const blob = new Blob([JSON.stringify(dump, null, 2)], { type: 'application/json' });
    const a = document.createElement('a');
    const stamp = new Date().toISOString().slice(0,19).replace(/[:T]/g,'-');
    a.href = URL.createObjectURL(blob); a.download = `ds5dongle-slots-${stamp}.json`;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000);
    const mN = (dump.macros || []).length;
    setS(`Backed up ${validN} slot${validN===1?'':'s'}` +
         (mN ? ` + ${mN} macro${mN===1?'':'s'}` : '') + ` \u2713`);
  } catch(e){ setS('Backup failed: ' + (e && e.message ? e.message : e)); }
}

// Restore ALL slots from a backup file: for each valid slot, bulk-write its
// fields into the ACTIVE config, then save that into the slot. Empty slots in
// the file are left untouched on the dongle (non-destructive to slots the backup
// didn't cover). The active config is disturbed during restore, so we reload it
// afterward.
async function restoreAllSlots(file){
  const status = document.getElementById('backupStatus');
  const setS = t => { if (status) status.textContent = t; };
  let dump;
  try { dump = JSON.parse(await file.text()); }
  catch { setS('Restore failed: not a valid JSON file'); return; }
  if (!dump || dump.format !== 'ds5dongle-slots' || !Array.isArray(dump.slots)){
    setS('Restore failed: not a DS5Dongle slot backup'); return;
  }
  // v2 files predate macros and simply have no `macros` key - they restore as
  // before. Restoring definitions is destructive and GLOBAL, so it is always its
  // own confirmation, separate from the slot one.
  let restoreMacros = false;
  if (Array.isArray(dump.macros) && dump.macros.length){
    restoreMacros = await askYesNo('Restore the macro definitions too?',
      'This backup contains ' + dump.macros.length + ' macro definition' +
      (dump.macros.length===1?'':'s') + '. Restoring them REPLACES every macro on the ' +
      'dongle, for all profiles.\n\nNo leaves your macros untouched. The slots are ' +
      'restored either way.',
      'Replace macros', 'Leave mine');
  }
  const valid = dump.slots.filter(s => s.valid && s.fields);
  if (!valid.length){ setS('Nothing to restore (backup has no saved slots)'); return; }
  if (!confirm(`Restore ${valid.length} slot(s) from this file? Each listed slot on the dongle will be overwritten.`)) { setS('Restore cancelled'); return; }
  const byKey = Object.fromEntries(FIELDS.map(f => [f[1], f]));
  let done = 0, failed = 0;
  try {
    await hidLocked(async () => {
      for (const s of valid){
        setS(`Restoring slot ${s.index+1}…`);
        const entries = [];
        for (const [key, value] of Object.entries(s.fields)){
          const f = byKey[key]; if (!f) continue;         // unknown field (newer/older backup) - skip
          entries.push({ fid: f[0], type: f[2], value });
        }
        const wrote = await bulkWriteFields(entries);
        if (!wrote){ failed++; continue; }
        // Raw effect states go into the live config first; slot_save snapshots the
        // whole body, so they land in the slot with everything else.
        if (s.effects){
          for (const [trig, key] of [[0,'r2'],[1,'l2']]){
            const list = s.effects[key] || [];
            for (let n = 0; n < Math.min(5, list.length); n++){
              const dt = Math.min(65535, (list[n].duration_ms|0) || 0);
              await sendCmd(0x11, [trig, n, ...list[n].bytes, dt & 0xFF, (dt >> 8) & 0xFF]);
              await readCmdReplyOn(SLOT_REPORT, 0x11, undefined, 12);
            }
          }
        }
        const saved = await slotSave(s.index, s.name || '');
        if (saved) done++; else failed++;
      }
    });
    // Definitions last: the slot writes above disturb the live config, and
    // macro_commit() is a single sector erase we only want to do once.
    if (restoreMacros){
      setS('Restoring macro definitions\u2026');
      window._macroRows = macroTableFromJson(dump.macros);
      await hidLocked(() => macroWriteAll());
    }
    await readAll(); render(); await refreshSlots();
    const mN = restoreMacros ? dump.macros.length : 0;
    setS(`Restored ${done} slot${done===1?'':'s'}` + (mN ? ` + ${mN} macro${mN===1?'':'s'}` : '') +
         `${failed?`, ${failed} failed`:''} \u2713`);
  } catch(e){ setS('Restore failed: ' + (e && e.message ? e.message : e)); }
}

async function rebootBootloader(){
  if(!device || !device.opened){ toast('Connect first', true); return; }
  if(!confirm('Reboot the dongle into the bootloader (RPI-RP2 drive) for reflashing?\n\nThe controller disconnects. Drag a .uf2 onto the drive to flash, or replug to cancel.')) return;
  try { await sendCmd(0x07); } catch(e){ /* device vanishes, expected */ }
  toast('Rebooting to bootloader — look for RPI-RP2 drive');
}

async function reacquire(){
  // Force a fresh device handle from getDevices(). After a reconnect cycle the
  // previous object can report opened while its connection is dead, so writes
  // silently fail; re-acquiring a fresh handle is the reliable recovery.
  try { if (device && device.opened) await device.close(); } catch(e){}
  device = null;
  // Settle before the first look. getDevices() called the instant after a
  // disconnect can still return the PRE-reconnect object, and taking the first
  // match meant adopting a handle whose connection was already dead.
  await sleep(300);
  for (let i = 0; i < 10; i++){
    try {
      const devs = await navigator.hid.getDevices();
      const d = pickDs5(devs);
      if (d){
        if (!d.opened) await d.open();
        // PROVE the handle works before adopting it. Opening a stale object can
        // succeed while every read that follows silently fails - which shows up
        // later as an empty slot list, or settings that will not load, and looks
        // like the device forgetting its profiles rather than a dead handle.
        device = d;
        const probe = await readField(0x7d, 'u8').catch(() => null);
        if (probe !== null && probe !== undefined) return true;
        device = null;
        try { await d.close(); } catch(e){}
      }
    } catch(e){}
    await sleep(250);
  }
  return false;
}

async function ensureDevice(){
  // The disconnect event listener nulls `device` when the controller goes away,
  // so a stale handle won't survive a disconnect/reconnect. If we still hold an
  // opened handle, trust it; otherwise re-acquire.
  if (device && device.opened) return true;
  return await reacquire();
}

// Write a field; if the handle is stale (write throws), re-acquire once and retry.
async function writeFieldSafe(fid, type, value){
  try {
    await writeField(fid, type, value);
  } catch(e){
    if (await reacquire()) {
      await writeField(fid, type, value); // retry on the fresh handle
    } else {
      throw e;
    }
  }
}

// --- Profile export/import ---
// A profile is a JSON object of {field_name: value} for every known field, plus a
// small wrapper with a name and version. (An earlier note here promised a
// ds5profile CLI; no such tool was ever shipped, so the note was removed rather
// than left pointing at something that does not exist.)
// CLI helper (for Playnite auto-apply), so keep the field names in sync with FIELDS.
// Effects are raw state ARRAYS on the device, not numbered settings, so they are
// invisible to the field-by-field profile export. These two helpers move them in
// and out so a profile (and an auto-apply HTML) is a complete snapshot: without
// them a profile could record that a trigger HAS a custom effect while carrying
// nothing to recreate it.  Call inside hidLocked().
async function readEffectsFromDevice(){
  const out = {};
  for (const [trig,key] of [[0,'r2'],[1,'l2']]){
    const n = Math.min(5, +config[(trig===0?'ce_r2':'ce_l2') + '_state_count'] || 0);
    const list = [];
    for (let i = 0; i < n; i++){
      await sendCmd(0x12, [trig, i]);
      const r = await readCmdReplyOn(SLOT_REPORT, 0x12, undefined, 12);
      if (!r || r[2] !== 0x00) break;
      const bytes = Array.from(r.slice(5, 16));
      if (!bytes.some(b => b !== 0)) break;
      list.push({ bytes, duration_ms: r[16] | (r[17] << 8) });
    }
    if (list.length) out[key] = list;
  }
  return out;
}
async function writeEffectsToDevice(effects){
  if (!effects) return 0;
  let n = 0;
  for (const [trig,key] of [[0,'r2'],[1,'l2']]){
    let list = effects[key] || [];
    if (!list.length) continue;
    // A profile or backup can carry a set that was captured with the same state
    // twice. Drop exact repeats and correct the stored count to match, so a
    // restore can't silently reinstate a set that falls back to A/B cycling.
    const v = ceValidateStates(list, st => st.bytes);
    if (v.dropped.length){
      list = v.kept;
      const base = trig === 0 ? 0x57 : 0x5c;
      await sendCmd(0x01, [base + 4, Math.min(5, list.length)]);
      const pfx = trig === 0 ? 'ce_r2' : 'ce_l2';
      config[pfx + '_state_count'] = Math.min(5, list.length);
    }
    for (let i = 0; i < Math.min(5, list.length); i++){
      const dt = Math.min(65535, (list[i].duration_ms|0) || 0);
      await sendCmd(0x11, [trig, i, ...list[i].bytes, dt & 0xFF, (dt >> 8) & 0xFF]);
      await readCmdReplyOn(SLOT_REPORT, 0x11, undefined, 12);
      n++;
    }
  }
  return n;
}

async function exportProfile(){
  const settings = {};
  for (const [fid,key] of FIELDS){ settings[key] = config[key] ?? 0; }
  let effects = null;
  try { effects = await hidLocked(() => readEffectsFromDevice()); } catch(e){ effects = null; }
  const profile = {
    name: 'ds5dongle-profile',
    version: 2,
    note: 'DS5Dongle profile. Import it with the configuration portal.',
    settings,
    ...(effects && Object.keys(effects).length ? { effects } : {})
  };
  const blob = new Blob([JSON.stringify(profile, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'ds5dongle-profile.json';
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
  toast('Profile exported' + (profile.effects ? ' (with custom effects)' : ''));
}

// Export a STANDALONE auto-applying HTML with the current settings baked in.
// Double-clicking the exported file silently reconnects to the dongle and applies
// + saves these settings — no Python, no separate generator, no URL params.
async function exportHtml(){
  const name = (prompt('Name this profile (used for the filename + banner):',
                       'DS5 Profile') || 'DS5 Profile').trim() || 'DS5 Profile';
  const settings = {};
  for (const [fid,key] of FIELDS){
    // macro_disable is deliberately excluded from the auto-apply page. Two
    // reasons, either sufficient. It is ENUMERATION-CRITICAL at its all-disabled
    // boundary, and this page applies settings one field at a time over the live
    // connection - the same hazard the README already documents for enable_wake,
    // where a re-enumeration mid-apply can interrupt the rest. And this page runs
    // UNATTENDED on every game launch, so a stale export would silently switch on
    // whatever macros happened to be enabled when it was made. Per-game macro
    // sets still work through slot activation, which applies the whole config
    // body in one command.
    if (key === 'macro_disable') continue;
    settings[key] = config[key] ?? 0;
  }
  let hEffects = null;
  try { hEffects = await hidLocked(() => readEffectsFromDevice()); } catch(e){ hEffects = null; }
  const embedded = { name, version: 2, settings,
    ...(hEffects && Object.keys(hEffects).length ? { effects: hEffects } : {}) };

  // Get the portal's own source BYTE-EXACT by fetching the file itself, rather than
  // document.documentElement.outerHTML (which the browser may re-normalize —
  // changing whitespace/comments so the embed hook is no longer found). fetch on a
  // file:// page returns the raw bytes on disk, which contain the hook verbatim.
  let html;
  try {
    const resp = await fetch(location.href);
    html = await resp.text();
  } catch(e){
    // Some browsers block fetch of local files; fall back to outerHTML.
    html = '<!DOCTYPE html>\n' + document.documentElement.outerHTML;
  }
  // Safe JSON for an inline script (avoid accidentally closing the script tag).
  const embedJs = JSON.stringify(embedded).replace(/<\//g, '<\\/');
  // Match the hook specifically: it sits at the start of a line (column 0), whereas
  // this code below is indented — so a multiline ^-anchored match hits only the real
  // hook, never this line.
  const re = /^const EMBEDDED_PROFILE = null;/m;
  if (!re.test(html)){
    toast('Export HTML failed: embed hook not found. Make sure you opened THIS portal '
          + 'file (not a generated copy).', true);
    return;
  }
  html = html.replace(re, 'const EMBEDDED_PROFILE = ' + embedJs + ';');

  const safe = name.replace(/[^\w.-]+/g, '_');
  const blob = new Blob([html], {type:'text/html'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = safe + '.autoapply.html';
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
  toast('Exported ' + safe + '.autoapply.html — open it to auto-apply this profile');
}

function importProfile(event){
  const file = event.target.files && event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = async () => {
    try{
      let data = JSON.parse(reader.result);
      // Accept either a bare {field:value} object or a {settings:{...}} wrapper.
      const settings = (data && typeof data.settings === 'object') ? data.settings : data;
      let applied = 0, unknown = [];
      const known = new Set(FIELDS.map(f => f[1]));

      // The macro mask is its own question. Unlike every other field it decides
      // whether the dongle sends KEYSTROKES to the PC, and a profile carries only
      // the mask - never the definitions - so it switches on whatever this dongle
      // already holds in those rows, which may be nothing like what the profile
      // was made with. Ask, and name what would fire, before changing it.
      let takeMacros = false;
      if (Object.prototype.hasOwnProperty.call(settings, 'macro_disable')){
        const on = macroEnabledSummary(settings.macro_disable);
        takeMacros = on.length
          ? await askYesNo('Apply this profile\u2019s macro selection?',
              'It enables ' + on.length + ' macro' + (on.length===1?'':'s') +
              '. These are the definitions already on your dongle, possibly not the ' +
              'ones the profile was made with:\n\n' + on.join('\n') +
              '\n\nNo keeps your current macro selection. The rest of the profile ' +
              'imports either way.',
              'Apply selection', 'Keep mine')
          : await askYesNo('Apply this profile\u2019s macro selection?',
              'This profile turns all macros OFF.\n\nNo keeps your current selection. ' +
              'The rest of the profile imports either way.',
              'Turn all off', 'Keep mine');
      }

      for (const k of Object.keys(settings)){
        if (k === 'macro_disable' && !takeMacros) continue;   // keep the current set
        if (known.has(k)){ config[k] = settings[k]; applied++; }
        else unknown.push(k);
      }
      render();
      let extra = '';
      if (data && data.effects){
        try {
          const n = await hidLocked(() => writeEffectsToDevice(data.effects));
          extra = ` + ${n} effect state(s) applied`;
        } catch(e){ extra = ' (custom effects need a connected device — connect and re-import)'; }
      }
      toast(`Imported ${applied} setting(s)` + (unknown.length?` (ignored ${unknown.length} unknown)`:'') + extra + ' — click Save to Device to apply');
    }catch(e){
      toast('Import failed: not a valid profile JSON', true);
    }
  };
  reader.readAsText(file);
  event.target.value = ''; // allow re-importing the same file
}

async function saveAll(){
  try{
    saving = true; // pause background diagnostic polling so it can't collide
                   // with the save's reads/writes or the close/reopen cycle
    if (!(await ensureDevice())){ toast('No device — click Connect', true); return; }
    // Use writeFieldSafe so a stale handle (after a prior reconnect) is detected
    // on the first write and recovered, instead of silently failing.
    const failedFields = [];
    let bulkDone = false;
    if (bulkSupported !== false){
      try {
        bulkDone = await bulkWriteFields(FIELDS.map(([fid,key,type]) => ({fid, type, value: config[key] ?? 0})));
        if (bulkDone) bulkSupported = true;
      } catch(_){ bulkDone = false; }
      if (!bulkDone && bulkSupported === null) bulkSupported = false;
    }
    if (!bulkDone) for (const [fid,key,type] of FIELDS){
      let ok = false;
      for (let a = 0; a < 2 && !ok; a++){
        try { await writeFieldSafe(fid, type, config[key] ?? 0); ok = true; }
        catch(e){ if (a) failedFields.push(key); else await sleep(150); } // one retry per field
      }
    }
    if (failedFields.length) toast('Some fields failed to write: ' + failedFields.join(', '), true);
    try { await sendCmd(0x02); }
    catch(e){ try { if (await reacquire()) await sendCmd(0x02); } catch(_){ /* the first attempt often landed despite the host-side throw (USB stalls during the flash write) */ } }

    // Only a few fields require a USB re-enumeration to take effect (polling rate,
    // audio buffer length, mic/speaker enable). Everything else (auto-haptics,
    // effect leak, mute, lightbar, volumes) applies live on save. So only trigger
    // a reconnect when one of those enumeration-time fields actually changed —
    // this avoids an unnecessary disconnect/reconnect on every save.
    // Covers the fields the PORTAL can change. It is deliberately a subset of
    // slot_activate()'s needs_reenum set in config.cpp: that one also lists
    // ps_shortcut_enabled and disable_usb_sn, which a SLOT body can carry but
    // which are not exposed here, so they can never differ between two portal
    // saves. Adding either of them to the portal later means adding it here too.
    const ENUM_FIELDS = ['controller_mode','polling_rate_mode','audio_buffer_length',
                         'disable_mic','disable_speaker','enable_wake',
                         'disable_usb_sn'];
    let needReconnect = false;
    for (const k of ENUM_FIELDS){
      if (savedSnapshot[k] !== config[k]) { needReconnect = true; break; }
    }
    // macro_disable is NOT listed above: it does not change the descriptor on its
    // own, only whether the shared keyboard INTERFACE is present. Mirrors
    // usb_kbd_iface_needed() in macro.h - keep the two in step. enable_wake stays
    // in the list because it also moves bcdUSB / BOS regardless of the keyboard.
    // NOTE kbdIfaceNeeded() reads ps_shortcut_enabled, which the portal does not
    // expose, so it always evaluates as off here. Harmless while the field stays
    // unexposed; expose it and this comparison becomes wrong until it is read.
    if (!needReconnect && kbdIfaceNeeded(savedSnapshot) !== kbdIfaceNeeded(config)) {
      needReconnect = true;
    }
    // The macro TABLE decides whether a mouse interface exists too, and it is
    // not a config field, so saveAll cannot see it. macroSaveTable sets this
    // when the committed table gains or loses a mouse output.
    if (window._macroMouseReenum) { needReconnect = true; window._macroMouseReenum = false; }
    // The mouse is its own interface, so losing it is a descriptor change even
    // though the keyboard test above stays true (macros or wake may still hold it).
    // >= 1, not === 1: gyro_output 2 (mouse + flick stick) needs the mouse
    // interface just as much as 1 does, so an === test missed a straight
    // "Right stick -> Mouse + Flick Stick" switch entirely - the interface
    // appeared with no reconnect to make the host notice.
    if (!needReconnect && ((+savedSnapshot.gyro_output >= 1) !== (+config.gyro_output >= 1))) {
      needReconnect = true;
    }
    // Stick-to-mouse brings the same interface up. Mirrors
    // usb_mouse_iface_needed() in macro.h - keep the two in step, or turning it
    // on adds an interface the host is never told to re-read.
    if (!needReconnect && ((+savedSnapshot.stick_mouse >= 1) !== (+config.stick_mouse >= 1))) {
      needReconnect = true;
    }
    // Touchpad-to-mouse brings the SAME interface up, and was missed here when
    // it was added: the firmware's usb_mouse_iface_needed() knew about it, but
    // this list did not, so ticking it on a profile with no other mouse feature
    // added an interface the host was never told to re-read - the setting simply
    // did nothing. Three places now name the mouse interface; they have to move
    // together.
    if (!needReconnect && ((+savedSnapshot.touch_mouse >= 1) !== (+config.touch_mouse >= 1))) {
      needReconnect = true;
    }

    if (!needReconnect){
      // No enumeration-time change — settings are already applied live. Just
      // confirm and refresh the snapshot. No reconnect, no handle churn.
      savedSnapshot = {...config};
      toast('Saved');
      return;
    }

    toast('Saved — reconnecting…');
    // A single reconnect: the firmware's 0x03 re-enumerates the USB device. We do
    // NOT separately close/open the WebHID handle (that would cause a SECOND
    // visible reconnect); instead we let the firmware reconnect, then re-acquire
    // the handle that the OS presents after re-enumeration.
    await sleep(300); // let flash write finish
    try { await sendCmd(0x03); } catch(e){ /* device drops here, expected */ }
    device = null; // drop our reference; the re-enumerated device is a new handle
    for (let attempt = 0; attempt < 12; attempt++){
      await sleep(500);
      try {
        const devs = await navigator.hid.getDevices();
        const d = pickDs5(devs);
        if (d){
          device = d;
          if (!device.opened) await device.open();
          await sleep(350);
          await readAll();
          savedSnapshot = {...config};
          render();
          toast('Reconnected — settings refreshed');
          return;
        }
      } catch(e){ /* keep trying */ }
    }
    render();
    toast('Saved. Click Connect to reconnect.', true);
  }catch(e){
    // Field writes and the flash save happen BEFORE the late stages that
    // usually throw (reconnect / read-back), so a blanket "Save failed" was
    // often false. Be accurate and point at verification.
    toast('Save hit an error - settings are likely saved anyway; use Re-read to verify. (' + e.message + ')', true);
  }
  finally { saving = false; } // always resume background polling
}


async function readDiag(){
  if(saving || !device || !device.opened) return {br:'-', ch:'-', rssi:null};
  try {
    const br = await readField(0x20, 'u16');
    const ch = await readField(0x21, 'u8');
    let rssi = await readField(0x22, 'u8');
    // RSSI is a signed int8 (dBm-ish, closer to 0 = stronger). Convert from u8.
    if (rssi > 127) rssi -= 256;
    let gy = null, sy = null, c01 = null, c23 = null;
    try { gy = await readField(0x35, 'u16'); sy = await readField(0x36, 'u8'); } catch(e) {}
    // Raw accelerometer. At rest one axis reads about +/-8000 (gravity) and the
    // other two near zero - which axis it is tells you the mapping, and the sign
    // tells you the orientation. Worth having visible: the wiki's axis names
    // were already wrong once about which byte carries yaw.
    let axv = null, ayv = null, azv = null;
    try {
      axv = await readField(0xa8, 'u16'); ayv = await readField(0xa9, 'u16'); azv = await readField(0xaa, 'u16');
    } catch(e) {}
    // Tilt steering, end to end: did the block run, what roll did it compute,
    // and what did it add to the stick. If "add" is non-zero and the game does
    // not move, the fault is past the dongle.
    let tdeg = null, tadd = null, tran = null, tydeg = null, tyadd = null;
    try {
      tdeg = await readField(0xb0, 'u16'); tadd = await readField(0xb1, 'u16'); tran = await readField(0xb2, 'u8');
      tydeg = await readField(0xb6, 'u16'); tyadd = await readField(0xb7, 'u16');
    } catch(e) {}
    try { c01 = await readField(0x37, 'u16'); c23 = await readField(0x38, 'u16'); } catch(e) {}
    let ke = null;
    try { ke = await readField(0x3c, 'u8'); } catch(e) {}
    let rl = null, rr = null, rf = null;
    try { rl = await readField(0x3d, 'u8'); rr = await readField(0x3e, 'u8'); rf = await readField(0x3f, 'u8'); } catch(e) {}
    // The touchpad-click (0x7b/0x7c) and macro-engine (0x88-0x8d) fields are no
    // longer read here: they moved to the Macros tab and are fetched by
    // readMacroDiag(), so this poll does not pay for reads the Device tab has
    // nothing to show.
    // Battery (0x68), read from the DualSense input report. (The auto-haptics
    // meters 0x69-0x6b now live on the Haptics tab, read by readAhMeter().)
    let bat = null;
    try { bat = await readField(0x68, 'u8'); } catch(e) {}
    return {br, ch, rssi, gy, sy, c01, c23, ke, rl, rr, rf, bat, axv, ayv, azv, tdeg, tadd, tran, tydeg, tyadd};
  } catch(e){ return {br:'err', ch:'err', rssi:null, gy:null, sy:null, c01:null, c23:null, ke:null, rl:null, rr:null, rf:null, bat:null}; }
}
function rssiLabel(r){
  if (r === null || r === undefined) return 'n/a';
  // The Pico W radio (CYW43) reports Bluetooth Classic RSSI relative to a
  // "golden receive range", not absolute dBm: values near 0 mean the signal is
  // in the ideal range; larger magnitude (either sign) means it's drifting out
  // of that range. So small |r| = good link, large |r| = marginal.
  const mag = Math.abs(r);
  let q;
  if (mag <= 10) q = 'strong';
  else if (mag <= 20) q = 'good';
  else if (mag <= 30) q = 'fair';
  else q = 'weak';
  return `${r} (${q})`;
}
// Auto-haptics live meter, shown on the Haptics tab right under its settings so
// you can watch "Haptics out" respond as you tune (no more hopping to the Device
// tab). Reads only the three auto-haptics fields (0x69 frames / 0x6a derived-out
// peak / 0x6b audio-in peak), which are peak-hold + cleared on read.
function ahMeterHTML(ahf, ahi, aho){
  if (ahf === null || ahf === undefined)
    return `<span style="color:var(--sub)">Connect to see live auto-haptics activity.</span>`;
  const active = ahf > 0;
  const bar = (v, c) => `<span style="display:inline-block;width:160px;height:10px;background:#222;border-radius:3px;vertical-align:middle;overflow:hidden"><span style="display:block;width:${Math.min(100, Math.round((v/255)*100))}%;height:100%;background:${c}"></span></span>`;
  let h = `Audio bridge: ${active ? '<b style="color:#4caf50">active</b>' : '<b style="color:#e0a030">not detected</b>'} `
    + `<span style="color:var(--sub)">${active ? `(${ahf} audio frames in the last second)` : '(no audio arriving on the dongle — auto-haptics derives from PC audio, so start ds5audio.py)'}</span>`
    + `<div style="margin-top:6px">Audio in (ch0/1):&nbsp; ${bar(ahi, '#4a90d9')} <span style="color:var(--sub)">${ahi}/255</span></div>`
    + `<div style="margin-top:4px">Haptics out (derived):&nbsp; ${bar(aho, '#a070d0')} <span style="color:var(--sub)">${aho}/255</span></div>`;
  if (active && ahi > 20 && aho < 4)
    h += `<div style="color:#e0a030;margin-top:4px">⚠ audio is arriving but almost no haptic is being derived — check Auto-Haptics Mode is on and the cutoff / intensity aren't too low</div>`;
  h += `<div style="color:var(--sub);font-size:11px;margin-top:5px">Live peak over the last second — change a setting above and watch "Haptics out" respond (needs ds5audio.py running and game audio playing).</div>`;
  return h;
}
async function readAhMeter(){
  let ahf = null, ahi = null, aho = null;
  try { ahf = await readField(0x69, 'u16'); aho = await readField(0x6a, 'u8'); ahi = await readField(0x6b, 'u8'); }
  catch(e) { return; }
  const el = document.getElementById('ahbox');
  if (el) el.innerHTML = ahMeterHTML(ahf, ahi, aho);
}
async function refreshDiag(){
  const d = await readDiag();
  const el = document.getElementById('diagbox');
  if(el){
    let extra = '';
    if (d.c01 !== null && d.c01 !== undefined)
      extra += `<br>Audio signal: ch0-1 (speaker/DSP source)=${d.c01}, ch2-3 (native actuators)=${d.c23}  (ch0-1 must be >0 for auto-haptics/effect-leak — if 0 here, the audio routing isn't putting game sound on those channels)`;
    if (d.gy !== null && d.gy !== undefined)
      extra += `<br>Gyro |raw| (horizontal): ${d.gy}  (0 = gyro off or controller still — wave it to calibrate sensitivity)`;
    if (d.sy !== null && d.sy !== undefined){
      const f = [];
      if (d.sy & 1)  f.push('game-owns-L2');
      if (d.sy & 2)  f.push('game-owns-R2');
      if (d.sy & 4)  f.push('synth-L2');
      if (d.sy & 8)  f.push('synth-R2');
      if (d.sy & 16) f.push('AT-engaged');
      if (d.sy & 32) f.push('KICK');
      extra += `<br>Trigger synthesis: ${f.length ? f.join(' · ') : 'idle'}  (game-owns = your r2t/at yield; use Force override to take over)`;
      if (d.ke !== null && d.ke !== undefined)
        extra += `<br>Push-back envelope: ${d.ke}/255  (must rise with rumble/gunfire while AT-engaged; kick fires at >=32 - if this stays 0 during rumble, the selected source isn't producing signal)`;
    }
    // The macro-engine readout (suppress / inject / stick / keyboard state) and
    // the touchpad-click diagnostics MOVED TO THE MACROS TAB, next to the rows
    // they describe and beside the live test that corroborates them. Reading
    // "hiding L3" here while the macro row sat on another tab meant holding the
    // two halves of the diagnosis in your head; see macroLivePanelHTML().
    if (d.tran !== null && d.tran !== undefined) {
      const sg = v => (v > 32767 ? v - 65536 : v);
      const st = d.tran === 1 ? 'running' : d.tran === 2 ? 'gravity reading rejected (shake or free fall)'
                                          : 'NOT running \u2014 the setting is off, or was clamped away on save';
      extra += `<br>Tilt steering: ${st}, roll ${sg(d.tdeg)}\u00b0, adding ${sg(d.tadd)} to the left stick` +
               ` (roll should swing as you tilt the pad; if "adding" is non-zero and the car does not turn, the game is ignoring it)`;
      if (d.tydeg !== null && d.tydeg !== undefined && (sg(d.tydeg) || sg(d.tyadd))) {
        extra += `<br>Tilt lean: ${sg(d.tydeg)}\u00b0, adding ${sg(d.tyadd)} to the left stick's Y`;
      }
    }
    if (d.axv !== null && d.axv !== undefined) {
      const sgn = v => (v > 32767 ? v - 65536 : v);
      extra += `<br>Accelerometer: X ${sgn(d.axv)}  Y ${sgn(d.ayv)}  Z ${sgn(d.azv)}` +
               `  (at rest one axis sits near \u00b18000 \u2014 that is gravity, and it is what "player space" uses to work out which way is down)`;
    }
    if (d.rl !== null && d.rl !== undefined) {
      const rq = [];
      if (d.rf & 1) rq.push('EnableRumbleEmulation');
      if (d.rf & 2) rq.push('UseRumbleNotHaptics');
      if (d.rf & 4) rq.push('Improved');
      extra += `<br>Rumble from host: peak L=${d.rl} R=${d.rr} since last read, requested: ${rq.length ? rq.join(' + ') : 'none'}  (peak-hold, so any burst in the last second registers. Non-zero = the game sends motor values, which Mix carries via Converted Rumble Strength. Zero while you feel vibration = it is delivered as haptic audio on ch3/4 instead, carried by Native Passthrough)`;
    }
    // Battery from the DualSense input report: low nibble = level 0-10 (x10 = %),
    // high nibble = charge state. Shown first as it is the headline device stat.
    // A raw 0x00 means no report has populated the byte yet (a real 0%/off pad
    // wouldn't be reporting), so treat it as "no data" rather than showing 0%.
    let batLine = '';
    if (d.bat){
      const lvl = d.bat & 0x0F, st = (d.bat >> 4) & 0x0F;
      const pct = Math.min(lvl * 10, 100);
      const status = st === 1 ? 'charging' : st === 2 ? 'full' : st >= 0x0F ? 'charge error' : 'on battery';
      const col = (st === 0 && pct <= 10) ? '#e0704a' : 'var(--fg,#ddd)';
      batLine = `Battery: <b style="color:${col}">${pct}%</b> · ${status}<br>`;
    }
    el.innerHTML = batLine + `Live audio stream: bytes_read=${d.br}, detected channels=${d.ch}  (4=native, 2=Windows/DS4Windows stereo)<br>Bluetooth signal: ${rssiLabel(d.rssi)}${extra}`;
  }
}
