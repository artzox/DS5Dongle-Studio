    // Pick on the row above, the same way for both - the long dropdown made the
    // controller side look like a different kind of setting from the keyboard.
    h += '<select onchange="macroSetOutKind(' + i + ', +this.value)"' + dis + ' style="padding:1px 3px;font-size:12px;margin-right:10px">';
    const outKind2 = macroOutKind(i, m);
    h += '<option value="0"' + (outKind2 === 0 ? ' selected' : '') + '>Output: keyboard</option>';
    h += '<option value="1"' + (outKind2 === 1 ? ' selected' : '') + '>Output: controller button</option>';
    h += '<option value="2"' + (outKind2 === 2 ? ' selected' : '') + '>Output: mouse</option>';
    h += '</select>';

  }
  h += '<label style="margin-right:10px"' + (canHold ? '' : ' title="Only a button or stick input can be held - a swipe or gesture is an event that completes"') + '>' +
       '<input type="checkbox" onchange="macroSetFlag(' + i + ', MACRO_FLAG_HOLD, this.checked)"' +
       (hold ? ' checked' : '') + (canHold && !dis ? '' : ' disabled') + '> hold while held</label>';
  h += '<label' + (hold ? '' : ' title="Only a held row can replace its input"') + '>' +
       '<input type="checkbox" onchange="macroSetFlag(' + i + ', MACRO_FLAG_REPLACE, this.checked)"' +
       ((m.flags & MACRO_FLAG_REPLACE) ? ' checked' : '') + (hold && !dis ? '' : ' disabled') + '> hide input from game</label>';
  // Double tap. Only meaningful on a button row that fires a burst: a hold row
  // is driven by the held set, and a stick direction is not tapped.
  if (!isStick){
    const dbl = !!(m.flags & MACRO_FLAG_DOUBLE);
    const canDbl = !hold && !(m.flags & MACRO_FLAG_LONG_PRESS);
    h += '<label style="margin-left:10px"' +
         (canDbl ? ' title="Fire this row on two presses within 250ms. A single-tap row on the SAME trigger then waits for that window before firing - only that trigger is affected. A controller or mouse output is pressed briefly and released."'
                 : ' title="Not available on a hold row or a long press"') + '>' +
         '<input type="checkbox" onchange="macroSetFlag(' + i + ', MACRO_FLAG_DOUBLE, this.checked)"' +
         (dbl ? ' checked' : '') + (canDbl && !dis ? '' : ' disabled') + '> double tap</label>';
  }
  if (isStick){
    // Stick rows only, and only meaningful alongside "hide input from game".
    // Without it the stick is centred ONLY past the threshold, so at rest the
    // pad's own jitter still reaches the game as a stream of changing axis
    // values - enough to flip a game's button prompts back to controller
    // glyphs while the macro's keys say keyboard.
    const always = !!(m.flags & MACRO_FLAG_STICK_ALWAYS);
    const canAlways = hold && !!(m.flags & MACRO_FLAG_REPLACE);
    h += '<label style="margin-left:10px"' +
         (canAlways ? ' title="Centre the stick for the game at all times, not only past the threshold. Turn this on if the game keeps switching its button prompts back to controller glyphs."'
                    : ' title="Needs hold while held and hide input from game"') + '>' +
         '<input type="checkbox" onchange="macroSetFlag(' + i + ', MACRO_FLAG_STICK_ALWAYS, this.checked)"' +
         (always ? ' checked' : '') + (canAlways && !dis ? '' : ' disabled') + '> centre stick always</label>';
  }
  if (isStick){
    h += '<div style="margin-top:5px">';
    STICK_DIRS.forEach((d, k) => {
      h += '<span style="margin-right:8px">' + d + ' <select onchange="macroSetStickKey(' + i + ',' + k + ', +this.value)"' + dis + ' style="padding:1px 3px;font-size:12px">';
      h += '<option value="0">—</option>';
      for (const ko of macroKeyOptions()){
        h += '<option value="' + ko[0] + '"' + ((m.keys[k]|0) === ko[0] ? ' selected' : '') + '>' + escAttr(ko[1]) + '</option>';
      }
      h += '</select></span>';
    });
    h += ' threshold <input type="number" min="10" max="120" placeholder="48" value="' + (m.stick_thresh || '') + '" ' +
         'style="width:56px;padding:1px 3px;font-size:12px" oninput="macroSetStickThresh(' + i + ', this.value)"' + dis + '>';
    h += '</div>';
  }
  h += '</td></tr>';
  return h;
}

function macroRender(){
  const box = document.getElementById('macrobox');
  if (!box) return;
  const rows = window._macroRows;
  if (!rows){ box.textContent = device ? 'Reading macros…' : 'Connect a device to load macros.'; return; }
  const rec = window._macroRec;
  const pick = window._macroPick;
  const pickIn = window._macroPickIn;

  let h = '<div style="font-size:12px;color:var(--sub);margin-bottom:8px">' +
          'Definitions are stored on the dongle and shared by every slot. The checkboxes are per-slot: ' +
          'save a slot to capture which macros are live for that game.</div>';

  // Only meaningful once a real read has established the baseline; before that
  // an absent key would compare as 0 and flag every fresh connect as dirty.
  const dirty = !!savedSnapshot && ('macro_disable' in savedSnapshot) &&
                ((+savedSnapshot.macro_disable>>>0) !== (+config['macro_disable']>>>0));
  if (dirty){
    h += '<div style="border:1px solid #a60;background:#2a1c00;padding:6px 8px;border-radius:6px;margin-bottom:8px;font-size:12px">' +
         'Enable state changed — press <b>Save macros to device</b> to apply it. ' +
         'Until then the dongle still uses the previous set.</div>';
  }

  const warn = macroSubsetWarnings();
  if (warn.length){
    h += '<div style="border:1px solid #a60;background:#2a1c00;padding:8px;border-radius:6px;margin-bottom:8px;font-size:12px">' +
         warn.map(w => '⚠ ' + w).join('<br>') + '</div>';
  }
  if (rec){
    h += '<div id="macrorec" style="border:1px solid #06a;background:#001a2a;padding:8px;border-radius:6px;margin-bottom:8px;font-size:12px">' +
         (rec.which === 0 ? 'Recording controller — hold the buttons you want, then press Stop. Hold for ~0.5s or more to record a long press.'
        : rec.which === 3 ? 'Recording controller OUTPUT — press the button this macro should send, then press Stop.'
        : rec.which === 4 ? 'Recording mouse OUTPUT — click or scroll anywhere outside the buttons below. It stops on its own once it has one.'
                          : 'Recording keyboard — press your combo, then press Stop.') + '</div>';
  }

  const anyRow = (rows||[]).some(r => r && r.present);
  h += '<table style="width:100%;border-collapse:collapse;font-size:13px">';
  if (anyRow) h += '<tr style="color:var(--sub);font-size:11px"><th style="width:34px"></th><th style="text-align:left">Name</th><th></th><th style="text-align:left">Controller input</th><th></th><th style="text-align:left">Keyboard output</th><th style="width:30px"></th></tr>';

  let shown = 0;
  for (let i=0;i<MACRO_COUNT;i++){
    const m = rows[i];
    if (!m || !m.present) continue;   // only rows that exist; + creates one
    shown++;
    const isStick = (m.gesture & GEST_STICK) !== 0;
    const inLbl  = isStick ? ((m.gesture & GEST_STICK_RIGHT) ? 'Right stick' : 'Left stick')
                           : (m.gesture ? macroGestureName(m.gesture) : macroChordName(m.chord));
    // The long-press threshold only means something on a BURST row. A hold row -
    // any remap - is driven by hold_task(), which reads neither the flag nor the
    // threshold, and hold rows are explicitly excluded from the burst path that
    // does. Showing a time there claimed the remap waited for it when it engages
    // immediately.
    const showHold = !isStick && (m.flags & MACRO_FLAG_LONG_PRESS) && !macroIsHold(m);
    const inTxt  = inLbl ? (inLbl + (showHold ? '  (hold ' + ((m.hold_cs||75)/100).toFixed(2) + 's)' : '')) : '—';
    const outTxt = isStick ? (STICK_DIRS.map((d,k) => d + ' ' + (USAGE_NAME[m.keys[k]] || (m.keys[k] ? '0x'+m.keys[k].toString(16) : '—'))).join('  '))
                 : ((m.out_btn ? MACRO_OUT_BTNS[m.out_btn] : macroComboName(m.keys, m.rel_order)) || '—');
    const recIn  = rec && rec.row === i && rec.which === 0;
    const recOut = rec && rec.row === i && rec.which === 1;
    const dis    = rec ? ' disabled' : '';
    h += '<tr style="border-top:1px solid var(--line,#333)">';
    h += '<td><input type="checkbox" onchange="macroSetBit(' + i + ', this.checked)"' + (macroBit(i) ? ' checked' : '') + '></td>';
    h += '<td style="padding:2px 6px"><input type="text" maxlength="15" placeholder="unnamed" ' +
         'style="width:104px;padding:2px 4px;font-size:12px" oninput="macroSetLabel(' + i + ', this.value)" ' +
         'value="' + escAttr(m.label || '') + '"></td>';
    const pickInOpen = pickIn && pickIn.row === i;
    h += '<td style="white-space:nowrap"><button class="btn btn-outline" style="padding:2px 8px" onclick="macroRecord(' + i + ',0)"' + (rec && !recIn ? ' disabled' : '') + '>' + (recIn ? 'Stop' : 'Record input') + '</button>';
    h += ' <button class="btn btn-outline" style="padding:2px 6px" onclick="macroPickInOpen(' + i + ')"' +
         (rec || pickInOpen || isStick ? ' disabled' : '') +
         ' title="Choose the trigger buttons by hand - needed for Fn and paddle chords the controller may not report while recording">Pick</button></td>';
    h += '<td style="padding:2px 8px;color:' + (inLbl ? 'inherit' : 'var(--sub)') + '">' + inTxt + '</td>';
    const pickOpen = pick && pick.row === i;
    h += '<td style="white-space:nowrap">';
    if (isStick){
      h += '<span style="font-size:12px;color:var(--sub)">set below</span>';
    } else {
      // Record and Pick mean the same thing on both sides now: which one you
      // get depends on the output KIND, not on whether the buttons are greyed
      // out. Previously the keyboard had Record/Pick and the controller had a
      // dropdown, so the same question was asked two different ways in one row.
      const outKind = macroOutKind(i, m);
      const which   = outKind === 1 ? 3 : outKind === 2 ? 4 : 1;
      const recNow  = rec && rec.row === i && (rec.which === 1 || rec.which === 3 || rec.which === 4);
      h += '<button class="btn btn-outline" style="padding:2px 8px" onclick="macroRecord(' + i + ',' + which + ')"' +
           (rec && !recNow ? ' disabled' : '') + '>' + (recNow ? 'Stop' : 'Record output') + '</button>';
      h += ' <button class="btn btn-outline" style="padding:2px 6px" onclick="macroPickOpen(' + i + ')"' +
           (rec || pickOpen ? ' disabled' : '') +
           ' title="' + (outKind === 1 ? 'Choose the controller button by hand'
                        : outKind === 2 ? 'Choose the mouse action by hand'
                        : 'Set the combo by hand - needed for Win and Alt+Tab combos the browser cannot capture') +
           '">Pick</button>';
    }
    h += '</td>';
    h += '<td style="padding:2px 8px;color:' + (outTxt !== '—' ? 'inherit' : 'var(--sub)') + '">' + outTxt + '</td>';
    h += '<td><button class="btn btn-outline" style="padding:2px 6px" onclick="macroDeleteRow(' + i + ')"' + dis + '>−</button></td>';
    h += '</tr>';
    h += macroOptionsRowHTML(i, m, isStick, dis);
    if (pickInOpen){
      h += '<tr><td colspan="7" style="padding:8px 10px">' + macroPickInHTML(i) + '</td></tr>';
    }
    if (pickOpen && macroOutKind(i, m) === 2){
      h += '<tr><td colspan="7" style="padding:8px 10px">' + macroPickOutHTML(i, m, Array.from({length: MOUT_LAST - MOUT_FIRST + 1}, (_, n) => MOUT_FIRST + n), 'Which mouse action should this macro send?') + '</td></tr>';
    } else if (pickOpen && macroOutKind(i, m) === 1){
      // Controller output: pick a BUTTON, not a key combo.
      h += '<tr><td colspan="7" style="padding:8px 10px">' + macroPickBtnHTML(i, m) + '</td></tr>';
    } else if (pickOpen){
      h += '<tr><td colspan="7" style="padding:8px 10px;background:#111a22;border-radius:6px">';
      h += '<div style="font-size:12px;color:var(--sub);margin-bottom:6px">' +
           'Set the combo by hand. Needed for anything the browser cannot capture — ' +
           'Win combos, Alt+Tab, Ctrl+W / Ctrl+T / F11.</div>';
      for (const mp of MOD_PICK){
        const on = pick.mods.indexOf(mp[0]) >= 0;
        h += '<label style="margin-right:12px;font-size:13px"><input type="checkbox" ' +
             'onchange="macroPickMod(' + mp[0] + ', this.checked)"' + (on ? ' checked' : '') +
             '> ' + escAttr(mp[1]) + '</label>';
      }
      h += '<select onchange="macroPickKey(+this.value)" style="padding:2px 4px;font-size:13px;margin-right:10px">';
      h += '<option value="0">— key —</option>';
      for (const ko of macroKeyOptions()){
        h += '<option value="' + ko[0] + '"' + (pick.key === ko[0] ? ' selected' : '') + '>' + escAttr(ko[1]) + '</option>';
      }
      h += '</select>';
      h += '<button class="btn" style="padding:2px 10px;margin-right:6px" onclick="macroPickApply()">Set</button>';
      h += '<button class="btn btn-outline" style="padding:2px 10px" onclick="macroPickCancel()">Cancel</button>';
      h += '</td></tr>';
    }
  }
  h += '</table>';
  if (!shown){
    h += '<div style="padding:10px 2px;color:var(--sub);font-size:12px">No macros yet — press + to add one.</div>';
  }
  h += '<div style="margin-top:8px;display:flex;gap:8px;align-items:center">';
  h += '<button class="btn btn-outline" style="padding:2px 10px" onclick="macroAddRow()"' + (rec ? ' disabled' : '') + '>+</button>';
  h += '<button class="btn" style="padding:2px 10px" onclick="macroSaveTable()"' + (rec ? ' disabled' : '') + '>Save macros to device</button>';
  h += '<button class="btn btn-outline" style="padding:2px 10px" onclick="macroExportFile()"' + (rec ? ' disabled' : '') + '>Export macros</button>';
  h += '<button class="btn btn-outline" style="padding:2px 10px" onclick="macroImportPick()"' + (rec ? ' disabled' : '') + '>Import macros</button>';
  h += '<span id="macrosave" style="font-size:12px;color:var(--sub)"></span>';
  h += '</div>';
  h += macroMotionPanelHTML();
  h += macroLivePanelHTML();
  box.innerHTML = h;
}

// Saves the WHOLE macro state: the shared table AND the enable mask.
//
// It used to write only the table. The checkbox lives in config.macro_disable,
// which is an ordinary config field, so it reached the device only via the main
// Save to Device button - two save buttons with the checkbox belonging to the
// far one. Consequences, both of which looked like separate bugs: the engine
// early-returns when no macro is enabled, so nothing fired; and a slot snapshots
// the DEVICE's config, so saving a slot captured an all-disabled mask and the
// checkbox came back clear after loading it.
//
// Delegating the field half to saveAll() rather than reimplementing it also
// picks up the enumeration crossing for free - enabling the first macro adds the
// keyboard interface to the USB descriptor and needs a reconnect to take effect.
// Hand-rolling the enumeration check in a second save path is how the two get
// out of step.
async function macroExportFile(){
  const el = document.getElementById('macrosave');
  if (!window._macroRows){ if (el) el.textContent = 'Load macros first.'; return; }
  const list = macroTableToJson(window._macroRows);
  if (!list.length){ if (el) el.textContent = 'No macros to export.'; return; }
  const dump = { format: 'ds5dongle-macros', version: 1,
                 savedAt: new Date().toISOString(), macros: list };
  const blob = new Blob([JSON.stringify(dump, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  const stamp = new Date().toISOString().slice(0,19).replace(/[:T]/g,'-');
  a.href = URL.createObjectURL(blob); a.download = 'ds5dongle-macros-' + stamp + '.json';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  if (el) el.textContent = 'Exported ' + list.length + ' macro' + (list.length===1?'':'s') + ' \u2713';
}

function macroImportPick(){
  const inp = document.createElement('input');
  inp.type = 'file'; inp.accept = '.json,application/json';
  inp.onchange = () => { if (inp.files && inp.files[0]) macroImportFile(inp.files[0]); };
  inp.click();
}

async function macroImportFile(file){
  const el = document.getElementById('macrosave');
  let dump;
  try { dump = JSON.parse(await file.text()); }
  catch { if (el) el.textContent = 'Not a valid JSON file.'; return; }
  if (!dump || dump.format !== 'ds5dongle-macros' || !Array.isArray(dump.macros)){
    if (el) el.textContent = 'Not a DS5Dongle macro file.'; return;
  }
  // Destructive and GLOBAL: this replaces the definitions every profile refers
  // to, not just the current one. Always confirm, never silently.
  if (!await askYesNo('Import these macro definitions?',
        'This file contains ' + dump.macros.length + ' macro definition' +
        (dump.macros.length===1?'':'s') + '. Importing REPLACES every macro on the ' +
        'dongle, for all profiles. Which macros each profile enables is not changed.\n\n' +
        'They load into the editor first \u2014 nothing reaches the device until you ' +
        'press Save macros to device.',
        'Import', 'Cancel')){
    if (el) el.textContent = 'Import cancelled.'; return;
  }
  window._macroRows = macroTableFromJson(dump.macros);
  macroRender();
  if (el) el.textContent = 'Imported ' + dump.macros.length +
    ' \u2014 press "Save macros to device" to write them.';
}

// Any ENABLED row with a mouse output, in the rows as they will be saved.
function macroAnyMouseEnabled(){
  const rows = window._macroRows || [];
  for (let i = 0; i < MACRO_COUNT; i++){
    const m = rows[i];
    if (m && m.present && macroBit(i) && macroIsMouseOut(m.out_btn)) return true;
  }
  return false;
}

async function macroSaveTable(){
  const el = document.getElementById('macrosave');
  if (!device){ if (el) el.textContent = 'No device.'; return; }
  if (el) el.textContent = 'Writing macro table…';
  // Whether the MOUSE interface exists depends on the committed table: a saved,
  // enabled mouse row makes the dongle present a mouse. Editing must not
  // re-enumerate under the user, so the comparison is made across the save -
  // what the device held before against what it will hold after.
  const mouseBefore = !!window._macroMouseSaved;
  const mouseAfter  = macroAnyMouseEnabled();
  try {
    await hidLocked(() => macroWriteAll());
  } catch(e){
    if (el) el.textContent = 'Table write failed: ' + e;
    return;
  }
  window._macroMouseSaved  = mouseAfter;
  window._macroMouseReenum = (mouseBefore !== mouseAfter);
  if (el) el.textContent = 'Saving enable state…';
  await saveAll();   // writes macro_disable, persists to flash, reconnects if the
                     // keyboard interface has to appear or disappear


  // saveAll()'s common path refreshes savedSnapshot and returns WITHOUT calling
  // render(), deliberately - it avoids handle churn when nothing about the USB
  // descriptor changed. The dirty banner is drawn from that snapshot, so without
  // an explicit repaint it kept claiming there were unsaved changes after a
  // successful save. Repaint first, then write the status line, because
  // macroRender() rebuilds the box and would otherwise discard it.
  macroRender();
  const el2 = document.getElementById('macrosave');
  if (el2) el2.textContent = 'Saved. Save a slot to capture this enable state for a game.';
}

const TABS = [
  {id:'device',   label:'Device'},
  {id:'haptics',  label:'Haptics'},
  {id:'triggers', label:'Triggers'},
  {id:'gyro',     label:'Gyro / Stick'},
  {id:'macros',   label:'Macros'},
  {id:'slots',    label:'Slots'},
];
window._tab = window._tab || 'triggers';
// Picking a tab clears any search: the tabs mean "take me to this page", and
// leaving a filter applied underneath would show that page's name while showing
// results from everywhere else.
function setTab(id){ window._tab = id; window._q = ''; render(); }

// ===== Find a setting =====
// The tabs answer "what can I change on this page"; they cannot answer "where
// did they put X". This filters EVERY field on EVERY tab at once and groups the
// matches under the section and tab they actually live in, so the answer also
// teaches where to look next time.
//
// Nothing is re-bound. Matches are drawn by the same fieldRowHTML() the tabs
// use, so a row edited from a search result writes to config[] and saves exactly
// as it would in place, and saveAll() still walks FIELDS rather than the DOM.
// With an empty query render() takes its original path untouched.
window._q = window._q || '';
function setSearch(v){ window._q = v || ''; render(); }
function searchKey(e){ if (e && e.key === 'Escape') setSearch(''); }

// Each term is matched in two folds: the plain lowercase text, which keeps word
// boundaries, and a squashed form with the punctuation and spaces removed. That
// is what makes "deadzone" find "Dead zone" and "lowpass" find "low-pass"
// without maintaining a list of aliases that would go stale as fields are added.
const _squash = s => String(s).toLowerCase().replace(/[^a-z0-9]+/g,'');
function searchTerms(q){
  return String(q).toLowerCase().split(/\s+/).filter(Boolean)
           .map(t => ({ plain:t, squashed:_squash(t) }))
           .filter(t => t.squashed);
}

// Everything a field can reasonably be searched by: its label, its config key,
// its section, the glossary line, and the labels of its own dropdown options.
// The options matter — "flick stick", "ratchet" and "always on" are option
// labels, not field names, and are exactly what someone types when hunting for
// the setting that contains them.
function fieldHaystack(f, sectionTitle){
  const [fid,key,type,label,kind,opts] = f;
  let s = `${label} ${key} ${sectionTitle}`;
  const d = DESCRIPTIONS[key];
  if (d) s += ' ' + d;
  if (kind === 'select' && opts){
    const pairs = Array.isArray(opts) ? opts : Object.entries(opts);
    for (const [,lbl] of pairs) s += ' ' + lbl;
  } else if (kind === 'bits' && Array.isArray(opts)){
    s += ' ' + opts.join(' ');
  }
  return s;
}
// All terms must match (AND), so adding a word narrows rather than widens.
function fieldMatches(hay, terms){
  const plain = String(hay).toLowerCase(), squashed = _squash(hay);
  return terms.every(t => plain.includes(t.plain) || squashed.includes(t.squashed));
}

// Sections in their normal order, reduced to the fields that match. Both trigger
// sections appear separately here rather than as the side-by-side pair: a lone
// matching row has no partner to align with, and each section's own title says
// which trigger it belongs to.
// Whole PANELS that are not config fields, so searchResults' walk over SECTIONS
// cannot see them. The Macros tab is drawn by macroRender() into #macrobox and
// the slot list by refreshSlots(), so searching "gesture" or "backup" found
// nothing at all - the feature exists, the search just had no index for it.
// Terms are what someone would actually type looking for the thing, not the
// internal names.
const PANEL_SEARCH = [
  { tab:'macros', title:'Macros — button press / combo',
    blurb:'Bind a controller button or combination to a keyboard combo or another controller button.',
    terms:'macro macros chord combo button press remap rebind keyboard shortcut hotkey bind' },
  { tab:'macros', title:'Macros — motion gestures',
    blurb:'Hold a gate button and flick the controller to fire a macro.',
    terms:'gesture gestures motion flick wrist gate stroke shake tilt draw' },
  { tab:'macros', title:'Macros — touchpad swipes',
    blurb:'Swipe the touchpad to fire a macro. Direction, half of the pad, one or two fingers.',
    terms:'gesture gestures swipe touchpad pad finger fingers slide' },
  { tab:'macros', title:'Macros — stick to keys',
    blurb:'Map a stick to four keys, one per direction. Diagonals press both.',
    terms:'stick sticks wasd analog direction directions remap keys movement' },
  { tab:'macros', title:'Macros — hold and replace',
    blurb:'Hold keeps the output asserted while the input is held; Replace hides the input from the game.',
    terms:'hold held replace suppress hide remap toggle burst' },
  { tab:'macros', title:'Macros — live test and diagnostics',
    blurb:'See the report the game receives, and what the macro engine is hiding and sending right now.',
    terms:'test tester live diagnostic diagnostics debug input report hide hiding suppress inject paddle fn touchpad half rate monitor' },
  { tab:'macros', title:'Macros — import, export and backup',
    blurb:'Macro definitions are shared by every profile and travel in their own file.',
    terms:'macro export import backup restore share file json save' },
  { tab:'slots', title:'Profile slots — backup and restore',
    blurb:'Save the whole configuration to a slot, and back every slot up to one file.',
    terms:'slot slots profile profiles backup restore save load game per-game' },
];

function panelSearchResults(q){
  const terms = searchTerms(q);
  if (!terms.length) return [];
  return PANEL_SEARCH.filter(p =>
    fieldMatches((p.title + ' ' + p.blurb + ' ' + p.terms).toLowerCase(), terms));
}

function searchResults(q){
  const terms = searchTerms(q);
  if (!terms.length) return [];
  const out = [];
  for (const sec of SECTIONS){
    const hits = sec.fields.filter(f => fieldMatches(fieldHaystack(f, sec.title), terms));
    if (hits.length) out.push({ sec, hits });
  }
  return out;
}

function searchBarHTML(q, groups){
  const n = groups.reduce((a,g) => a + g.hits.length, 0);
  const tabs = new Set(groups.map(g => SECTION_TAB[g.sec.title] || 'device'));
  const hits = !q ? `${FIELDS.length} settings`
             : n  ? `${n} match${n===1?'':'es'} in ${tabs.size} tab${tabs.size===1?'':'s'}`
                  : 'no matches';
  return `<div class="searchwrap">
      <input type="search" id="qbox" value="${escAttr(q)}" autocomplete="off" spellcheck="false"
             placeholder="Find a setting — its name, or a word for what it does"
             oninput="setSearch(this.value)" onkeydown="searchKey(event)">
      <span class="hits">${hits}</span>` +
    (q ? `<button class="btn btn-outline" style="padding:8px 14px" onclick="setSearch('')">Clear</button>` : '') +
  `</div>`;
}

function searchResultsHTML(q, groups){
  const panels = panelSearchResults(q);
  if (!groups.length && !panels.length){
    return `<div class="card"><p class="nohits">Nothing matches that.<br>
      Try a word for what it does — <b>rumble</b>, <b>gyro</b>, <b>wake</b>, <b>dead zone</b>,
      <b>flick</b>, <b>macro</b>, <b>speaker</b>.</p></div>`;
  }
  let html = '';
  // Panels first: they are whole features, and a settings row is a poor answer
  // to someone who typed the name of one.
  for (const p of panels){
    const tabLabel = (TABS.find(t => t.id === p.tab) || {}).label || p.tab;
    html += `<div class="card"><div class="card-title">${p.title} <span class="intab">· ${tabLabel} tab</span></div>` +
            `<p style="margin:6px 0 8px;color:var(--sub);font-size:13px">${p.blurb}</p>` +
            `<button class="btn btn-outline" style="padding:2px 10px" onclick="setSearch('');setTab('${p.tab}')">Open the ${tabLabel} tab</button>` +
            `</div>`;
  }
  for (const { sec, hits } of groups){
    const tabId = SECTION_TAB[sec.title] || 'device';
    const tabLabel = (TABS.find(t => t.id === tabId) || {}).label || tabId;
    html += `<div class="card"><div class="card-title">${sec.title} <span class="intab">· ${tabLabel} tab</span></div>`;
    for (const f of hits) html += fieldRowHTML(f);
    html += `</div>`;
  }
  return html;
}

// Startup self-check. This portal is one large hand-edited file and several
// regressions were invisible: a field silently not rendered, an event attribute
// broken by an embedded quote, a panel showing a placeholder while its data
// still lived in memory. Fail loudly at load instead.
function portalSelfCheck(){
  const problems = [];
  const seen = new Map();
  for (const sec of SECTIONS){
    if (!(sec.title in SECTION_TAB)) problems.push(`section "${sec.title}" is not assigned to a tab`);
    for (const [fid,key] of sec.fields){
      if (seen.has(key)) problems.push(`field key "${key}" appears twice`);
      seen.set(key, fid);
    }
  }
  const ids = new Map();
  for (const [fid,key] of FIELDS){
    if (ids.has(fid) && ids.get(fid) !== key)
      problems.push(`field id 0x${fid.toString(16)} used by both "${ids.get(fid)}" and "${key}"`);
    ids.set(fid, key);
  }
  // every section must land on a tab that exists
  for (const sec of SECTIONS){
    const tab = SECTION_TAB[sec.title];
    if (!TABS.some(t => t.id === tab))
      problems.push(`section "${sec.title}" maps to unknown tab "${tab}"`);
  }
  if (problems.length){
    console.error('PORTAL SELF-CHECK FAILED:\n' + problems.join('\n'));
    const b = document.createElement('div');
    b.style.cssText = 'background:#5a1b1b;color:#ffd9d9;padding:8px 12px;font:12px system-ui;white-space:pre-wrap';
    b.textContent = 'Portal self-check failed — some settings may be unreachable:\n' + problems.join('\n');
    document.body.prepend(b);
  }
  return problems.length === 0;
}

// A gate hand-off is only useful if BOTH halves have something armed. The custom
// side always does; the slider side only plays where its resistance mode is armed.
// Rather than silently rewriting a resistance mode the user chose, flag the
// combination and name the setting to change.
// A trigger's second stage can drive a button that is ALSO the gate arming that
// same trigger's resistance. Pressing through the detent then opens the gate it
// is gated by, so the stage-2 press changes the resistance underneath the finger
// that is making it. Flag it rather than removing the option: gating on the
// OPPOSITE trigger is a legitimate setup, and only this overlap is a problem.
function t2GateWarning(key){
  const isR2 = key === 't2_button';
  const btn  = +config[isR2 ? 't2_button' : 't2_l2_button'] || 0;
  if (!btn) return '';
  const mode = +config[isR2 ? 'at_mode' : 'at_l2_mode'] || 0;
  const T    = isR2 ? 'R2' : 'L2';
  // at_mode 1 = gated by the opposite trigger, 3 = gated by that shoulder button.
  const gateBtn   = mode === 1 ? (isR2 ? 9 : 10)      // T2BTN_L2 : T2BTN_R2
                  : mode === 3 ? (isR2 ? 5 : 6)       // T2BTN_L1 : T2BTN_R1
                  : 0;
  if (!gateBtn || btn !== gateBtn) return '';
  const name = {5:'L1', 6:'R1', 9:'L2', 10:'R2'}[gateBtn];
  return `<b>${name}</b> is also what gates <b>${T} resistance</b>. Pressing through the ` +
         `detent would open that gate, changing the resistance under the finger making ` +
         `the press. Pick another button, or set <b>${T} resistance mode</b> to something ` +
         `that is not gated by ${name}.`;
}

// Touchpad-to-mouse and the two touchpad-based gyro activation schemes both
// want the same finger. Warned rather than blocked: the combination is coherent
// on mode 4 if you actually want the pointer and the gyro to take turns, and
// nothing here silently rewrites a setting the user chose.
function touchGyroWarning(){
  if (!(+config.touch_mouse >= 1)) return '';
  const m = +config.gyro_mode || 0;
  if (m !== 3 && m !== 4) return '';
  if (m === 3) {
    return 'Gyro is set to <b>only while the touchpad is touched</b>, which is exactly when ' +
           'your finger is also driving the pointer. Both feed the same mouse, so every drag ' +
           'gets finger movement plus wrist movement added together and overshoots. ' +
           'Gate the gyro on a trigger or shoulder instead, or turn Touchpad as Mouse off here.';
  }
  return 'Gyro is set to <b>ratchet</b>, so touching the touchpad pauses it — which is every ' +
         'time you move the pointer. You will get pointer or gyro, never both. That may be ' +
         'what you want on a desktop profile; if not, gate the gyro on a trigger or shoulder.';
}

function ceGateWarning(key){
  const isR2 = key === 'ce_r2_yield';
  const y = +config[isR2 ? 'ce_r2_yield' : 'ce_l2_yield'] || 0;
  const en = +config[isR2 ? 'ce_r2_enable' : 'ce_l2_enable'] || 0;
  if (!en || !y) return '';
  const mode = +config[isR2 ? 'at_mode' : 'at_l2_mode'] || 0;
  const T = isR2 ? 'R2' : 'L2';
  const resLabel = `${T} resistance mode`;
  if (y === 2 && mode !== 2)
    return `Set <b>${resLabel}</b> to <b>always on</b>, or the ungated half is silent: the custom effect covers ${T} while the gate is held, and nothing is armed to cover it the rest of the time.`;
  if (y === 1 && mode === 0)
    return `<b>${resLabel}</b> is off, so the gated half is silent — the custom effect covers ${T} while the gate is open, but there is no slider effect to hand over to while it is held.`;
  return '';
}

// Sub-dividers inside a section: a bold labelled rule emitted BEFORE the named
// field, to visually split a long card into its distinct halves. Keyed by field
// so it survives fields being reordered around it.
const SUB_DIVIDERS = {
  // bold: true  -> the heavy rule used to split a long card in half
  // otherwise   -> the subtle rule, matching the "Shared by both triggers"
  //                separator above Kick follows
  'effect_leak_volume': { label: 'Speaker Effect Leak', bold: true },
  'ce_r2_enable':       { label: 'Custom captured effect' },
  'ce_l2_enable':       { label: 'Custom captured effect' },
};

// One settings row. Extracted from render() so the side-by-side trigger view can
// place identical markup into grid cells without duplicating any of it.
function fieldRowHTML(f){
  const [fid,key,type,label,kind,opts] = f;
  // The battery STAGE settings are stored as ordinary config fields so save,
  // load, profiles and slot backups all carry them for free - but a level, a
  // count, a colour and an on/off switch read as one thing, not five rows of
  // numbers. They are drawn by battStagesHTML() as a row per stage with a real
  // colour picker. The card still references config['...'] for each of them, so
  // the render harness sees every field as reachable.
  if (/^batt_stage_/.test(key)) return '';
  let html = '';
  const _d = SUB_DIVIDERS[key];
  if (_d) html += `<div class="${_d.bold ? 'subdiv' : 'subdiv-light'}">${_d.label}</div>`;
  html += `<div class="row"><div><div class="label">${label}${descMarker(key)}</div></div><div>`;
  if(kind==='macros'){
    html += `<div style="text-align:right;font-size:12px;color:var(--sub)">edited below</div>`;
    html += `</div></div><div id="macrobox">Connect a device to load macros.</div>`;
    // Hidden mirror so saveAll()'s FIELDS walk writes the bitmap like any other
    // field; the checkboxes drive it via macroBit().
    // Bound the same way every other field is, so the render harness sees it and
    // saveAll()'s FIELDS walk picks it up. Value is numeric - no quoted data goes
    // into the attribute.
    html += `<input type="hidden" id="f_macro_disable" oninput="config['macro_disable']=+this.value" value="${(+config['macro_disable']>>>0)}">`;
    return html;
  }
  if(kind==='bits'){
    // One checkbox per bit of a bitmask byte (e.g. gyro/right-stick X & Y invert).
    // Each toggles its own bit of config[key] and leaves the others untouched, so
    // the single stored byte round-trips through the normal read/save loop.
    const cur = +config[key] || 0;
    html += `<div style="display:flex;gap:16px;flex-wrap:wrap;justify-content:flex-end;align-items:center">`;
    (opts||[]).forEach((lbl,i) => {
      const mask = 1 << i;
      html += `<label style="display:inline-flex;align-items:center;gap:5px;cursor:pointer;font-size:14px">`
            + `<input type="checkbox" ${(cur&mask)?'checked':''} onchange="config['${key}']=((+config['${key}']||0)&~${mask})|(this.checked?${mask}:0);(window._dirty=window._dirty||{})['${key}']=1" style="width:auto;margin:0"> ${lbl}</label>`;
    });
    html += `</div>`;
  } else if(kind==='bool'){
    // Same reasoning as the select below: a field that drives an inline warning
    // has to redraw, or the warning only appears after some other edit.
    const reRenderB = ['touch_mouse'].includes(key);
    html += `<select onchange="config['${key}']=+this.value;(window._dirty=window._dirty||{})['${key}']=1${reRenderB?';render()':''}">
      <option value="0" ${config[key]==0?'selected':''}>No</option>
      <option value="1" ${config[key]==1?'selected':''}>Yes</option></select>`;
  } else if(kind==='select'){
    // NOTE: never embed a JSON array here - its double quotes close the onchange
    // attribute and silently break EVERY select in the portal. Decide the
    // re-render here and emit only a bare call.
    const reRender = ['ce_r2_yield','ce_l2_yield','at_mode','at_l2_mode','ce_r2_enable','ce_l2_enable','t2_button','t2_l2_button','gyro_mode'].includes(key);
    html += `<select onchange="config['${key}']=+this.value;(window._dirty=window._dirty||{})['${key}']=1${reRender?';render()':''}">`;
    { const pairs = Array.isArray(opts) ? opts : Object.entries(opts); for(const [v,lbl] of pairs) html += `<option value="${v}" ${config[key]==v?'selected':''}>${lbl}</option>`; }
    html += `</select>`;
  } else {
    const [min,max]=opts;
    const step = (type==='f32') ? '0.05' : '1';
    const val = (config[key]??0);
    const shown = (type==='f32') ? Number(val).toFixed(2) : val;
    // CLAMP to the declared range. min/max on a number input only style the
    // spinner - a typed value goes straight through, and writeField() then
    // masks it to the field width. That silently turned a typed 2000 into 208
    // (2000 & 0xFF) rather than the maximum, so the setting appeared to behave
    // backwards. Clamp here and write the clamped value back into the box, so
    // what is shown is what was sent.
    html += `<input type="number" min="${min}" max="${max}" step="${step}" value="${shown}" onchange="config['${key}']=cfgClampNum(this, ${min}, ${max}, ${type === 'f32'});(window._dirty=window._dirty||{})['${key}']=1">`;
  }
  html += `</div></div>`;
  if(key === 'ce_r2_yield' || key === 'ce_l2_yield'){
    const w = ceGateWarning(key);
    if(w) html += `<div class="row" style="padding-top:0"><div></div><div style="font-size:11px;color:#e0a030;line-height:1.35">⚠ ${w}</div></div>`;
  }
  if(key === 'touch_mouse' || key === 'gyro_mode'){
    const w = touchGyroWarning();
    if(w) html += `<div class="row" style="padding-top:0"><div></div><div style="font-size:11px;color:#e0a030;line-height:1.35">⚠ ${w}</div></div>`;
  }
  if(key === 't2_button' || key === 't2_l2_button'){
    const w = t2GateWarning(key);
    if(w) html += `<div class="row" style="padding-top:0"><div></div><div style="font-size:11px;color:#e0a030;line-height:1.35">⚠ ${w}</div></div>`;
  }
  return html;
}

// R2 and L2 side by side. The two lists are otherwise identical in content and
// order, so pairing them by their shared logical key keeps every row aligned -
// a CSS grid sizes each row to its tallest cell, so a label that wraps on one
// side can't make the columns drift apart. "Kick follows" is the one field that
// is SHARED by both triggers (it lives in the R2 list only), so it is lifted out
// to a full-width row beneath rather than left dangling in one column.
const R2_TITLE = 'Adaptive Triggers — R2 (right trigger)';
const L2_TITLE = 'Adaptive Triggers — L2 (left trigger)';
const SHARED_TRIGGER_KEYS = new Set(['at_pushback_src']);
const trigLogical = k => k.replace('at_l2_','at_').replace('ce_l2_','ce_').replace('ce_r2_','ce_').replace('t2_l2_','t2_');
function triggerPairHTML(){
  const secOf = t => (SECTIONS.find(s => s.title === t) || {fields:[]}).fields;
  const r2 = secOf(R2_TITLE), l2 = secOf(L2_TITLE);
  const shared = [...r2, ...l2].filter(f => SHARED_TRIGGER_KEYS.has(f[1]));
  const l2map = new Map(l2.filter(f => !SHARED_TRIGGER_KEYS.has(f[1]))
                          .map(f => [trigLogical(f[1]), f]));
  const rows = [];
  for(const f of r2){
    if(SHARED_TRIGGER_KEYS.has(f[1])) continue;
    const lk = trigLogical(f[1]);
    rows.push([f, l2map.get(lk) || null]);
    l2map.delete(lk);
  }
  for(const f of l2map.values()) rows.push([null, f]);   // any L2-only field
  let h = `<div class="card"><div class="card-title">Adaptive Triggers</div>
    <div class="tpair">
      <div class="tcolhead">L2 — left trigger</div>
      <div class="tcolhead">R2 — right trigger</div>`;
  // L2 first: the columns mirror the controller, where L2 is the left trigger.
  for(const [a,b] of rows)
    h += `<div class="tcell">${b ? fieldRowHTML(b) : ''}</div><div class="tcell">${a ? fieldRowHTML(a) : ''}</div>`;
  h += `</div>`;
  if(shared.length){
    h += `<div class="tshared"><div style="font-size:11px;color:var(--sub);margin-bottom:2px">Shared by both triggers</div>`;
    for(const f of shared) h += fieldRowHTML(f);
    h += `</div>`;
  }
  return h + `</div>`;
}

function render(){
  const app=document.getElementById('app');
  const on = device && device.opened;
  // Every keystroke in the search box re-renders, which replaces the box itself
  // and drops the caret. Note where it was before the rebuild and put it back
  // afterwards; anything else makes the field unusable after one character.
  const _qEl = (typeof document !== 'undefined') ? document.activeElement : null;
  const _qFocused = !!(_qEl && _qEl.id === 'qbox');
  const _qCaret = _qFocused ? _qEl.selectionStart : 0;
  let html = `<h1>DS5 Studio Bridge <span style="font-size:13px;color:var(--sub)">v1.40.0</span></h1>
    <div class="status-bar"><div class="dot ${on?'on':''}"></div>
      <span style="flex:1">${on?`Connected — ${device.productId===DSE_PID?'DualSense Edge':'DualSense'}${fwVer?` · FW v${fwVer.maj}.${fwVer.min}.${fwVer.pat} · config v${fwVer.cfgv}`:` · FW: pre-1.0.5 (no version fields)`}`:'Not connected'}</span>
      <button class="btn ${on?'btn-outline':'btn-primary'}" onclick="${on?'disconnect()':'connect()'}">${on?'Disconnect':'Connect'}</button>
    </div>`;
  if(!on){
    html += `<div class="card"><p class="info-text">Click Connect and pick your DS5 Bridge.<br>Chrome or Edge required (WebHID).</p></div>`;
    app.innerHTML=html; return;
  }
  html += profileBarHTML();   // loaded-profile line, under the connect box, every tab
  const tab = window._tab || 'triggers';
  // A search spans every tab, so no single tab is the one being shown while it
  // is running. Marking one active would be a lie about where the results came
  // from; clicking any tab clears the search and returns to that page.
  const q = (window._q || '').trim();
  const groups = q ? searchResults(q) : [];
  html += `<div class="tabbar">` + TABS.map(t =>
      `<button class="tab ${(!q && t.id===tab)?'active':''}" onclick="setTab('${t.id}')">${t.label}</button>`
    ).join('') + `</div>`;
  html += searchBarHTML(q, groups);

  if (q){
    html += searchResultsHTML(q, groups);
  } else {
  for(const section of SECTIONS){
    if ((SECTION_TAB[section.title] || 'device') !== tab) continue;
    if (section.title === L2_TITLE) continue;              // drawn beside R2
    if (section.title === R2_TITLE) { html += triggerPairHTML(); continue; }
    html += `<div class="card"><div class="card-title">${section.title}</div>`;
    for(const f of section.fields) html += fieldRowHTML(f);
    // The stage rows belong INSIDE their own section, directly under the enable
    // they depend on - not appended after every other card at the foot of the
    // page, where the Save button sits between a setting and its switch.
    if (section.title === 'Battery Notification') html += battStagesPanelHTML();
    if (section.title === 'Tilt Steering (experimental)') {
      html += '<div style="font-size:12px;color:var(--sub);margin-top:6px">' +
              'Calibrate with <b>Start live test</b> on the Macros tab: roll the pad and watch the ' +
              '<b>L stick</b> figure. That is the value the game receives, so you can see the offset ' +
              'appear and size it against the game\'s own steering dead zone \u2014 a setting that looks ' +
              'active here can still be swallowed before it reaches the car.</div>';
    }
    html += `</div>`;
    // BRACES MATTER HERE: the single-statement form let the two lines added
    // below run for EVERY section on EVERY tab, emitting the audio panel over
    // and over. The duplicate-id check caught it; nothing about the page looked
    // wrong until then.
    if (section.title === 'Auto-Haptics & Speaker Effect Leak') {
      html += `<div class="card"><div class="card-title">Auto-haptics — live <span style="font-size:11px;color:var(--sub)">(updates while connected)</span></div><div id="ahbox" style="font-size:13px">Connect to see live auto-haptics activity.</div></div>`;
      html += audioBridgeHTML();
    }
  }
  }
  html += `<div class="actions">
    <button class="btn btn-green" onclick="saveAll()">Save to Device</button>
    <button class="btn btn-outline" onclick="readAll().then(render)">Re-read</button>
    <button class="btn btn-outline" onclick="exportProfile()">Export Profile</button>
    <button class="btn btn-outline" onclick="exportHtml()">Export HTML</button>
    <button class="btn btn-outline" onclick="document.getElementById('importFile').click()">Import Profile</button>
    <input type="file" id="importFile" accept=".json" style="display:none" onchange="importProfile(event)">
    <button class="btn btn-outline" onclick="rebootBootloader()">Reboot to Bootloader</button>
  </div>
  ` + (!q && tab==='slots' ? `<div class="card"><div class="card-title">Profile Slots <span style="font-size:11px;color:var(--sub)">(stored on the dongle — fw 1.1.2+)</span></div>
    <div style="font-size:12px;color:var(--sub);margin-bottom:6px">Save the current settings into a numbered slot once; activating a slot later is a single instant command (used by the automation via slot-activate.html).</div>
    <div style="font-size:12px;margin-bottom:8px">📥 <a href="https://artzox.github.io/DS5Dongle-Studio/profiles.html" target="_blank" rel="noopener" style="color:var(--accent)">Browse shared game profiles ↗</a> <span style="color:var(--sub)">— download one, use Import Profile above, then save it into a slot.</span></div>
    <div id="slotbox" style="font-size:13px">Connect to manage slots.</div></div>` : '') + `
  ` + (!q && tab==='triggers' ? `<div class="card"><div class="card-title">Trigger Effect Monitor &amp; Custom Effects <span style="font-size:11px;color:var(--sub)">(capture real game effects)</span></div>
    <div style="font-size:12px;color:var(--sub);margin-bottom:6px">Captures genuine adaptive-trigger effects a game sends (resistance, weapon-break, vibration). Play the game, do the action, press Refresh. Tick the states that make up one action (up to 5), then <b>Assign</b>. Mechanical states (weapon-breaks, resistances) replay <b>positionally in sequence</b> along the pull — walls and resistances land at their captured trigger positions; vibration pairs blend at the rate slider. Configure the condition/threshold/rate in the trigger's Custom Effect fields above, then Save to a slot. <b>Note:</b> only real game-sent effects capture — firmware-converted rumble (e.g. Control) and DS4Windows/Xbox rumble do not, as those aren't trigger effects the game sent.</div>
    <button class="btn btn-outline" style="padding:2px 10px;margin-bottom:4px" onclick="refreshEffectMonitor()">Refresh captured effects</button>
    <span style="font-size:12px;color:var(--sub)"> · Load custom effect file → </span>
    <button class="btn btn-outline" style="padding:2px 8px" onclick="document.getElementById('ceFileL2').click()">L2</button>
    <button class="btn btn-outline" style="padding:2px 8px" onclick="document.getElementById('ceFileR2').click()">R2</button>
    <input type="file" id="ceFileR2" accept=".json" style="display:none" onchange="loadCustomFile(event,0)">
    <input type="file" id="ceFileL2" accept=".json" style="display:none" onchange="loadCustomFile(event,1)">
    <span style="font-size:12px;color:var(--sub)"> · 📥 <a href="https://artzox.github.io/DS5Dongle-Studio/effects.html" target="_blank" rel="noopener" style="color:var(--accent)">browse shared effects ↗</a></span>
    <div id="effmon" style="font-size:13px;margin-top:6px">Connect and press Refresh after triggering an effect in-game.</div>
    <div style="border-top:1px solid var(--line,#333);margin-top:8px;padding-top:6px">
      <b style="font-size:13px">Timeline recording</b> <span style="font-size:11px;color:var(--sub)">— captures the effect's real RHYTHM (each state's held duration), so replay needs no rate dial-in. Record → do the action in-game → Stop &amp; fetch → tick the loopable core → Assign.</span><br>
      <button class="btn btn-outline" style="padding:2px 10px;margin-top:4px" onclick="tlRecordStart()">● Record</button>
      <button class="btn btn-outline" style="padding:2px 10px;margin-top:4px" onclick="tlRecordStop()">Stop &amp; fetch</button>
      <div id="tlbox" style="font-size:13px;margin-top:6px;color:var(--sub)">Not recording.</div>
    </div></div>
  <div class="card"><div class="card-title">Build a Custom Effect <span style="font-size:11px;color:var(--sub)">(author stages by hand — no game capture needed)</span></div>
    <div style="font-size:12px;color:var(--sub);margin-bottom:6px">Add up to 5 stages. Mechanical stages (weapon breaks, resistances) are played <b>in sequence as you pull</b>, ordered by their start zone — so two walls at different depths give a genuine two-stage pull, which the trigger sliders can't do. A vibration stage can be mixed in and takes over at its own depth (it replaces the wall there — the controller plays one trigger effect at a time). Each stage needs a <b>different start zone</b>, and stages want <b>room between them</b> — a stage squeezed into one or two zones can be skipped by a normal pull. Zones are 0–9 ≈ 0–100% of the pull. Weapon-break limits: wall start 2–7, break point 3–8. Bow limits: draw start 0–7, draw end 1–8. Values outside those are clamped, and the list shows what was actually encoded. A <b>bow</b> builds resistance through the draw and then <b>pushes the trigger back</b> at the end — the one thing resistance and weapon break can't do. Put any vibration on a <b>later</b> stage — a vibration on the first stage buzzes at rest.</div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:12px">
      <select id="ceb_type" onchange="cebTypeChanged()">
        <option value="break">Weapon break (wall that gives way)</option>
        <option value="bow">Bow / snap (draws, then pushes back)</option>
        <option value="resistance">Resistance</option>
        <option value="vibration">Vibration</option>
      </select>
      <label>Start zone <input type="number" id="ceb_start" min="0" max="9" value="2" style="width:52px"></label>
      <label id="ceb_endlbl">Break zone <input type="number" id="ceb_end" min="0" max="9" value="5" style="width:52px"></label>
      <label id="ceb_strlbl">Strength % <input type="number" id="ceb_str" min="0" max="100" value="100" style="width:60px" oninput="cebShowLevels()"></label><span id="ceb_strlvl" style="font-size:11px;color:var(--sub)"></span>
      <label id="ceb_snaplbl" style="display:none">Snap force % <input type="number" id="ceb_snap" min="0" max="100" value="100" style="width:60px" oninput="cebShowLevels()"></label><span id="ceb_snaplvl" style="font-size:11px;color:var(--sub)"></span>
      <label id="ceb_freqlbl" style="display:none">Frequency <input type="number" id="ceb_freq" min="1" max="255" value="40" style="width:60px"></label>
      <button class="btn btn-outline" style="padding:2px 10px" onclick="cebAddStage()">Add stage</button>
    </div>
    <div id="ceb_list" style="font-size:12px;margin-top:8px">No stages yet.</div>
    <div id="ceb_viz" style="margin-top:8px"></div>
    <div style="margin-top:6px">
      <button class="btn btn-outline" style="padding:2px 10px" onclick="cebAssign(1)">Assign → L2</button>
      <button class="btn btn-outline" style="padding:2px 10px" onclick="cebAssign(0)">Assign → R2</button>
      <button class="btn btn-outline" style="padding:2px 10px" onclick="cebSaveFile()">Save to file</button>
      <button class="btn btn-outline" style="padding:2px 10px" onclick="cebClear()">Clear list</button>
    </div>
    <div style="margin-top:8px;border-top:1px solid var(--line,#333);padding-top:6px">
      <span style="font-size:12px;color:var(--sub)">Remove the effect currently on a trigger — wipes its stored states and hands the trigger back to the sliders:</span><br>
      <button class="btn btn-outline" style="padding:2px 10px;margin-top:4px" onclick="ceClearDevice(1)">Remove effect from L2</button>
      <button class="btn btn-outline" style="padding:2px 10px;margin-top:4px" onclick="ceClearDevice(0)">Remove effect from R2</button>
    </div>
    <div style="margin-top:8px;border-top:1px solid var(--line,#333);padding-top:6px">
      <span style="font-size:12px;color:var(--sub)">See what is actually on a trigger right now — decoded, with the position window each stage will get:</span><br>
      <button class="btn btn-outline" style="padding:2px 10px;margin-top:4px" onclick="ceReadTrigger(1)">Read L2</button>
      <button class="btn btn-outline" style="padding:2px 10px;margin-top:4px" onclick="ceReadTrigger(0)">Read R2</button>
      <div id="ce_readout" style="font-size:12px;margin-top:6px">Nothing read yet.</div>
      <div id="ce_readviz" style="margin-top:8px"></div>
    </div>
    <div style="margin-top:8px;border-top:1px solid var(--line,#333);padding-top:6px">
      <span style="font-size:12px;color:var(--sub)">Save the effect currently on a trigger to a file (profile exports don't carry effect data):</span><br>
      <button class="btn btn-outline" style="padding:2px 10px;margin-top:4px" onclick="exportEffectFile(1)">Export effect from L2</button>
      <button class="btn btn-outline" style="padding:2px 10px;margin-top:4px" onclick="exportEffectFile(0)">Export effect from R2</button>
    </div></div>` : '') + `
  ` + (!q && tab==='device' ? `<div class="card"><div class="card-title">Diagnostic</div>
    <div id="diagbox" style="font-size:12px;color:var(--sub)">Reading live stream…</div>
    <div style="margin-top:10px;padding-top:8px;border-top:1px solid var(--line,#333)">
      <span style="font-size:12px;color:var(--sub)">Wake troubleshooting — what the dongle observed across sleeps since it was powered up:</span><br>
      <button class="btn btn-outline" style="padding:2px 10px;margin-top:4px" onclick="readWakeDiag()">Read wake diagnostics</button>
      <div id="wakediag" style="font-size:12px;margin-top:6px">Nothing read yet.</div>
    </div>
    </div>` : '') + `
  ` + (!q && tab==='gyro' ? `<div class="card"><div class="card-title">Gyro calibration</div>
    <div style="font-size:12px;color:var(--sub)">Both checks measure rather than guess: the first confirms the sensor scale, the second finds the number this game needs. Do them in that order.</div>
    <div style="margin-top:10px;padding-top:8px;border-top:1px solid var(--line,#333)">
      <span style="font-size:12px;color:var(--sub)">Gyro angle check \u2014 confirms that Natural sensitivity really is 1:1 on your hardware:</span><br>
      <button class="btn btn-outline" style="padding:2px 10px;margin-top:4px" onclick="gyroAngleStart()">Measure (8s)</button>
      <div id="gyroangle" style="font-size:12px;margin-top:6px">Press Measure, then make one full turn (360\u00b0) to the right during the countdown, ending where you started, and hold still.</div>
    </div>
    <div style="margin-top:10px;padding-top:8px;border-top:1px solid var(--line,#333)">
      <span style="font-size:12px;color:var(--sub)">Counts per 360\u00b0 \u2014 measure it instead of guessing. Needs gyro output set to Mouse, the game in the foreground, and in-game mouse acceleration and smoothing OFF:</span><br>
      <button class="btn btn-outline" style="padding:2px 10px;margin-top:4px" onclick="calSend()">1. Send 6500</button>
      <button class="btn btn-outline" style="padding:2px 10px;margin-top:4px" onclick="calSendHalf()">Send 3250 (check)</button>
      <span style="font-size:12px">2. how far did the view turn?
        <input id="calobs" type="number" min="1" max="3600" step="1" value="180" style="width:70px"> \u00b0
      </span>
      <button class="btn btn-outline" style="padding:2px 10px" onclick="calCompute()">3. Work it out</button>
      <div id="calbox" style="font-size:12px;margin-top:6px">Switch to the game first \u2014 the counts go wherever the mouse pointer would.</div>
    </div>` : '') + `
  `;
  app.innerHTML=html;
  if (_qFocused){
    const qi = document.getElementById('qbox');
    if (qi){ qi.focus(); try { qi.setSelectionRange(_qCaret, _qCaret); } catch(e){} }
  }
  // Only sweep the slots when their list is actually on screen. render() runs on
  // every tab switch and on some dropdown changes, and the sweep costs one HID
  // round-trip per slot (~60 ms each), so refreshing it from a tab that doesn't
  // show it was over a second of pointless traffic per re-render. Explicit
  // callers (save, activate, delete) still refresh directly.
  if ((window._tab || 'triggers') === 'slots') refreshSlots();
  // render() rebuilds the whole page, so the dynamic panels revert to their
  // placeholders while their data still exists in memory. Repopulate them, or the
  // builder shows an empty list yet still rejects a stage as a duplicate zone.
  try { if (typeof macroRender === 'function') macroRender(); } catch(e){}
  // Only sweep the macro table when it is on screen: 32 HID round-trips. Gate on
  // the box existing rather than on the tab id — identical on the Macros tab,
  // and it also covers the macro row arriving as a search hit, which would
  // otherwise sit forever on "Reading macros…".
  if (document.getElementById('macrobox') && device && !window._macroRows
      && !saving && !slotsBusy) {
    try { refreshMacros(); } catch(e){}
  }
  try { if (typeof cebRender === 'function') cebRender(); } catch(e){}
  try { if (typeof cebShowLevels === 'function') cebShowLevels(); } catch(e){}
}

render();
portalSelfCheck();

// --- Automation entry point (for AHK / Playnite) ---------------------------
// Opening the portal with ?autoapply=<base64-json>[&autosave=1] will:
//   1. silently reconnect to an already-granted device (no picker — WebHID allows
//      getDevices() without a gesture once the user has granted access once),
//   2. apply the profile encoded in the URL,
//   3. optionally Save to Device automatically.
// This lets a one-line AHK script (which just launches a URL) drive the whole
// config, avoiding fragile dialog-clicking. First-time setup still needs one
// manual Connect so the browser grants HID access to this origin.
// EMBEDDED_PROFILE: when this file is generated per-profile (see
// make-autoapply-html.py), the profile JSON is stamped in here and auto-applies
// the moment the page opens — no URL parameters needed, just open the file.
// Left null in the master portal (which behaves normally / uses URL params).
const EMBEDDED_PROFILE = null; /*EMBED_PROFILE_HOOK*/
const EMBEDDED_AUTOSAVE = true; /*EMBED_AUTOSAVE_HOOK*/

async function autoApply(){
  const params = new URLSearchParams(location.search);
  const enc = params.get('autoapply');
  // Source priority: an embedded profile (generated per-file) wins; else URL param.
  let json = null, profileName = null, autosave = false;
  if (EMBEDDED_PROFILE){
    json = EMBEDDED_PROFILE;
    profileName = (EMBEDDED_PROFILE && EMBEDDED_PROFILE.name) || 'embedded profile';
    autosave = EMBEDDED_AUTOSAVE;
  } else if (enc){
    try { json = JSON.parse(decodeURIComponent(escape(atob(enc)))); }
    catch(e){ try { json = JSON.parse(atob(enc)); } catch(_){ json = null; } }
    profileName = params.get('profile');
    autosave = params.get('autosave')==='1';
  }
  if (!json) return; // normal portal usage, no auto-apply

  const banner = document.createElement('div');
  banner.style.cssText = 'position:fixed;top:0;left:0;right:0;padding:14px;'
    + 'background:#1e293b;color:#e2e8f0;font:15px system-ui;text-align:center;z-index:9999';
  document.body.appendChild(banner);

  // The actual apply routine, usable both for silent auto-run and for a click.
  async function doApply(viaGesture){
    try {
      banner.textContent = 'Auto-apply: connecting…';
      banner.style.background = '#1e293b';
      let devs = await navigator.hid.getDevices();
      let d = pickDs5(devs);
      // If not already granted, a gesture lets us prompt the picker directly.
      if (!d && viaGesture){
        const picked = await navigator.hid.requestDevice({ filters: [
          {vendorId:SONY_VID, productId:DS5_PID}, {vendorId:SONY_VID, productId:DSE_PID} ]});
        d = picked && (pickDs5(picked) || picked[0]);
      }
      if (!d){
        showConnectButton('No granted device yet — click to connect and apply.');
        return;
      }
      device = d;
      if (!device.opened) await device.open();
      await sleep(300);
      await reloadFromDevice();

      const settings = (json && typeof json.settings==='object') ? json.settings : json;
      const known = new Set(FIELDS.map(f=>f[1]));
      let applied=0;
      for (const k of Object.keys(settings)){
        // Never apply the macro mask here, even if an older exported page carries
        // it. This runs unattended on every game launch with nobody to confirm,
        // and the field is enumeration-critical at its all-disabled boundary - a
        // re-enumeration part-way through a field-by-field apply interrupts the
        // rest. Per-game macro sets belong on the slot-activation path.
        if (k === 'macro_disable') continue;
        if(known.has(k)){ config[k]=settings[k]; applied++; }
      }
      if (json && json.effects){
        try { await writeEffectsToDevice(json.effects); } catch(e){ /* settings still apply */ }
      }
      render();
      banner.textContent = `Loaded ${applied} setting(s)` + (profileName?` from "${profileName}"`:'');

      if (autosave){
        banner.textContent += ' — saving…';
        await saveAll();
        banner.textContent = `"${profileName||'profile'}" saved to device ✓`;
        banner.style.background = '#14532d';
        // AUTOCLOSE: applied OK - close this tab so profile pages don't pile up.
        // A tab opened by the automation has a single history entry, which makes
        // it script-closable. Gated to embedded profiles (or ?autoclose=1) so the
        // master portal / manual use never closes itself; failure paths keep the
        // page open so errors stay visible.
        if (EMBEDDED_PROFILE || params.get('autoclose')==='1'){
          setTimeout(()=>{ try { window.close(); } catch(_){} }, 1200);
        }
      } else {
        banner.textContent += ' — click Save to Device to apply.';
      }
      setTimeout(()=>banner.remove(), 4000);
    } catch(e){
      showConnectButton('Auto-apply hit an error (' + e.message + ') — click to retry.');
    }
  }

  function showConnectButton(msg){
    // Surface the wait in the taskbar: the automation opens this window
    // minimized, so a silent "click to connect" state would be invisible.
    document.title = 'CONNECT NEEDED - DS5 Bridge Config';
    banner.style.background = '#7c2d12';
    banner.innerHTML = '';
    const span = document.createElement('span'); span.textContent = msg + '  ';
    const btn = document.createElement('button');
    btn.textContent = 'Connect & Apply';
    btn.style.cssText = 'padding:6px 14px;margin-left:8px;border-radius:6px;border:0;'
      + 'background:#22c55e;color:#052e16;font-weight:600;cursor:pointer';
    btn.onclick = () => doApply(true);
    banner.appendChild(span); banner.appendChild(btn);
  }

  // Try a fully silent apply first. If the browser blocks the gesture-free
  // connect (some Chrome versions require a click to reopen a granted device),
  // the catch/no-device path shows the one-click button instead — so the file
  // always works, best case with zero clicks, worst case with one.
  try { await doApply(false); }
  catch(e){ showConnectButton('Click to connect and apply this profile.'); }
}
autoApply();
</script>
