// ===== Tabbed navigation =====
// Sections keep their existing definitions; tabs are a RENDER-TIME partition, so
// no field entry moves and no binding changes. Custom-effect fields (ce_*) live
// inside the per-trigger sections but are shown on the Custom Effects tab, so
// everything about an effect sits together.
const SECTION_TAB = {
  'Adaptive Triggers — R2 (right trigger)':'triggers',
  'Adaptive Triggers — L2 (left trigger)':'triggers',
  'Rumble → Trigger':'triggers',
  'Auto-Haptics & Speaker Effect Leak':'haptics',
  'General Haptics & Audio':'haptics',
  'Native Haptics Filter':'haptics',
  'Gyro Aiming':'gyro',
  'Right Stick':'gyro',
  'Stick to Mouse':'gyro',
  'Device & Connection':'device',
  'Battery Notification':'device',
  'Touchpad as Mouse':'device',
  'Tilt Steering (experimental)':'device',
  'Advanced — BT Latency (experimental)':'device',
  'Macros':'macros',
};
// Order: connection first, then the feature areas, with Slots (where you save
// what you just set up) last. Custom effects are NOT a separate tab: every
// custom effect is a TRIGGER effect, and its settings cross-reference the
// resistance mode on the same trigger (the gate hand-off warning names it), so
// splitting them put a warning on one tab and its fix on another.
// Promise-based Yes/No dialog.
//
// window.confirm() cannot relabel its buttons, and "Cancel" reads as "abort the
// whole operation" - which is wrong whenever the question is about one PART of
// something already in progress: "include macro definitions in this backup?" is
// not an offer to cancel the backup. Yes/No removes that reading.
//
// Handlers are attached with addEventListener rather than inline attributes, so
// no caller-supplied text ever reaches an on*="..." attribute. The body is set
// via textContent for the same reason - macro names are user input.
function askYesNo(title, body, yesLabel, noLabel){
  return new Promise(resolve => {
    const ov = document.createElement('div');
    ov.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:10000;' +
      'display:flex;align-items:center;justify-content:center;padding:20px';
    const card = document.createElement('div');
    card.style.cssText = 'background:var(--card,#151b23);border:1px solid var(--border,#2a3441);' +
      'border-radius:10px;padding:18px 20px;max-width:560px;width:100%;' +
      'box-shadow:0 10px 40px rgba(0,0,0,.5);font:14px system-ui;color:var(--text,#e6edf3)';
    const h = document.createElement('div');
    h.style.cssText = 'font-weight:600;font-size:15px;margin-bottom:8px';
    h.textContent = title;
    const p = document.createElement('div');
    p.style.cssText = 'white-space:pre-wrap;font-size:13px;color:var(--sub,#9aa7b4);' +
      'margin-bottom:16px;max-height:50vh;overflow:auto';
    p.textContent = body || '';
    const row = document.createElement('div');
    row.style.cssText = 'display:flex;gap:8px;justify-content:flex-end';
    const no = document.createElement('button');
    no.className = 'btn btn-outline'; no.style.cssText = 'padding:4px 16px';
    no.textContent = noLabel || 'No';
    const yes = document.createElement('button');
    yes.className = 'btn'; yes.style.cssText = 'padding:4px 16px';
    yes.textContent = yesLabel || 'Yes';
    row.appendChild(no); row.appendChild(yes);
    card.appendChild(h); card.appendChild(p); card.appendChild(row);
    ov.appendChild(card); document.body.appendChild(ov);

    let done = false;
    const finish = v => {
      if (done) return; done = true;
      document.removeEventListener('keydown', onKey, true);
      ov.remove(); resolve(v);
    };
    const onKey = e => {
      if (e.key === 'Escape'){ e.preventDefault(); finish(false); }
      else if (e.key === 'Enter'){ e.preventDefault(); finish(true); }
    };
    no.addEventListener('click', () => finish(false));
    yes.addEventListener('click', () => finish(true));
    document.addEventListener('keydown', onKey, true);
    yes.focus();
  });
}

// ===================== Browser audio bridge (experimental) ==================
//
// Auto-haptics are DERIVED FROM PC AUDIO, so something has to capture what the
// PC is playing and send it to the dongle's USB audio input. That is what
// automation/ds5audio.py does, and needing Python running is the likeliest
// reason a newcomer concludes the feature is broken.
//
// This does the same job from the page: getDisplayMedia captures system audio,
// and AudioContext.setSinkId routes it to the dongle. No firmware change is
// needed - audio.cpp already sizes each packet at runtime
// (`actual_ch = bytes_read > 250 ? 4 : 2`), so a stereo sender is a case it
// already handles, and the dongle cannot tell the browser from the script.
//
// WHAT IT DOES NOT REPLACE, and this is not a detail: the picker cannot be
// automated or preselected, so Playnite starting capture on game launch is
// exactly what this cannot do. It is an on-ramp for trying auto-haptics with no
// install, not a replacement for the script.
//
// Two limits worth knowing before judging the result:
//   - System audio capture is Chrome on Windows only, and only when sharing the
//     ENTIRE screen with "Share system audio" ticked.
//   - The browser graph is stereo, so this feeds ch0/1. The ch2/3 DSP source and
//     native passthrough on ch2/3 stay script-only.
let abCtx = null, abStream = null, abSource = null;
let abSinks = [], abSinkId = '', abStatus = '', abRaw = [], abPerm = '', abSteps = [];

function audioBridgeHTML(){
  const on = !!abCtx;
  let h = '<div class="card"><div class="card-title">Browser audio bridge ' +
          '<span style="font-size:11px;color:var(--sub)">(experimental — no Python needed)</span></div>';
  h += '<p style="margin:6px 0 8px;color:var(--sub);font-size:13px">' +
       'Feeds PC audio to the dongle from this page, so auto-haptics work without running ' +
       'ds5audio.py. Chrome on Windows only. Share the <b>entire screen</b> and tick ' +
       '<b>Share system audio</b> when asked, or nothing will be captured.</p>';

  if (!abSinks.length){
    // Browsers only reveal output devices once the page holds a media
    // permission, and asking for a microphone unprompted - which this used to do
    // on simply opening the tab - is startling and looks like the page wants to
    // listen to you. Ask only when the button is pressed, and say why first.
    h += '<p style="margin:6px 0 8px;color:var(--sub);font-size:12px">' +
         'Chrome will not name audio devices until the page has been granted a media ' +
         'permission, so listing them asks for microphone access. Nothing is recorded — ' +
         'the microphone is released immediately.</p>';
    h += '<button class="btn btn-outline" style="padding:3px 12px" onclick="abListSinks()">List output devices</button>';
  } else {
    h += '<div style="margin-bottom:6px"><label style="font-size:12px;color:var(--sub)">Send to&nbsp;</label>' +
         '<select id="abSink" onchange="abPickSink(this.value)" style="padding:2px 4px;font-size:12px;min-width:300px">';
    for (const d of abSinks){
      h += '<option value="' + escAttr(d.id) + '"' + (d.id === abSinkId ? ' selected' : '') + '>' +
           escAttr(d.label) + '</option>';
    }
    h += '</select> <button class="btn btn-outline" style="padding:2px 8px;font-size:12px" onclick="abListSinks()">Refresh</button></div>';
    h += on ? '<button class="btn" style="padding:3px 14px" onclick="abStop()">Stop bridging</button>'
            : '<button class="btn" style="padding:3px 14px" onclick="abStart()">Start bridging</button>';
  }
  h += ' <span id="abStatus" style="font-size:12px;color:var(--sub);margin-left:8px">' + escAttr(abStatus) + '</span>';
  // What the browser ACTUALLY reported. Without this a failure is invisible: the
  // panel said "1 output found" while the one entry was an unusable placeholder.
  if (abRaw.length && !abSinks.length){
    h += '<div style="margin-top:8px;font-size:11px;color:var(--sub)">' +
         '<b>Microphone permission:</b> ' + escAttr(abPerm || 'not checked') +
         (abPerm === 'denied'
            ? ' — Chrome will not reveal audio outputs while this is blocked. Click the icon at the left of the address bar and allow Microphone for this site.'
            : '') +
         '<br><b>What happened, in order:</b><br>' +
         abSteps.map(t => '&nbsp;&nbsp;' + escAttr(t)).join('<br>') +
         '<br><b>What the browser reported:</b><br>';
    for (const d of abRaw){
      h += escAttr(d.kind) + ' — label ' + (d.label ? '"' + escAttr(d.label) + '"' : '(blank)') +
           ', id ' + (d.id ? escAttr(d.id.slice(0, 10)) + '…' : '(blank)') + '<br>';
    }
    if (location.protocol === 'file:'){
      h += '<b style="color:#e0a030">This page is open from a file on disk.</b> A file:// page ' +
           'has no persistent origin, so the browser grants the microphone for one call and ' +
           'then forgets it - which is exactly the "granted, then prompt, no labels" result ' +
           'above. Open the portal over https instead ' +
           '(artzox.github.io/DS5Dongle-Studio/ds5-config-portal.html) and try again. ' +
           'Everything else in the portal works from a file; only the audio bridge needs this.</div>';
    } else {
      h += 'A blank id and label means the browser has not granted this page access to ' +
           'audio outputs. Check the site permissions for Microphone, and note that ' +
           'output selection needs Chrome 110 or newer.</div>';
    }
  }
  h += '<div id="abSignal" style="font-size:12px;color:var(--sub);margin-top:6px"></div>';
  h += '</div>';
  return h;
}

function abPickSink(id){ abSinkId = id || ''; }

// Populated ONLY from the button. The list is cached because render() runs from
// nineteen places - filling the <select> from a timeout meant the next render
// emptied it again, which is why no devices ever appeared.
async function abListSinks(){
  abStatus = 'Looking for output devices…';
  render();
  try {
    // Record the permission STATE. When output enumeration comes back blank the
    // only useful question is whether the page actually holds the microphone
    // permission, and guessing at that is what made this hard to diagnose.
    abSteps = [];
    const step = t => abSteps.push(t);
    // Where the page is loaded FROM decides whether a media permission can be
    // remembered at all. A file:// page has an opaque origin: Chrome will grant
    // the microphone for that one call, then persist nothing and never reveal
    // device labels - which reads as "granted" followed immediately by "prompt"
    // and no labelled devices, with nothing obviously wrong.
    step('page origin: ' + location.protocol + (location.host ? '//' + location.host : '') +
         (window.isSecureContext ? ' (secure)' : ' (NOT a secure context)'));
    try {
      const st = await navigator.permissions.query({ name: 'microphone' });
      abPerm = st.state;
      step('permission before: ' + st.state);
    } catch(e){ abPerm = 'unknown'; step('permission query unsupported'); }

    // Firefox has a dedicated output picker that needs no microphone at all.
    // Chrome does not implement it, so it is tried first and falls through.
    if (navigator.mediaDevices.selectAudioOutput){
      try {
        const chosen = await navigator.mediaDevices.selectAudioOutput();
        if (chosen && chosen.deviceId){
          abSinks = [{ id: chosen.deviceId, label: chosen.label || 'selected output' }];
          abSinkId = chosen.deviceId;
          abRaw = [{ kind: 'audiooutput', id: chosen.deviceId, label: chosen.label || '' }];
          abStatus = 'Output chosen: ' + (chosen.label || 'selected device') + '.';
          render();
          return;
        }
      } catch(e){ /* dismissed, or not really supported - fall through */ }
    }

    let devs = await navigator.mediaDevices.enumerateDevices();
    step('first enumerate: ' + devs.length + ' device(s), ' +
         devs.filter(d => d.label).length + ' labelled');
    // Chrome's documented recipe: only prompt while the permission is still
    // undecided. Asking again when it is already denied just fails silently.
    if (!devs.some(d => d.kind === 'audiooutput' && d.label) && abPerm !== 'denied'){
      try {
        const t = await navigator.mediaDevices.getUserMedia({ audio: true });
        t.getTracks().forEach(x => x.stop());        // permission is all that was wanted
        step('microphone granted');
      } catch(e){
        // Dismissing the prompt leaves the state at "prompt" and rejects here,
        // which is indistinguishable from never having asked unless it is logged.
        step('microphone request failed: ' + (e && e.name ? e.name : e));
      }
      devs = await navigator.mediaDevices.enumerateDevices();
      step('after prompt: ' + devs.length + ' device(s), ' +
           devs.filter(d => d.label).length + ' labelled');
    }
    // Re-read the permission AFTER the attempt. The value captured above is the
    // state BEFORE prompting, so reporting it made a granted permission look
    // like it was still waiting to be asked.
    try {
      const st2 = await navigator.permissions.query({ name: 'microphone' });
      abPerm = st2.state;
      step('permission after: ' + st2.state);
    } catch(e){}
    // Keep the RAW list for the diagnostic below. Chrome hands back a single
    // placeholder entry with an empty deviceId and empty label when output
    // enumeration is not really permitted - which rendered as one blank row and
    // read as "1 output found" while being unusable.
    abRaw = devs.map(d => ({ kind: d.kind, id: d.deviceId || '', label: d.label || '' }));
    abSinks = devs.filter(d => d.kind === 'audiooutput' && d.deviceId)
                  .map(d => ({ id: d.deviceId,
                               label: d.label || ('unnamed output ' + String(d.deviceId).slice(0, 6)) }));
  } catch(e){
    abSinks = [];
    abStatus = 'Could not list devices: ' + (e && e.name ? e.name : e) +
               '. Microphone access has to be allowed for Chrome to name them.';
    render();
    return;
  }
  if (!abSinks.length){
    const outs = abRaw.filter(d => d.kind === 'audiooutput').length;
    abStatus = outs
      ? ('Chrome returned ' + outs + ' output slot(s) but no usable device — it has not granted ' +
         'output access to this page. See the list below.')
      : 'No audio outputs visible to the page at all. See the list below.';
  } else {
    const guess = abSinks.find(d => /wireless controller|dualsense|ds5/i.test(d.label));
    if (!abSinkId || !abSinks.some(d => d.id === abSinkId)) abSinkId = (guess || abSinks[0]).id;
    abStatus = abSinks.length + ' output' + (abSinks.length === 1 ? '' : 's') + ' found' +
               (guess ? ' — the dongle looks preselected.' : '. Pick the dongle.');
  }
  render();
}

async function abStart(){
  const sink = abSinkId;
  const say = t => { abStatus = t; render(); };
  if (!sink){ say('Pick an output device first.'); return; }
  try {
    // video:true is required to be offered the system-audio option at all; the
    // video track is stopped immediately afterwards so nothing is encoded.
    abStream = await navigator.mediaDevices.getDisplayMedia({ video: true, audio: true });
  } catch(e){
    say('Capture cancelled or refused.');
    return;
  }
  const atracks = abStream.getAudioTracks();
  if (!atracks.length){
    abStream.getTracks().forEach(t => t.stop()); abStream = null;
    say('No audio in that capture — share the ENTIRE screen and tick "Share system audio".');
    return;
  }
  abStream.getVideoTracks().forEach(t => t.stop());   // audio only from here
  try {
    abCtx = new AudioContext({ sinkId: sink, latencyHint: 'interactive' });
  } catch(e){
    // Older Chrome: construct then set. If neither works the browser cannot
    // choose an output and the whole idea is off the table on this machine.
    try { abCtx = new AudioContext({ latencyHint: 'interactive' }); await abCtx.setSinkId(sink); }
    catch(e2){ abStop(); say('This browser cannot select an audio output (needs Chrome 110+).'); return; }
  }
  abSource = abCtx.createMediaStreamSource(abStream);
  abSource.connect(abCtx.destination);
  atracks[0].addEventListener('ended', () => abStop());   // user hit "Stop sharing"
  say('Bridging — leave this tab open.');
}

function abStop(){
  try { if (abSource) abSource.disconnect(); } catch(e){}
  try { if (abStream) abStream.getTracks().forEach(t => t.stop()); } catch(e){}
  try { if (abCtx) abCtx.close(); } catch(e){}
  abSource = null; abStream = null; abCtx = null;
  render();
}

// The dongle's OWN view of what arrived. A level here is the only proof that
// audio is reaching the device rather than merely leaving the browser.
async function abPoll(){
  const el = document.getElementById('abSignal'); if (!el) return;
  if (!abCtx){ el.textContent = ''; return; }
  if (!device || !device.opened || saving || slotsBusy){ return; }
  try {
    const c01 = await readField(0x37, 'u16');
    const ch  = await readField(0x21, 'u8').catch(() => null);   // g_diag_actual_ch
    el.textContent = 'Dongle is receiving: ch0/1 peak ' + c01 +
                     (ch !== null ? ('   channels ' + ch) : '') +
                     (c01 > 0 ? '' : '   — no signal yet; is something playing?');
  } catch(e){}
}

// ===================== Macros =============================================
// Rows are edited here and written to a DEVICE-GLOBAL table (fw cmds 0x17 read,
// 0x18 write-to-RAM, 0x19 commit). Only the enable bitmap lives in Config_body,
// so a slot selects WHICH of the shared macros are live.
//
// PORTAL HARD RULE observed throughout: no quoted data is interpolated into an
// event attribute. Every generated handler takes numeric arguments only.

const MACRO_COUNT = 32;
const MACRO_KEYS = 4;
const MACRO_MOTION_MAX = 8;      // strokes stored per gesture (src/macro.h)            // keys per combo INCLUDING modifiers (src/macro.h)
const MACRO_REC_LEN = 35;        // 19-byte entry + 16-byte label
// Motion template offsets INSIDE the 17-byte entry: motion[2], motion_len,
// motion_step (LE u16). Mirrors MacroEntry in src/macro.h; the firmware
// migrates shorter records, so a device written by a pre-motion build still
// loads - but a record written SHORT here would silently truncate the tail.
const MACRO_OFF_MOTION = 12, MACRO_OFF_MOTION_LEN = 14, MACRO_OFF_MOTION_STEP = 15;
// Appended in v1.25: out_btn selects the OUTPUT kind (0 = keyboard, else a
// controller button using the two-stage trigger's numbering), stick_thresh is
// the deflection a stick direction needs. Entry offsets 17 and 18.
const MACRO_OFF_OUT_BTN = 17, MACRO_OFF_STICK_THRESH = 18;
const MACRO_FLAG_LONG_PRESS = 0x01, MACRO_FLAG_HOLD = 0x02, MACRO_FLAG_REPLACE = 0x04;
// Bit 3, mirroring MACRO_FLAG_STICK_ALWAYS in src/macro.h. Stick rows only.
const MACRO_FLAG_STICK_ALWAYS = 0x08;
// Bit 4, mirroring MACRO_FLAG_DOUBLE in src/macro.h.
const MACRO_FLAG_DOUBLE = 0x10;
const GEST_STICK = 0x20, GEST_STICK_RIGHT = 0x40;
// Index IS the T2Button value, so order and position are load-bearing.
// L2/R2 carry analog travel when a trigger drives them - see macro_analog_out().
// A recorded controller button arrives as a LOGICAL bit (the BTN table); out_btn
// stores a T2Button value. Map by NAME so the two lists can be read against each
// other, rather than by an offset that looks right and is not - which is exactly
// how the inject mask went wrong once already.
const OUT_BTN_FROM_NAME = { CROSS:1, CIRCLE:2, SQUARE:3, TRIANGLE:4,
                            L1:5, R1:6, L3:7, R3:8, L2:9, R2:10 };
function outBtnFromMask(mask){
  for (const b of BTN){ if ((mask & b[1]) && OUT_BTN_FROM_NAME[b[0]]) return OUT_BTN_FROM_NAME[b[0]]; }
  return 0;
}

const MACRO_OUT_BTNS = ['Keyboard','Cross','Circle','Square','Triangle','L1','R1','L3','R3','L2','R2',
                        'Left click','Right click','Middle click','Scroll up','Scroll down',
                        // 16+ : controller buttons appended after the mouse block, matching
                        // the T2BTN_* enum in src/config.h. They start at 16 rather than
                        // continuing from 11 because 11-15 are already the mouse outputs in
                        // every saved macro.
                        'Create','Options','Touchpad click',
                        'D-pad Up','D-pad Down','D-pad Left','D-pad Right'];
// Index 11+ are MOUSE actions, matching MOUT_* in src/macro.h. The split is by
// value range so the firmware's controller loop never sees them.
const MOUT_FIRST = 11, MOUT_LAST = 15;
function macroIsMouseOut(v){ return (v|0) >= MOUT_FIRST && (v|0) <= MOUT_LAST; }
const STICK_DIRS = ['\u2191','\u2192','\u2193','\u2190'];   // up, right, down, left
const GEST_MOTION = 0x10;
const MACRO_NONE_ENABLED = 0xFFFFFFFF;

// Transcription of src/input_buttons.h. Bit values are persisted inside every
// stored chord, so this list is APPEND ONLY and must match the header exactly.
// tools/macro-tests covers the firmware side; portal-macro-test.js cross-checks
// these two tables against each other.
const BTN = [
  ['DPAD_UP',    1<<0,  'D-pad Up'],
  ['DPAD_DOWN',  1<<1,  'D-pad Down'],
  ['DPAD_LEFT',  1<<2,  'D-pad Left'],
  ['DPAD_RIGHT', 1<<3,  'D-pad Right'],
  ['SQUARE',     1<<4,  'Square'],
  ['CROSS',      1<<5,  'Cross'],
  ['CIRCLE',     1<<6,  'Circle'],
  ['TRIANGLE',   1<<7,  'Triangle'],
  ['L1',         1<<8,  'L1'],
  ['R1',         1<<9,  'R1'],
  ['L2',         1<<10, 'L2 (click)'],
  ['R2',         1<<11, 'R2 (click)'],
  ['CREATE',     1<<12, 'Create'],
  ['OPTIONS',    1<<13, 'Options'],
  ['L3',         1<<14, 'L3'],
  ['R3',         1<<15, 'R3'],
  ['PS',         1<<16, 'PS'],
  ['TOUCHPAD',   1<<17, 'Touchpad click'],
  ['MUTE',       1<<18, 'Mute'],
  // DualSense Edge only. Sony's app owns Fn + a FACE button for its on-board
  // profile switching, so Fn + D-pad is the combination worth building on.
  ['LEFT_FN',   1<<19, 'Fn (left)'],
  ['RIGHT_FN',  1<<20, 'Fn (right)'],
  ['LEFT_PAD',  1<<21, 'Left paddle'],
  ['RIGHT_PAD', 1<<22, 'Right paddle'],
  // Touchpad click qualified by half. TOUCHPAD is still set on every click, so
  // an older chord keeps matching either side; a chord naming a half only
  // matches that half and wins over the generic one (longest chord wins).
  ['PAD_CLICK_LEFT',  1<<23, 'Touchpad click (left)'],
  ['PAD_CLICK_RIGHT', 1<<24, 'Touchpad click (right)'],
];
// Hat value -> direction bits. THE D-PAD IS AN ENUM, NOT A BITMASK: "Up" is hat
// value 0, indistinguishable from "no button", and the idle value 8 would read
// as a phantom press. Mirrors HAT_TO_DPAD in input_buttons.h.
const HAT_TO_DPAD = [1, 1|8, 8, 8|2, 2, 2|4, 4, 4|1, 0];

function macroButtonMask(d){
  if (!d || d.byteLength < 10) return 0;
  const b0 = d.getUint8(7), b1 = d.getUint8(8), b2 = d.getUint8(9);
  let hat = b0 & 0x0F; if (hat > 8) hat = 8;
  let m = HAT_TO_DPAD[hat];
  if (b0 & 0x10) m |= 1<<4;
  if (b0 & 0x20) m |= 1<<5;
  if (b0 & 0x40) m |= 1<<6;
  if (b0 & 0x80) m |= 1<<7;
  for (let i=0;i<8;i++) if (b1 & (1<<i)) m |= 1<<(8+i);
  if (b2 & 0x01) m |= 1<<16;
  if (b2 & 0x02) m |= 1<<17;
  if (b2 & 0x04) m |= 1<<18;
  // Edge-only bits 4-7 of byte 9. button_mask() in src/input_buttons.h decodes
  // these and the BTN table lists them, but this decoder stopped at bit 18 - so
  // the firmware could MATCH an Fn/paddle chord that recording could never
  // CAPTURE. A standard DualSense leaves them clear, so decoding is
  // unconditional here exactly as it is in the header.
  if (b2 & 0x10) m |= 1<<19;   // Fn (left)
  if (b2 & 0x20) m |= 1<<20;   // Fn (right)
  if (b2 & 0x40) m |= 1<<21;   // Left paddle
  if (b2 & 0x80) m |= 1<<22;   // Right paddle
  // The touchpad-click HALF is NOT decided here. The firmware takes it from
  // where the finger LANDED (see macro.cpp), because the position while the
  // pad is being pressed is unreliable - the contact patch spreads and its
  // centre moves. Deriving it here from the current report would let recording
  // capture the opposite half from the one the firmware matches, so the macro
  // would never fire. macroPadHalf() below supplies it from the touch-down
  // position the recorder already tracks.
  return m >>> 0;
}
// Which half a click belongs to, from where the finger LANDED - the same rule
// and the same neutral band as pad_half_from_touch() in src/macro.cpp. Keep the
// two in step: if they disagree, a recorded chord will not match at play time.
function macroPadHalf(x0){
  if (x0 === undefined || x0 === null) return 0;
  const HALF = Math.floor(TOUCH_X_MAX / 2), BAND = Math.floor(TOUCH_X_MAX / 12);
  if (x0 > HALF + BAND) return 1<<24;
  if (x0 < HALF - BAND) return 1<<23;
  return 0;                      // centre band: unqualified, as the firmware does
}

function macroChordName(mask){
  if (!mask) return '';
  return BTN.filter(b => (mask & b[1])).map(b => b[2]).join(' + ');
}

// Gesture byte: bits 0-1 direction, bit2 zone, bit3 fingers, bit7 valid.
const GEST_VALID = 0x80, GEST_ZONE_RIGHT = 0x04, GEST_TWO_FINGER = 0x08;
const GEST_DIRS = ['Swipe up','Swipe down','Swipe left','Swipe right'];
function macroGestureName(g){
  if (!g || !(g & GEST_VALID)) return '';
  let t = GEST_DIRS[g & 0x03];
  t += (g & GEST_ZONE_RIGHT) ? ' (right half)' : ' (left half)';
  if (g & GEST_TWO_FINGER) t += ', two fingers';
  return t;
}

// ---- Motion gestures: PORTAL-SIDE PROTOTYPE ONLY -------------------------
// The firmware knows two trigger kinds, chord and touchpad swipe. It has NO
// motion template and NO matcher, so nothing here is written to the device and
// nothing here can fire a key. This is an INSTRUMENT: it answers "are these
// gestures repeatable, and how often does normal play trip them?" before any
// firmware is spent on the question.
//
// Templates therefore live in a store PARALLEL to _macroRows, never inside a
// row. The row object is serialised into the 28-byte device record and into the
// export JSON; a stray field there is how prototype data reaches flash.
window._macroMotion = window._macroMotion || [];   // index-parallel, null = none
window._macroTest   = null;                        // live match test state

// Gyro offsets in the report the portal receives. Byte 17 is the HORIZONTAL
// turn, NOT byte 19 - the DualSense field names say otherwise and main.cpp
// carries the hardware-verified correction from v1.0.6. Reading 19 as yaw gives
// a recogniser that responds to the wrong axis and looks merely "unreliable".
const MOT_OFF_PITCH = 15, MOT_OFF_YAW = 17;
// Emit one direction code per this much accumulated rotation. Raw gyro counts,
// NOT a physical unit - the right value is whatever makes a comfortable wrist
// motion produce 2-4 codes, and that is a hardware question. Tunable in the UI
// with a live magnitude readout rather than guessed here.
const MOT_STEP_DEFAULT = 1800;
const MOT_MAX_CODES = 8;           // a real gesture is 2-4; hitting this is a fault signal
const MOT_MAX_SAMPLES = 4000;      // 2000 sample pairs - many seconds of gate window
const MOT_NOISE = 24;              // per-sample deadzone, raw counts (see motFeed)
const MOT_DIRS = ['→','↑','←','↓'];

function motRead16(d, off){
  const v = d.getUint8(off) | (d.getUint8(off+1) << 8);
  return v & 0x8000 ? v - 0x10000 : v;
}
// FOUR directions, not eight. Eight put the boundaries 22.5 degrees apart, and a
// hand cannot hold an axis that well: a single up-flick quantised as
// up/up-left/up/up-left/up, dithering across the boundary, and since only
// CONSECUTIVE duplicates collapse, none of it collapsed. Real capture that
// killed the 8-way version: 12 codes for one gesture.
function motDir(dx, dy){
  const adx = dx < 0 ? -dx : dx, ady = dy < 0 ? -dy : dy;
  if (adx >= ady) return dx > 0 ? 0 : 2;
  return dy > 0 ? 1 : 3;
}
function motStep(){
  const v = +(window._motStep || MOT_STEP_DEFAULT);
  return (v >= 200 && v <= 200000) ? v : MOT_STEP_DEFAULT;
}
function motPathName(codes){
  if (!codes || !codes.length) return '';
  return codes.map(c => MOT_DIRS[c] || '?').join(' ');
}
function motNewState(){
  return { raw:[], peak:0, n:0, total:0, codes:[], over:false };
}
// Capture is now RAW. The previous version quantised as samples arrived, which
// meant the auto-calibrated step was computed from a capture it could no longer
// affect - the stored template was always built at the OLD threshold. Buffering
// the window and quantising afterwards makes the step a knob that can be turned
// after the fact, and makes the quantiser a pure function the harness can drive.
function motFeed(ms, d){
  if (!d || d.byteLength < MOT_OFF_YAW + 2) return;
  const gx = -motRead16(d, MOT_OFF_YAW);
  const gy = -motRead16(d, MOT_OFF_PITCH);
  const mag = (gx < 0 ? -gx : gx) + (gy < 0 ? -gy : gy);
  if (mag > ms.peak) ms.peak = mag;
  ms.n++;
  // Noise floor, same idea as apply_gyro_stick's deadzone. Without it a small
  // resting BIAS sums to the threshold over a long gate hold and emits a code
  // from a controller that never moved.
  if (mag < MOT_NOISE) return;
  ms.total += mag;
  if (ms.raw.length < MOT_MAX_SAMPLES) ms.raw.push(gx, gy);
}
// How much harder it is to TURN than to continue. Without this a 45-degree
// diagonal alternates forever between the two axes it sits between: the real
// capture that killed the previous version was up-left read as
// "up left up left up left down left". Projecting onto the current stroke and
// requiring the PERPENDICULAR component to win by this factor means a diagonal
// resolves to whichever axis led, and stays there.
const MOT_TURN = 2;
// A reversal is UNAMBIGUOUS in a way a perpendicular turn is not: sideways
// drift happens constantly during a stroke, but nobody reverses by accident.
// Holding both to 2x cost real captures both ways - a weak return stroke was
// swallowed entirely (down-up read as just "down"), and on another attempt
// lateral drift crossed 2x before the reversal did, injecting a phantom "right"
// into the middle of a down-up. Reversals commit sooner, so they win that race.
const MOT_REVERSE = 1;
// Pure quantiser: raw sample pairs -> direction codes.
function motQuantise(raw, step){
  const out = { codes:[], over:false };
  if (!raw || raw.length < 2 || !(step > 0)) return out;
  let cx = 0, cy = 0, cur = -1;
  for (let i = 0; i + 1 < raw.length; i += 2){
    cx += raw[i]; cy += raw[i+1];
    if (cur < 0){
      if ((cx < 0 ? -cx : cx) + (cy < 0 ? -cy : cy) < step) continue;
      cur = motDir(cx, cy); cx = 0; cy = 0;
      out.codes.push(cur);
      continue;
    }
    // cur is axis-aligned, so parallel/perpendicular are just the two axes.
    // fwd is signed ALONG the stroke: a reversal shows up as a large negative
    // fwd with perp near zero, so it needs its own test - checking only |par|
    // treats a reversal as the stroke continuing and swallows it entirely.
    const horiz = (cur === 0 || cur === 2);
    const fwd  = (cur === 0) ? cx : (cur === 2) ? -cx : (cur === 1) ? cy : -cy;
    const perp = horiz ? cy : cx;
    const aperp = perp < 0 ? -perp : perp;
    if (fwd >= step){ cx = 0; cy = 0; continue; }        // stroke continues
    let next = -1;
    if (fwd <= -step * MOT_REVERSE) next = (cur + 2) & 3;   // committed reversal
    else if (aperp >= step * MOT_TURN) next = horiz ? (perp > 0 ? 1 : 3) : (perp > 0 ? 0 : 2);
    if (next < 0) continue;                              // not committed yet
    cur = next;
    cx = 0; cy = 0;
    if (out.codes.length < MOT_MAX_CODES) out.codes.push(cur);
    else { out.over = true; break; }
  }
  return out;
}
// A gesture should land at 2-4 codes. Suggest the step that would have produced
// three from THIS capture, so the threshold is calibrated from the user's own
// motion instead of a constant I picked without hardware.
function motSuggestStep(ms){
  if (!ms || !ms.total) return MOT_STEP_DEFAULT;
  return Math.max(200, Math.round(ms.total / 3 / 100) * 100);
}
// Re-quantise every stored template at the current step. Called when the step
// changes so the displayed paths are always what the matcher would actually see.
function motReQuantiseAll(){
  const mot = window._macroMotion || [];
  for (let i=0;i<MACRO_COUNT;i++){
    if (!mot[i] || !mot[i].raw) continue;
    const q = motQuantise(mot[i].raw, motStep());
    mot[i].codes = q.codes; mot[i].over = q.over; mot[i].step = motStep();
  }
}
// The template must match the START of the capture, not the whole of it.
// The gate window ends when the button is RELEASED, so any motion between
// finishing the gesture and letting go becomes codes: holding L2 a beat longer
// turned a clean down-up into "down up down up right down". The gesture is
// performed at the start of the window by construction - that is what the gate
// is for - so trailing motion is settling and is ignored.
//
// One spurious code may be dropped from inside the matched prefix - but ONLY
// for templates of two strokes or more. The tolerance exists for mid-path drift
// during a reversal (down-up captured as "down right up"), where one slack code
// out of three is modest. Applied to a SINGLE-stroke template it means "any
// capture whose first two codes include this one", so a left-flick that drifted
// down matched both the left template and the down template. Four single-stroke
// templates on one gate produced 7 ambiguous matches out of 33 for exactly this
// reason. The slack has to be proportional to the template, not a flat one.
function motMatch(codes, tpl){
  if (!tpl || !tpl.length || !codes || !codes.length) return false;
  const eq = (a,b) => a.length === b.length && a.every((v,i) => v === b[i]);
  const slack = tpl.length >= 2 ? 1 : 0;
  for (let k = tpl.length; k <= tpl.length + slack; k++){
    if (codes.length < k) continue;
    const head = codes.slice(0, k);
    if (eq(head, tpl)) return true;
    if (k === tpl.length) continue;
    for (let i=0;i<head.length;i++){
      if (eq(head.slice(0,i).concat(head.slice(i+1)), tpl)) return true;
    }
  }
  return false;
}
// Returns the matching row, or -1. Prefers the LONGEST template that matches:
// with prefix matching a short template shadows every longer one that starts
// the same way, so "down up" would always win over "down up right". Ambiguity
// is reported only between templates of EQUAL length, where there is no
// principled way to choose - the test panel shows it rather than hiding it.
function motFind(codes, gateMask){
  const mot = window._macroMotion || [];
  let hit = -1, best = -1, n = 0;
  for (let i=0;i<MACRO_COUNT;i++){
    const t = mot[i];
    if (!t || !t.codes || !t.codes.length) continue;
    if ((gateMask & t.gate) !== t.gate) continue;   // gate must have been held
    if (!motMatch(codes, t.codes)) continue;
    if (t.codes.length > best){ best = t.codes.length; hit = i; n = 1; }
    else if (t.codes.length === best) n++;
  }
  window._motAmbig = (n > 1);
  return hit;
}

// event.code -> HID usage. Modifiers are usages 0xE0-0xE7 so they sit in keys[]
// like anything else; the firmware folds that range into the modifier byte.
const KEYMAP = (() => {
  const m = {ControlLeft:0xE0, ShiftLeft:0xE1, AltLeft:0xE2, MetaLeft:0xE3,
             ControlRight:0xE4, ShiftRight:0xE5, AltRight:0xE6, MetaRight:0xE7,
             Enter:0x28, Escape:0x29, Backspace:0x2A, Tab:0x2B, Space:0x2C,
             Minus:0x2D, Equal:0x2E, BracketLeft:0x2F, BracketRight:0x30,
             Backslash:0x31, Semicolon:0x33, Quote:0x34, Backquote:0x35,
             Comma:0x36, Period:0x37, Slash:0x38, CapsLock:0x39,
             PrintScreen:0x46, ScrollLock:0x47, Pause:0x48, Insert:0x49,
             Home:0x4A, PageUp:0x4B, Delete:0x4C, End:0x4D, PageDown:0x4E,
             ArrowRight:0x4F, ArrowLeft:0x50, ArrowDown:0x51, ArrowUp:0x52};
  for (let i=0;i<26;i++) m['Key'+String.fromCharCode(65+i)] = 0x04+i;
  m['Digit1']=0x1E; m['Digit2']=0x1F; m['Digit3']=0x20; m['Digit4']=0x21; m['Digit5']=0x22;
  m['Digit6']=0x23; m['Digit7']=0x24; m['Digit8']=0x25; m['Digit9']=0x26; m['Digit0']=0x27;
  for (let i=1;i<=12;i++) m['F'+i] = 0x39+i;
  return m;
})();
const USAGE_NAME = (() => {
  const r = {}; for (const k in KEYMAP) r[KEYMAP[k]] = k;
  const pretty = {0xE0:'Ctrl',0xE1:'Shift',0xE2:'Alt',0xE3:'Win',
                  0xE4:'RCtrl',0xE5:'RShift',0xE6:'RAlt',0xE7:'RWin'};
  for (const u in pretty) r[u] = pretty[u];
  for (let i=0;i<26;i++) r[0x04+i] = String.fromCharCode(65+i);
  return r;
})();
function macroComboName(keys, rel){
  const used = keys.filter(k => k);
  if (!used.length) return '';
  return used.map(k => USAGE_NAME[k] || ('0x'+k.toString(16))).join(' + ');
}

// ---- manual key picker ----------------------------------------------------
// Required, not a convenience: Windows takes the Win key and Alt+Tab before the
// page ever sees them, and the browser keeps Ctrl+W / Ctrl+T / F11. Those combos
// are UNREACHABLE by recording - including Win+G and Win+Tab, which the firmware
// already ships hardcoded as the PS shortcut. The picker writes the same keys[]
// and rel_order the recorder produces, so playback is identical either way.
const MOD_PICK = [[0xE0,'Ctrl'], [0xE1,'Shift'], [0xE2,'Alt'], [0xE3,'Win']];

// Non-modifier usages, in a browsable order rather than usage-code order.
function macroKeyOptions(){
  const out = [];
  for (let i=0;i<26;i++) out.push([0x04+i, String.fromCharCode(65+i)]);
  const digits = [[0x1E,'1'],[0x1F,'2'],[0x20,'3'],[0x21,'4'],[0x22,'5'],
                  [0x23,'6'],[0x24,'7'],[0x25,'8'],[0x26,'9'],[0x27,'0']];
  for (const d of digits) out.push(d);
  for (let i=1;i<=12;i++) out.push([0x39+i, 'F'+i]);
  const named = [[0x28,'Enter'],[0x29,'Escape'],[0x2A,'Backspace'],[0x2B,'Tab'],
                 [0x2C,'Space'],[0x2D,'Minus'],[0x2E,'Equal'],[0x2F,'['],[0x30,']'],
                 [0x31,'Backslash'],[0x33,'Semicolon'],[0x34,'Quote'],[0x35,'Backquote'],
                 [0x36,'Comma'],[0x37,'Period'],[0x38,'Slash'],[0x39,'CapsLock'],
                 [0x46,'PrintScreen'],[0x47,'ScrollLock'],[0x48,'Pause'],[0x49,'Insert'],
                 [0x4A,'Home'],[0x4B,'PageUp'],[0x4C,'Delete'],[0x4D,'End'],[0x4E,'PageDown'],
                 [0x4F,'Right'],[0x50,'Left'],[0x51,'Down'],[0x52,'Up']];
  for (const n of named) out.push(n);
  return out;
}

window._macroPick = window._macroPick || null;   // {row, mods:[usage], key:usage}
window._macroPickIn = window._macroPickIn || null; // {row, mask} manual trigger chord

// The Pick panel for a CONTROLLER output: the same eleven choices the dropdown
// carried, but reached the same way as the keyboard picker so a row asks its
// question once.
// Controller outputs are NOT one contiguous range any more: 1-10 are the
// originals, 11-15 are the mouse block, and 16+ are the buttons appended after
// it. Pass an explicit list rather than a lo/hi span, or the new ones are
// unreachable and the mouse actions appear in the controller picker.
function macroOutBtnValues(){
  const v = [];
  for (let k = 1; k < MOUT_FIRST; k++) v.push(k);
  for (let k = MOUT_LAST + 1; k < MACRO_OUT_BTNS.length; k++) v.push(k);
  return v;
}
function macroPickBtnHTML(i, m){ return macroPickOutHTML(i, m, macroOutBtnValues(), 'Which controller button should this macro send?'); }
function macroPickOutHTML(i, m, values, prompt){
  let h = '<div style="border:1px solid #06a;background:#001a2a;padding:8px;border-radius:6px;margin:6px 0">';
  h += '<div style="font-size:12px;color:var(--sub);margin-bottom:6px">' + prompt + '</div>';
  for (const k of values){
    const on = (m.out_btn|0) === k;
    h += '<button class="btn' + (on ? '' : ' btn-outline') + '" style="padding:2px 8px;margin:0 4px 4px 0;font-size:12px" ' +
         'onclick="macroSetOutBtn(' + i + ', ' + k + ');macroPickClose()">' + MACRO_OUT_BTNS[k] + '</button>';
  }
  h += '<div style="margin-top:4px"><button class="btn btn-outline" style="padding:2px 10px;font-size:12px" onclick="macroPickClose()">Close</button></div>';
  h += '</div>';
  return h;
}
function macroPickClose(){ window._macroPick = null; macroRender(); }

// ---- manual INPUT chord picker --------------------------------------------
// Recording is still the fast path, but some triggers cannot be recorded
// reliably: the Edge Fn buttons and paddles only report when the controller is
// not already consuming them (see the README), and a chord built on them may be
// easier to tick than to hold. This writes the same chord bits recording would.
function macroPickInOpen(i){
  const rows = window._macroRows || [];
  const m = rows[i]; if (!m) return;
  window._macroPickIn = { row: i, mask: (m.gesture ? 0 : (m.chord >>> 0)) };
  macroRender();
}
function macroPickInClose(){ window._macroPickIn = null; macroRender(); }
function macroPickInToggle(bit, on){
  const p = window._macroPickIn; if (!p) return;
  p.mask = on ? ((p.mask | bit) >>> 0) : ((p.mask & ~bit) >>> 0);
  // One press cannot be both "either half" and "this half", so the generic
  // touchpad click and the two qualified ones are mutually exclusive here.
  const PAD = 1<<17, L = 1<<23, R = 1<<24;
  if (on && (bit === L || bit === R)) p.mask &= ~(PAD | (bit === L ? R : L));
  if (on && bit === PAD)              p.mask &= ~(L | R);
  p.mask = p.mask >>> 0;
  macroRender();
}
function macroPickInApply(){

// ---- state ---------------------------------------------------------------
window._macroRows = window._macroRows || null;   // survives render(), like _cebStages
window._macroRec  = null;                        // {row, which, ...} while recording

function macroBlankRow(){
  return {chord:0, gesture:0, flags:0, hold_cs:0, keys:[0,0,0,0], rel_order:0,
          out_btn:0, stick_thresh:0, label:'', present:false};
}
function macroRowEmpty(m){
  return !m || (!m.chord && !m.gesture && !m.out_btn && !m.keys.some(k=>k));
}
// A row is listed if it holds a definition OR the user just added it with +.
// Device index is fixed (it maps to a bit of the enable mask), so rows keep
// their index and the list is simply the present subset.
function macroPresentCount(){
  const rows = window._macroRows || [];
  let n = 0; for (let i=0;i<MACRO_COUNT;i++) if (rows[i] && rows[i].present) n++;
  return n;

// Mirror of usb_kbd_iface_needed() in src/macro.h. The keyboard interface is
// shared, so a reconnect is needed only when its PRESENCE changes.
function kbdIfaceNeeded(c){
  if (!c) return false;

  // mouse brings the keyboard up with it (the descriptor is trimmed from the end,
  // so the mouse cannot be present without it).

function macroBit(i){ return ((+config.macro_disable>>>0) & (1<<i)) === 0; }
function macroSetBit(i, on){

// ---- transport -----------------------------------------------------------
// Which rows are non-empty, in ONE round trip (fw cmd 0x17 with idx 0xFF).
// Sweeping all 32 to discover that cost ~2s of HID traffic and, because every
// transaction shares the single reply buffer behind hidLocked(), it queued up
// in front of the profile-name and slot reads too.
async function macroUsedMask(){
  await sendCmd(0x17, [0xFF]);
  const r = await readCmdReplyOn(SLOT_REPORT, 0x17, 0xFF, 12);
  if (!r || r[2] !== 0x00) return null;
  return ((r[4] | (r[5]<<8) | (r[6]<<16) | (r[7]<<24)) >>> 0);
}

async function macroReadAll(){
  const rows = [];
  const used = await macroUsedMask();
  for (let i=0;i<MACRO_COUNT;i++){
    // Skip the read entirely for rows the device says are empty.
    if (used !== null && !(used & (1<<i))){ rows.push(macroBlankRow()); continue; }
    await sendCmd(0x17, [i]);
    const r = await readCmdReplyOn(SLOT_REPORT, 0x17, i, 12);   // rec_len 33 + header
    if (!r || r[2] !== 0x00){ rows.push(macroBlankRow()); continue; }
    const dv = new DataView(r.buffer, r.byteOffset);
    const row = {
      chord: dv.getUint32(4, true),
      gesture: r[8], flags: r[9], hold_cs: r[10],
      keys: [r[11], r[12], r[13], r[14]],
      rel_order: r[15],
      label: ''
    };
    row.out_btn = r[21] || 0;
    row.stick_thresh = r[22] || 0;
    let lbl = ''; for (let k=0;k<16;k++){ const c = r[23+k]; if (!c) break; lbl += String.fromCharCode(c); }
    row.label = lbl;
    // Motion entries round-trip into the parallel store, not the row.
    if (row.gesture & GEST_MOTION){
      const n = r[18] || 0;
      if (n > 0 && n <= 8){
        const codes = [];
        for (let k=0;k<n;k++){
          const b = (k < 4) ? r[16] : r[17];
          codes.push((b >> ((k & 3) * 2)) & 3);
        }
        const mot = window._macroMotion || (window._macroMotion = []);
        mot[i] = {codes, gate: row.chord >>> 0,
                  step: (r[19] | (r[20] << 8)) || MOT_STEP_DEFAULT, raw: null};
      }
    }
    row.present = !macroRowEmpty(row);
    rows.push(row);
  }
  return rows;
}
async function macroWriteAll(){
  const rows = window._macroRows || [];
  for (let i=0;i<MACRO_COUNT;i++){
    const m = rows[i] || macroBlankRow();
    const a = new Array(1+MACRO_REC_LEN).fill(0);
    a[0] = i;
    a[1] = m.chord & 0xff; a[2] = (m.chord>>>8)&0xff; a[3] = (m.chord>>>16)&0xff; a[4] = (m.chord>>>24)&0xff;
    a[5] = m.gesture & 0xff; a[6] = m.flags & 0xff; a[7] = m.hold_cs & 0xff;
    a[8] = m.keys[0]|0; a[9] = m.keys[1]|0; a[10] = m.keys[2]|0; a[11] = m.keys[3]|0;
    a[12] = m.rel_order & 0xff;
    // Motion template. Held in _macroMotion, NOT in the row: the row is what the
    // export JSON carries, and a motion path there would travel to builds that
    // cannot read it. A row with a template is written as a MOTION entry - its
    // chord becomes the gate and its swipe gesture is replaced.
    const mt = (window._macroMotion || [])[i];
    if (mt && mt.codes && mt.codes.length){
      let b0 = 0, b1 = 0;
      for (let k=0;k<mt.codes.length && k<8;k++){
        const sh = (k & 3) * 2, v = (mt.codes[k] & 3) << sh;
        if (k < 4) b0 |= v; else b1 |= v;
      }

      a[1]  = mt.gate & 0xff; a[2] = (mt.gate>>>8)&0xff;
      a[3]  = (mt.gate>>>16)&0xff; a[4] = (mt.gate>>>24)&0xff;
      a[13] = b0; a[14] = b1;
      a[15] = Math.min(mt.codes.length, 8);

      a[16] = st & 0xff; a[17] = (st >>> 8) & 0xff;

    a[19] = m.stick_thresh & 0xff;

    await sendCmd(0x18, a);
    await new Promise(r => setTimeout(r, 8));

// Serialise the macro table for a file. Definitions are DEVICE-GLOBAL, so they

// which Playnite fires unattended on every game launch and which would otherwise
// silently replace the whole table with whatever was captured at export time.
function macroTableToJson(rows){
  const out = [];

    if (!m || macroRowEmpty(m)) return;
    // motion_* MUST travel with the entry. Dropping it does not merely lose the
    // gesture: macro_is_motion() needs GEST_MOTION and motion_len > 0, so a
    // stripped motion macro reloads as an ordinary CHORD macro and its gate
    // button fires it on its own, with no gesture drawn.
    out.push({ index: i, label: m.label || '', chord: m.chord >>> 0, gesture: m.gesture|0,
               flags: m.flags|0, hold_cs: m.hold_cs|0, keys: (m.keys||[0,0,0,0]).slice(0,4),
               rel_order: m.rel_order|0,
               motion: (m.motion||[0,0]).slice(0,2).map(x=>x|0),
               motion_len: m.motion_len|0, motion_step: m.motion_step|0,

               // controller-button remap into a keyboard row with no keys -

function macroTableFromJson(list){

    const i = e.index|0; if (i < 0 || i >= MACRO_COUNT) continue;
    // Files written before 1.20.0 carry no motion_*; they default to zero, which
    // is exactly "not a motion macro" and is the correct reading of them.
    const ml = Math.min(e.motion_len|0, MACRO_MOTION_MAX);
    rows[i] = { chord: (e.chord|0)>>>0, gesture: e.gesture|0, flags: e.flags|0,
                hold_cs: e.hold_cs|0, keys: (e.keys||[0,0,0,0]).slice(0,4).map(k=>k|0),
                rel_order: e.rel_order|0, label: String(e.label||'').slice(0,15),
                motion: (e.motion||[0,0]).slice(0,2).map(x=>x|0),

// Which macros a just-applied mask switches on, described with the definitions
// THIS dongle holds. The mask and the definitions travel separately, so an

// What a row actually sends, whatever kind of output it has.
function macroOutputName(m){
  if (!m) return '';

    return STICK_DIRS.map((d,k) => d + ' ' + (USAGE_NAME[m.keys[k]] || '—')).join(' ');
  }
  const ob = m.out_btn|0;
  if (ob) return MACRO_OUT_BTNS[ob] || ('output ' + ob);

function macroEnabledSummary(mask){
  const rows = window._macroRows || [];

  for (let i=0;i<MACRO_COUNT;i++){
    if (((mask>>>0) & (1<<i)) !== 0) continue;   // stored inverted: clear bit = enabled

    // a controller or mouse remap leaves it empty, so this used to print "?" for

    // button or click for you.

function macroNoticeAfterMaskApplied(){

async function macroSuspendFiring(on){

let _macroBusy = false;
async function refreshMacros(){
  const box = document.getElementById('macrobox');
  if (!device){ if (box) box.textContent = 'Connect a device to load macros.'; return; }
  // Gate on saving/slotsBusy BEFORE taking the HID lock, exactly as the 1 Hz
  // diagnostic poll does. hidLocked() alone is not enough: the main config read
  // path (reloadFromDevice -> readAll -> readField) does NOT go through the lock,
  // it is protected by the `saving` flag instead. So a macro sweep started from
  // render() ran concurrently with the post-activate config read, and two
  // in-flight WebHID feature transactions on one device make readField retry and
  // then throw - which surfaced as "values cannot be read" and, when it hit the
  // 0x7d/0x7e/0x7f reads, as "FW: pre-1.0.5 (no version fields)".
  if (saving || slotsBusy) return;
  if (_macroBusy) return;            // render() fires often; one sweep at a time
  _macroBusy = true;
  if (box) box.textContent = 'Reading macros…';
  try {
    window._macroRows = await hidLocked(() => macroReadAll());
  } catch(e){
    if (box) box.textContent = 'Could not read macros: ' + e;
    return;
  } finally {
    _macroBusy = false;
  }
  macroRender();
}

// ---- recording -----------------------------------------------------------
// Input capture reads the gamepad's own input reports. The portal opens the
// device but never subscribed to them before, so this is the first use of the
// full-rate stream - no firmware round-trip and no polling granularity.
// Motion recording (which === 2). Hold the gate button, move, release: the gate
// removes start/end detection entirely, which is the whole reason it exists.
// Kept as its own branch so the chord/swipe recorder above is untouched.
function macroMotionRecReport(st, d){
  const mask = macroButtonMask(d);
  if (mask && !st.gate){                 // first buttons down define the gate
    st.gate = mask >>> 0;
    st.mot  = motNewState();
  }
  if (st.gate && mask){ motFeed(st.mot, d); st.held = true; return; }
  if (st.held && !mask) st.done = true;  // gate released - path is complete
}

function macroOnInputReport(ev){
  const st = window._macroRec;
  if (st && st.which === 2){ macroMotionRecReport(st, ev.data); macroRecStatus(); return; }
  // which 3 records a controller button as the OUTPUT. It needs the same button
  // decode as which 0 but none of the touchpad or long-press machinery below -
  // there is no swipe or hold to capture, just which button was pressed.
  if (st && st.which === 3){
    const b = macroButtonMask(ev.data);
    if (macroPop(b) > macroPop(st.peak)) { st.peak = b; st.peakAt = performance.now(); }
    macroRecStatus();
    return;
  }
  if (!st || st.which !== 0) return;
  const m = macroButtonMask(ev.data);
  if (m && !st.firstDown) st.firstDown = performance.now();
  // PEAK simultaneous set, not the union over the window: pressing R3 then Up
  // then brushing Square would otherwise capture all three.
  if (macroPop(m) > macroPop(st.peak)) { st.peak = m; st.peakAt = performance.now(); }
  if (!m && st.firstDown && !st.upAt) st.upAt = performance.now();

  // Touchpad. Same shape as touch_task() in macro.cpp: record on touch-down,
  // keep the last coordinates seen WHILE DOWN, classify on lift.
  const f1 = macroTouchPoint(ev.data, 0), f2 = macroTouchPoint(ev.data, 1);
  if (!f1) return;
  const now = performance.now();
  if (f1.down && !st.tDown){
    st.tDown = true; st.tStart = now; st.tEnd = 0;
    st.tX0 = f1.x; st.tY0 = f1.y; st.tLastX = f1.x; st.tLastY = f1.y;
    st.tTwo = !!(f2 && f2.down);
  } else if (f1.down){
    st.tLastX = f1.x; st.tLastY = f1.y;
    if (f2 && f2.down) st.tTwo = true;
  } else if (st.tDown){
    st.tDown = false; st.tEnd = now;
    const g = macroClassifySwipe(st);
    if (g) st.gesture = g;
  }
  macroRecStatus();
}
function macroPop(v){ let n=0; v=v>>>0; while(v){ n += v&1; v >>>= 1; } return n; }

// Mirror of touch_point() in src/input_buttons.h. bit7 SET means the finger is
// LIFTED, and X/Y stop updating once it is - so the lift report carries stale
// coordinates and a swipe must be classified from the last sample taken while
// the finger was still down. macro.cpp does the same.
function macroTouchPoint(d, which){
  const off = which ? 36 : 32;
  if (!d || d.byteLength < off + 4) return null;
  const b0 = d.getUint8(off), b1 = d.getUint8(off+1), b2 = d.getUint8(off+2), b3 = d.getUint8(off+3);
  return { down: (b0 & 0x80) === 0,
           x: b1 | ((b2 & 0x0F) << 8),
           y: (b2 >> 4) | (b3 << 4) };
}
// Thresholds must match macro.cpp: GEST_MIN_MS/GEST_MAX_MS/GEST_MIN_DX/GEST_MIN_DY.
const GEST_MIN_MS = 40, GEST_MAX_MS = 600, GEST_MIN_DX = 300, GEST_MIN_DY = 200;
const TOUCH_X_MAX = 1919;

function macroClassifySwipe(st){
  if (!st.tStart || !st.tEnd) return 0;
  const dt = st.tEnd - st.tStart;
  if (dt < GEST_MIN_MS || dt > GEST_MAX_MS) return 0;
  const dx = st.tLastX - st.tX0, dy = st.tLastY - st.tY0;
  const adx = Math.abs(dx), ady = Math.abs(dy);
  let g = GEST_VALID;
  if (adx >= ady){
    if (adx < GEST_MIN_DX) return 0;
    g |= (dx > 0) ? 3 : 2;        // GEST_DIR_RIGHT : GEST_DIR_LEFT
  } else {
    if (ady < GEST_MIN_DY) return 0;
    g |= (dy > 0) ? 1 : 0;        // GEST_DIR_DOWN : GEST_DIR_UP
  }
  if (st.tX0 > (TOUCH_X_MAX / 2)) g |= GEST_ZONE_RIGHT;
  if (st.tTwo) g |= GEST_TWO_FINGER;
  return g;
}

function macroOnKeyDown(e){
  const st = window._macroRec;
  if (!st || st.which !== 1) return;
  e.preventDefault(); e.stopPropagation();
  const u = KEYMAP[e.code];
  if (!u){ st.unknown = true; return; }
  if (st.press.indexOf(u) < 0 && st.press.length < 4) st.press.push(u);
  if (e.code === 'MetaLeft' || e.code === 'MetaRight') st.sawMeta = true;

  const st = window._macroRec;
  if (!st || st.which !== 1) return;

function macroRecStatus(){
  const st = window._macroRec; if (!st) return;
  const el = document.getElementById('macrorec');
  if (!el) return;
  if (st.which === 2){
    const q = st.mot ? motQuantise(st.mot.raw, motStep()) : null;
    const p = q ? motPathName(q.codes) : '';
    el.textContent = 'Recording motion — ' +
      (!st.gate ? 'hold the gate button, then move the controller'
                : (st.done ? 'captured: ' + (p || '(no movement)') +
                             (st.mot ? '   suggested step ' + motSuggestStep(st.mot) : '') +
                             (q && q.over ? '   TOO NOISY — raise the step' : '')
                           : (macroChordName(st.gate) + '  ' + (p || '…') +

               : (st.peak ? macroChordName(st.peak) : '');
    if (st.which === 4){

      return;

// records instead of opening the menu.
// Clicks on the portal's OWN controls are not the user demonstrating a mouse
// action - they are operating the recorder. Pressing Stop is a LEFT click, and
// mousedown fires before the button's onclick, so without this every recording
// ended up as "Left click" no matter what had been pressed a moment earlier.
function macroRecUiTarget(e){
  const t = e && e.target;

// the result, and "click the thing you want" is the whole interaction.
function macroMouseCaptured(st, v){

}

function macroOnMouseDown(e){
  const st = window._macroRec; if (!st || st.which !== 4) return;
  if (macroRecUiTarget(e)) return;          // operating the recorder, not demonstrating
  e.preventDefault(); e.stopPropagation();
  const map = { 0: MOUT_FIRST, 2: MOUT_FIRST + 1, 1: MOUT_FIRST + 2 }; // L, R, M
  if (map[e.button] !== undefined) macroMouseCaptured(st, map[e.button]);
}
function macroOnMouseWheel(e){
  const st = window._macroRec; if (!st || st.which !== 4) return;
  e.preventDefault(); e.stopPropagation();
  if (e.deltaY === 0) return;
  macroMouseCaptured(st, (e.deltaY < 0) ? (MOUT_FIRST + 3) : (MOUT_FIRST + 4));
}
function macroOnContextMenu(e){
  const st = window._macroRec; if (st && st.which === 4) e.preventDefault();
}

async function macroRecord(row, which){
  if (window._macroRec){ await macroRecordStop(); return; }
  window._macroRec = {row, which, peak:0, mouseOut:0, peakAt:0, firstDown:0, upAt:0,
                      press:[], release:[], sawMeta:false, unknown:false,
                      tDown:false, tStart:0, tEnd:0, tX0:0, tY0:0,
                      tLastX:0, tLastY:0, tTwo:false, gesture:0,
                      gate:0, held:false, done:false, mot:null};
  if (which === 2){
    // No macroSuspendFiring here: motion cannot fire anything, and the gate
    // button might itself be bound to a chord macro. Suspending would mask
    // exactly the interference this prototype exists to measure.
    try { device.addEventListener('inputreport', macroOnInputReport); } catch(e){}
  } else if (which === 0 || which === 3){
    // which 3 records the OUTPUT as a controller button. Same input stream as
    // recording an input, so the same suspend applies: an enabled macro must not
    // fire while the user is pressing the button they want to capture.
    await macroSuspendFiring(true);
    try { device.addEventListener('inputreport', macroOnInputReport); } catch(e){}
  } else if (which === 4){
    window.addEventListener('mousedown', macroOnMouseDown, true);
    window.addEventListener('wheel', macroOnMouseWheel, { capture: true, passive: false });
    window.addEventListener('contextmenu', macroOnContextMenu, true);
  } else {
    window.addEventListener('keydown', macroOnKeyDown, true);
    window.addEventListener('keyup', macroOnKeyUp, true);
  }
  macroRender();
}

async function macroRecordStop(){
  const st = window._macroRec; if (!st) return;
  window._macroRec = null;
  const rows = window._macroRows || [];
  const m = rows[st.row] || (rows[st.row] = macroBlankRow());

  if (st.which === 4){
    window.removeEventListener('mousedown', macroOnMouseDown, true);
    window.removeEventListener('wheel', macroOnMouseWheel, { capture: true });
    window.removeEventListener('contextmenu', macroOnContextMenu, true);
    if (st.mouseOut){
      m.out_btn = st.mouseOut;
      if (macroCanHold(m)) m.flags = (m.flags|0) | MACRO_FLAG_HOLD;
    }
    macroRender();
    const elm = document.getElementById('macrosave');
    if (elm) elm.textContent = st.mouseOut ? ('Output set to ' + MACRO_OUT_BTNS[st.mouseOut] + '.')
                                           : 'No mouse action was captured - try again.';
    return;
  }

  if (st.which === 3){
    // Controller button as the OUTPUT. st.peak is the union of everything held
    // during the capture; take the first mappable button from it so a stray
    // second press does not decide the result.
    try { device.removeEventListener('inputreport', macroOnInputReport); } catch(e){}
    await macroSuspendFiring(false);
    const b = outBtnFromMask(st.peak >>> 0);
    if (b){
      m.out_btn = b;
      if (macroCanHold(m)) m.flags = (m.flags|0) | MACRO_FLAG_HOLD;
    }
    macroRender();
    const el = document.getElementById('macrosave');
    if (el) el.textContent = b ? ('Output set to ' + MACRO_OUT_BTNS[b] + '.')
                               : 'No mappable button was pressed - try again.';
    return;
  }

  if (st.which === 2){
    try { device.removeEventListener('inputreport', macroOnInputReport); } catch(e){}
    const mot = window._macroMotion || (window._macroMotion = []);
    if (st.mot && st.mot.raw.length >= 2){
      // Calibrate FIRST, then quantise. The previous order set the step from a
      // capture it could no longer affect, so the stored template was always
      // built at the stale threshold - the calibration silently did nothing.
      if (!window._motCalibrated){
        window._motStep = motSuggestStep(st.mot);
        window._motCalibrated = true;
      }
      const q = motQuantise(st.mot.raw, motStep());
      mot[st.row] = { codes: q.codes, over: q.over, raw: st.mot.raw.slice(),
                      gate: st.gate >>> 0, step: motStep(),
                      peak: st.mot.peak, samples: st.mot.n, total: st.mot.total };
    }
    macroRender();
    return;
  }
  if (st.which === 0){
    try { device.removeEventListener('inputreport', macroOnInputReport); } catch(e){}
    await macroSuspendFiring(false);
    // A swipe wins only when NOTHING was held - including the touchpad click,
    // which is a button in its own right. The pad bit used to be stripped from
    // the committed chord as well as from this test, so a touchpad click could
    // never be recorded as a trigger: click-with-no-movement produced no
    // gesture and an empty chord, i.e. nothing at all. Keep the bit in the
    // chord; only the swipe-versus-chord decision ignores it.
    // A qualified click sets three bits (TOUCHPAD + the half), which changes
    // nothing here: any of them means something was held, so a swipe still
    // loses to a press, and a plain swipe still sets none of them.
    let held = (st.peak >>> 0);
    // Qualify a recorded touchpad click from the finger-down position, matching
    // the firmware. st.tX0 is the landing point the touch tracking above keeps.
    if (held & (1<<17)) held |= macroPadHalf(st.tX0);
    // Record the HALF alone, not "click + left". The firmware still reports the
    // generic bit on every click, so a chord naming only the half matches (and
    // outranks a generic binding); carrying both bits would just be a chord
    // that reads like two buttons for one press.
    if (held & ((1<<23) | (1<<24))) held &= ~(1<<17);
    if (st.gesture && !held){
      m.gesture = st.gesture & 0xff;
      m.chord = 0;
      m.flags &= ~1;          // a swipe has no release, so it can only pulse
      m.hold_cs = 0;
    } else if (st.peak){
      m.chord = held >>> 0;
      m.gesture = 0;
      // The hold you performed sets the mode: a tap records short, a hold
      // records long with the duration you actually held.
      const heldMs = (st.upAt && st.peakAt) ? (st.upAt - st.peakAt) : 0;
      if (heldMs >= 400){ m.flags |= 1; m.hold_cs = Math.min(255, Math.round(heldMs/10)); }
      else { m.flags &= ~1; m.hold_cs = 0; }
    }
  } else {
    window.removeEventListener('keydown', macroOnKeyDown, true);
    window.removeEventListener('keyup', macroOnKeyUp, true);
    if (st.press.length){
      m.keys = [st.press[0]||0, st.press[1]||0, st.press[2]||0, st.press[3]||0];
      // Release permutation: slot i lifts at position ((rel>>2i)&3). Anything
      // the browser could not observe falls back to reverse press order, which
      // is right for essentially every real combo.
      let rel = 0, ok = true;
      for (let i=0;i<st.press.length;i++){
        const p = st.release.indexOf(st.press[i]);
        if (p < 0 || p > 3){ ok = false; break; }
        rel |= (p << (2*i));
      }
      if (!ok){ rel = 0; for (let i=0;i<st.press.length;i++) rel |= ((st.press.length-1-i) << (2*i)); }
      m.rel_order = rel & 0xff;
    }
    if (st.sawMeta || st.unknown){
      alert('Some keys could not be captured.\n\nWindows takes the Win key and Alt+Tab before the browser sees them, and the browser keeps Ctrl+W / Ctrl+T / F11.\n\nUse the Pick button on this row to set the combo by hand.');
    }
  }
  macroRender();
}

function macroAddRow(){
  const rows = window._macroRows || (window._macroRows = []);
  for (let i=0;i<MACRO_COUNT;i++){
    if (!rows[i]) rows[i] = macroBlankRow();
    if (!rows[i].present){
      rows[i] = macroBlankRow();
      rows[i].present = true;
      macroSetBit(i, true);   // a macro you just added is on by default
      return;                 // macroSetBit re-renders
    }
  }
  alert('All ' + MACRO_COUNT + ' macros are in use.');
}
function macroDeleteRow(i){
  const rows = window._macroRows || [];
  if (!rows[i]) return;
  rows[i] = macroBlankRow();     // present:false - drops out of the list
  macroSetBit(i, false);         // and out of the enable mask; re-renders
}

// A bound chord that CONTAINS another bound chord is unreachable: at the moment
// the shorter one completes the firmware cannot know the longer one is coming,
// so it fires and the held branch never re-evaluates. Warn rather than guess
// with an arm delay, which would tax every short macro's latency.
function macroSubsetWarnings(){
  const rows = window._macroRows || [];
  const out = [];
  for (let i=0;i<MACRO_COUNT;i++){
    const a = rows[i]; if (!a || !a.chord || !macroBit(i)) continue;
    for (let j=0;j<MACRO_COUNT;j++){
      if (i===j) continue;
      const b = rows[j]; if (!b || !b.chord || !macroBit(j)) continue;
      if (a.chord !== b.chord && (b.chord & a.chord) === a.chord){
        out.push('Row ' + (i+1) + ' (' + macroChordName(a.chord) + ') is contained in row ' +
                 (j+1) + ' (' + macroChordName(b.chord) + ') — row ' + (j+1) + ' will never fire.');
      }
    }
  }
  return out;
}

// ---- Motion prototype: live test mode ------------------------------------
// Counts what matters and nothing else: how many gate windows produced a path,
// how many matched, and which template. A "near miss" (a path that matched
// nothing) and a WRONG match are different failures - one is a strictness
// problem, the other a confusability problem, and averaging them hides both.
function macroMotionTestReport(ev){
  const t = window._macroTest; if (!t) return;
  const d = ev.data;
  const mask = macroButtonMask(d);
  if (mask && !t.gate){ t.gate = mask >>> 0; t.mot = motNewState(); }
  if (t.gate && mask){ motFeed(t.mot, d); t.held = true; return; }
  if (!t.held || mask) return;
  t.held = false;
  const codes = t.mot ? motQuantise(t.mot.raw, motStep()).codes : [];
  const gate  = t.gate; t.gate = 0; t.mot = null;
  if (!codes.length) return;            // gate held but no real movement
  t.windows++;
  const idx = motFind(codes, gate);
  const ambig = !!window._motAmbig;
  const rows = window._macroRows || [];
  const name = idx >= 0 ? ((rows[idx] && rows[idx].label) || ('row ' + (idx+1))) : null;
  if (idx >= 0) t.hits++; else t.misses++;
  if (ambig) t.ambig++;
  t.log.unshift((name ? (ambig ? '? ' : '✓ ') + name : '✗ no match') + '  ' + motPathName(codes) +
                (ambig ? '  AMBIGUOUS' : '') + '  [' + macroChordName(gate) + ']');
  if (t.log.length > 12) t.log.length = 12;
  macroRender();
}
function macroMotionTest(){
  if (window._macroTest){
    try { device.removeEventListener('inputreport', macroMotionTestReport); } catch(e){}
    window._macroTest = null;
  } else {
    if (!device) return;
    window._macroTest = {gate:0, mot:null, held:false, windows:0, hits:0, misses:0, ambig:0, log:[]};
    try { device.addEventListener('inputreport', macroMotionTestReport); } catch(e){}
  }
  macroRender();
}
function macroMotionStepSet(v){
  window._motStep = +v || MOT_STEP_DEFAULT;
  window._motCalibrated = true;   // a hand-set value is never overwritten
  motReQuantiseAll();
  macroRender();
}
function macroMotionClear(i){
  const mot = window._macroMotion || []; mot[i] = null; macroRender();
}
// Templates are prototype data and never touch the device, so they get their
// own file rather than riding in the macro export - importing a macro set into
// a build without this prototype must not fail on an unknown key.
function macroMotionExport(){
  const mot = window._macroMotion || [], rows = window._macroRows || [];
  const list = [];
  for (let i=0;i<MACRO_COUNT;i++){
    if (mot[i] && mot[i].codes && mot[i].codes.length){
      list.push({row:i, label:(rows[i] && rows[i].label) || '',
                 codes:mot[i].codes.slice(), gate:mot[i].gate, step:mot[i].step,
                 peak:mot[i].peak, samples:mot[i].samples, raw:mot[i].raw||[]});
    }
  }
  if (!list.length) return;
  const dump = {format:'ds5dongle-motion-prototype', version:1,
                savedAt:new Date().toISOString(), templates:list};
  const blob = new Blob([JSON.stringify(dump, null, 2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'ds5dongle-motion-' + new Date().toISOString().slice(0,19).replace(/[:T]/g,'-') + '.json';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}
function macroMotionImportPick(){
  const inp = document.createElement('input');
  inp.type = 'file'; inp.accept = '.json,application/json';
  inp.onchange = () => {
    if (!inp.files || !inp.files[0]) return;
    const fr = new FileReader();
    fr.onload = () => {
      let dump; try { dump = JSON.parse(fr.result); } catch(e){ return; }
      if (!dump || dump.format !== 'ds5dongle-motion-prototype') return;
      const mot = window._macroMotion || (window._macroMotion = []);
      for (const t of (dump.templates || [])){
        if (t && t.row >= 0 && t.row < MACRO_COUNT && Array.isArray(t.codes)){
          mot[t.row] = {codes:t.codes.slice(), gate:(t.gate>>>0)||0, step:t.step||MOT_STEP_DEFAULT,
                        raw:Array.isArray(t.raw)?t.raw.slice():null, peak:t.peak||0};
        }
      }
      macroRender();
    };
    fr.readAsText(inp.files[0]);
  };
  inp.click();
}

// The prototype block. Deliberately SELF-CONTAINED and below the macro table:
// the table above is hardware-verified and this must not be able to regress it.
// If motion never ships, this block is what gets deleted.
// ===== Live controller test (tier 1 prototype) + macro engine diagnostics =====
// TWO HALVES OF ONE QUESTION, deliberately in one panel.
//
//  - The TESTER is push: the portal opens the same gamepad interface the GAME
//    reads, so an 'inputreport' is the report AFTER the firmware has rewritten
//    it - after macro suppression, injection and stick centring. It therefore
//    shows what the game receives, not what the pad did. No bus traffic: it is
//    a passive listener, unlike the 1 Hz polls, so it cannot collide with
//    readAll on the shared 0x81 buffer.
//  - The DIAGNOSTIC is polled from the firmware and says what the macro engine
//    BELIEVES it is hiding and sending this tick.
//
// Read together they bracket a fault: engine says "hiding L3" while the tester
// still lights L3 = the rewrite never reached the report (the 1.32.8 defect).
// Engine says "hiding nothing" = the rule never fired, which is a row problem.
// That is why these belong side by side rather than one tab apart.
const LIVE_FPS_MS = 33;             // ~30 fps: reports arrive at 250-1000 Hz and
                                    // redrawing per report would fight the UI.
// Byte offsets mirror src/input_buttons.h (RPT_L2_AXIS / RPT_R2_AXIS). Sticks
// occupy 0-3 ahead of them. Keep in step with the header.
const RPT_L2_AXIS_JS = 4, RPT_R2_AXIS_JS = 5;
function macroLiveReport(ev){
  const st = window._macroLive; if (!st) return;
  const d = ev.data; if (!d || d.byteLength < 10) return;
  // Decode only. NO DOM work here and no macroRender() - this runs up to 1000
  // times a second; the rAF writer below owns the drawing.
  st.mask = macroButtonMask(d);
  st.lx = d.getUint8(0); st.ly = d.getUint8(1);
  st.rx = d.getUint8(2); st.ry = d.getUint8(3);
  st.l2 = d.getUint8(RPT_L2_AXIS_JS); st.r2 = d.getUint8(RPT_R2_AXIS_JS);
  const f1 = macroTouchPoint(d, 0), f2 = macroTouchPoint(d, 1);
  st.f1 = f1; st.f2 = f2;
  if (f1 && f1.down && !st.tDown){ st.tDown = true; st.landX = f1.x; }
  else if (f1 && !f1.down) st.tDown = false;
  // THE HALF BITS ARE NOT IN THE REPORT. The pad is one physical switch: the
  // controller sets the generic click bit and nothing else, and 23/24 are
  // synthesised inside the firmware (apply_pad_half in macro.cpp) from where the
  // finger LANDED. macroButtonMask() therefore cannot produce them and a click
  // on either side reads as a plain "Touchpad click".
  //
  // The tester derives them the same way the firmware does, and LATCHES the
  // half for the whole press exactly as apply_pad_half does - re-deriving per
  // report would let a finger drifting across the middle flip the half
  // mid-press, which is the 1.30.2 bug. Gated on a finger being present, so a
  // knuckle or pad-edge click stays unqualified rather than reusing a stale
  // landing.
  if (st.mask & (1<<17)){
    if (!st.half) st.half = (st.tDown ? macroPadHalf(st.landX) : 0);
    st.mask |= st.half;
  } else st.half = 0;
  st.seen = (st.seen | st.mask) >>> 0;
  st.n++;
  const now = performance.now();
  if (now - st.rateAt >= 1000){ st.rate = Math.round(st.n * 1000 / (now - st.rateAt)); st.n = 0; st.rateAt = now; }
}
// ===== Tier 2: the visual pad =====

// several times a second), so the tick checks isConnected and re-injects.

// The macro stick threshold, in report counts, for the ring. A stick row with
// its own value wins; otherwise the firmware default (macro.h
// MACRO_STICK_THRESH = 48 of 127). Drawing it is what turns "why is my stick
// leaking through" into something you can see: inside the ring the row has not
// engaged, so REPLACE is not centring the stick.
const LP_STICK_THRESH_DEFAULT = 48;
function macroLiveThresh(right){
